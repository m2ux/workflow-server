id: evidence-probes
version: 2.0.0
name: Evidence Probes
description: Confirm the plan is approved, and open one probe per investigation area in it.
variables:
  reads:
    - investigation_areas
    - plan_approved
required: true
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Starting evidence probes — executing the approved investigation plan area by area
  - kind: action
    id: verify-plan-gate
    actions:
      - action: validate
        target: plan_approved
        condition:
          type: simple
          variable: plan_approved
          operator: ==
          value: true
        message: Evidence probing is blocked until the investigation plan is approved (plan-approval gate)
      - action: validate
        target: investigation_areas
        condition:
          type: simple
          variable: investigation_areas
          operator: exists
        message: Evidence probing is blocked until derived investigation areas are present in session state
exits:
  - id: done
    isDefault: true
outcome:
  - The plan is known to be approved and its areas present before any probe opens, so a run does not discover halfway through that it was never authorised
  - Every approved investigation area gets a probe of its own, so no area's evidence is shaped by what a neighbouring area happened to turn up first
