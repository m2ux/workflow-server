id: verdict-and-report
version: 1.3.0
name: Verdict and Report
description: Compute the merge-readiness verdict from accepted findings, render the review report with per-area accounting, and secure verdict sign-off.
variables:
  reads:
    - accepted_findings
    - has_pr_surface
    - investigation_areas
    - planning_folder_path
    - target_repo_path
  writes:
    - name: merge_readiness_verdict
      type: number
      description: The 1-5 verdict per the rubric scale (1 = not merge-ready, 5 = merge-ready).
    - name: plan_approved
      type: boolean
      description: Investigation-plan gate — set by the investigation-plan-approved checkpoint's approve option
      defaultValue: false
    - name: publish_requested
      type: boolean
      description: Publish gate — set by the publish-decision checkpoint's approve option
      defaultValue: false
    - name: review_report_path
      type: string
      description: Absolute path to the written review report.
      defaultValue: ""
    - name: review_summary
      type: string
      description: The rendered review text destined for the pull request — posted verbatim by the publish operation, byte-for-byte what sign-off approved.
      defaultValue: ""
    - name: review_type
      type: string
      description: The verdict-derived review action — `approve`, `request-changes`, or `comment` — per the rubric's verdict-to-review-type mapping. Always emitted, whether or not the run publishes.
required: true
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Starting verdict and report — computing merge readiness from the findings register
  - kind: technique
    id: compute-verdict
    technique: compute-verdict
  - kind: technique
    id: render-review
    technique: render-review
  - kind: technique
    id: verify-artifact-conformance
    technique:
      name: verify-artifact-conforms
      inputs:
        guide_map: midnight-system-review/README#planning-artifact-to-guide-map
  - kind: action
    id: enforce-accounting-gate
    actions:
      - action: validate
        message: Verdict presentation is blocked until the report's per-area accounting reconciles — every investigation area reports its probe and finding counts, every finding maps to exactly one area, and totals match the findings register (accounting reconciliation gate)
  - kind: checkpoint
    id: verdict-review
    message: "Merge-readiness verdict: {merge_readiness_verdict}/5 ({review_type}), with per-area accounting in the [review report]({review_report_path})."
    options:
      - id: accept-verdict
        label: Accept verdict and report
        description: The verdict, findings, and accounting are sound as presented.
      - id: revise-investigation
        label: Revise investigation
        description: Coverage or evidence is insufficient — return to area derivation; the plan is re-derived, re-approved, and the review re-runs from there.
        effect:
          setVariable:
            plan_approved: false
          exit: revise-investigation
  - kind: checkpoint
    id: publish-decision
    condition:
      type: simple
      variable: has_pr_surface
      operator: ==
      value: true
    message: The target has a pull-request surface that accepts a formal review comment.
    options:
      - id: publish
        label: Publish review to the PR
        description: Post the rendered review to the pull request with the verdict-derived review type.
        effect:
          setVariable:
            publish_requested: true
      - id: skip-publish
        label: Keep the review local
        description: The report stays in the planning folder; nothing is posted to the PR.
  - kind: action
    id: finalize-activity
    actions:
      - action: log
        message: Verdict and report complete — review signed off
exits:
  - id: publish-requested
    when: has_pr_surface == true && publish_requested == true
  - id: report-only
    isDefault: true
  - id: revise-investigation
outcome:
  - The merge-readiness verdict is computed from accepted findings only, per rubric, so it is reproducible and defensible
  - The report's per-area accounting reconciles before anyone reads a verdict, closing the silent-coverage-gap failure mode
  - An unsound verdict is caught at an explicit sign-off gate with a structural path back to plan-level rework
  - Publishing is a deliberate, separately-authorized decision made at its own checkpoint
