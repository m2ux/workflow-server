id: scope-intake
version: 1.3.0
name: Scope Intake
description: Resolve the authoritative change surface for the review target, establish toolchain availability, and confirm the review scope.
variables:
  reads:
    - base_ref
    - planning_folder_path
    - review_target
    - target_repo_path
  writes:
    - name: cargo_available
      type: boolean
      description: Whether a working cargo toolchain is available for the target checkout; gates build and metadata probes
      defaultValue: false
    - name: gitnexus_available
      type: boolean
      description: Whether the target checkout is GitNexus-indexed; gates code-graph probes, with grep and file reads as the fallback when false
      defaultValue: false
    - name: has_pr_surface
      type: boolean
      description: Whether review_target resolved to a pull request with a postable review surface; set during scope-intake, gates the publish-decision checkpoint and the publish-review activity
      defaultValue: false
    - name: node_binary_available
      type: boolean
      description: Whether a runnable midnight-node binary is available; gates runtime and SCALE-metadata probes
      defaultValue: false
    - name: pr_number
      type: string
      description: The pull request number.
    - name: repo_name
      type: string
      description: Name of the indexed graph covering the target checkout; every code-graph probe addresses it, and it is empty when no graph covers the checkout
      defaultValue: ""
required: true
techniques:
  - variable-binding
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Starting system review scope intake — resolving the change surface
  - kind: technique
    id: classify-review-target
    technique: classify-review-target
  - kind: technique
    id: view-pr
    technique:
      name: github-cli-protocol::view-pr
      inputs:
        repo_path: target_repo_path
    when: has_pr_surface == true
  - kind: technique
    id: list-pr-files
    technique:
      name: github-cli-protocol::list-pr-files
      inputs:
        repo_path: target_repo_path
    when: has_pr_surface == true
  - kind: technique
    id: three-dot-name-status
    technique:
      name: version-control::three-dot-name-status
      inputs:
        repo_path: target_repo_path
    when: has_pr_surface != true
  - kind: technique
    id: resolve-change-surface
    technique: resolve-change-surface
  - kind: technique
    id: detect-toolchain
    technique: detect-toolchain
  - kind: checkpoint
    id: scope-confirmed
    message: "Change surface resolved for '{review_target}': the changed-file inventory and review scope are recorded in change-surface.md. Proceeding to area derivation in 30s unless you want to revise the scope."
    defaultOption: proceed
    autoAdvanceMs: 30000
    options:
      - id: proceed
        label: Scope is correct
        description: The resolved change surface and review scope are accurate (default — auto-accepts after 30s).
      - id: revise-scope
        label: Revise scope
        description: The change surface or review scope needs adjustment — provide the correction; the surface is re-resolved before proceeding.
  - kind: action
    id: finalize-activity
    actions:
      - action: log
        message: Scope intake complete — change surface confirmed and toolchain availability recorded
exits:
  - id: done
    isDefault: true
outcome:
  - The review runs against the authoritative changed surface — the GitHub-listed file set or three-dot merge-base diff of authored changes
  - Publish eligibility is established up front, so the conditional publish tail is decided by data recorded at intake
  - Toolchain availability gates are set structurally, letting every downstream probe degrade gracefully while the run completes
  - A confirmed scope record exists before any investigation effort is spent
  - Transport leaves (view-pr, list-pr-files, three-dot-name-status) run as activity steps; resolve-change-surface only assembles the inventory artifact
