$schema: ../../schemas/workflow.schema.json
id: work-package
version: 4.1.0
title: Work Package Implementation Workflow
description: Defines how to carry ONE work package to the terminal state its mode reaches — implementation from inception to a merged pull request, or review from inception to a posted review awaiting the author's disposition. A work package is a discrete unit of work such as a feature, bug-fix, enhancement, refactoring, an audit of an existing pull request, or any other deliverable. For multiple related work packages, use the work-packages workflow to create a roadmap first.
author: m2ux
tags:
  - implementation
  - engineering
  - planning
  - feature
  - bug-fix
  - pr
  - review
fragments:
  checkpoints:
    assumption-interview:
      condition:
        type: and
        conditions:
          - type: simple
            variable: is_review_mode
            operator: "!="
            value: true
          - type: simple
            variable: has_open_assumptions
            operator: ==
            value: true
      message: "Open assumptions remain after analyse-challenge ({assumption_review_presentation}). Accept the agent's positions for the batch, defer all to stakeholders, or interview individually."
      options:
        - id: accept-agent-positions
          label: Accept agent positions
          description: Confirm the agent's favored positions for all listed residual open assumptions
          effect:
            setVariable:
              assumption_outcome: confirmed
        - id: defer-all
          label: Defer all to stakeholders
          description: Queue every listed open assumption for stakeholder review
          effect:
            setVariable:
              has_deferred_assumptions: true
              assumption_outcome: deferred
        - id: interview-individually
          label: Interview individually
          description: Walk each residual open assumption one at a time
          effect:
            setVariable:
              needs_individual_interview: true
    assumption-decision:
      message: "Assumption {current_assumption.id}: {current_assumption.statement}. Resolve now or defer."
      options:
        - id: resolve-inline
          label: Resolve now
          description: Provide resolution for this assumption
          effect:
            setVariable:
              assumption_outcome: confirmed
        - id: defer-to-stakeholder
          label: Defer to stakeholder review
          description: Queue this assumption for stakeholder review
          effect:
            setVariable:
              has_deferred_assumptions: true
              assumption_outcome: deferred
techniques:
  activity:
    - variable-binding
variables:
  - name: is_review_mode
    type: boolean
    description: True when the work package reviews an existing PR instead of producing a new implementation.
  - name: skip_optional_activities
    type: boolean
    description: Whether to skip optional discovery activities (elicitation and research).
    defaultValue: false
  - name: user_request
    type: string
    description: The user's free-form request that opened this work package.
  - name: target_path
    type: string
    description: Feature worktree path for edits, builds, and PR ops (not host_repo_path).
  - name: target_repo
    type: string
    description: GitHub repository as owner/repo. Supplies github-cli-protocol ops via name-match.
  - name: component_git_dir
    type: string
    description: Absolute path of the component's git working tree, whose origin remote names the component's repository.
  - name: planning_folder_path
    type: string
    description: "Path to planning folder: .engineering/artifacts/planning/YYYY-MM-DD-{work-package-name}."
  - name: provenance_log_path
    type: string
    description: Absolute path to the AI-assistance provenance log (provenance-log.md), created under the planning folder during implementation.
    defaultValue: ""
  - name: pr_number
    type: string
    description: Pull request number.
  - name: branch_name
    type: string
    description: Feature branch name.
  - name: default_branch
    type: string
    description: The repository's default branch, which feature branches sync from and merge into.
  - name: headless_mode
    type: boolean
    description: Whether the run resolves a soft mid-flow gate to its default without reaching a person. A review run sets it true.
    defaultValue: false
  - name: safety_floor_cleared
    type: boolean
    description: Whether the applied simplifications hold the ponytail safety floor.
    defaultValue: false
  - name: issue_type
    type: string
    description: What kind of change the ticket records.
    values:
      - feature
      - bug
      - task
      - enhancement
      - epic
  - name: needs_further_discussion
    type: boolean
    description: Whether further stakeholder discussion is needed.
    defaultValue: false
  - name: needs_plan_revision
    type: boolean
    description: Whether stakeholder feedback requires returning to plan-prepare for significant approach revision.
    defaultValue: false
  - name: has_open_questions
    type: boolean
    description: Whether unresolved open questions remain after the codebase comprehension deep-dive.
    defaultValue: false
  - name: skip_architecture_summary
    type: boolean
    description: Whether to skip architecture summary creation.
    defaultValue: false
  - name: flagged_block_indices
    type: array
    description: List of change block indices flagged by user during manual diff review.
  - name: question_domains
    type: array
    description: Question domains for requirements elicitation iteration.
  - name: jira_issue_key
    type: string
    description: "Jira issue key in PROJ-NNN form, captured during issue verification when issue_platform == 'jira'."
    defaultValue: ""
  - name: block_path
    type: string
    description: File path of the code block referenced by the current PR-review comment or implementation block.
    defaultValue: ""
  - name: block_line_range
    type: string
    description: Line range (e.g., 120-145) of the current code block.
    defaultValue: ""
  - name: implementation_plan
    type: object
    description: Implementation plan.
  - name: issue_title
    type: string
    description: Tracker issue/ticket title; used by naming-conventions to derive the branch name.
  - name: stealth_mode
    type: boolean
    description: Suppresses public-disclosure side-effects (PR rendering and creation, issue-tracker posting, PR review lifecycle) when a private.
    defaultValue: false
  - name: push_remote
    type: string
    description: "Git remote that manage-git::push-commits (and the stealth-mode isolation checks) target."
    defaultValue: origin
  - name: assumption_outcome
    type: string
    description: The outcome the deciding gate gave the assumption under discussion. Empty before any gate has decided one.
    defaultValue: ""
  - name: issue_request
    type: string
    description: The issue key, URL, or surrounding text the user supplied when opening the work package.
    defaultValue: ""
initialActivity: start-work-package
graph:
  start-work-package:
    done: design-philosophy
  design-philosophy:
    done: codebase-comprehension
  requirements-elicitation:
    research-needed: research
    no-research-needed: implementation-analysis
    elicitation-incomplete: requirements-elicitation
  research:
    done: implementation-analysis
  implementation-analysis:
    done: plan-prepare
  plan-prepare:
    done: assumptions-review
  assumptions-review:
    needs-comprehension: codebase-comprehension
    needs-plan-revision: plan-prepare
    needs-further-discussion: assumptions-review
    review-mode: lean-coding-audit
    assumptions-approved: implement
  implement:
    done: lean-coding-audit
  lean-coding-audit:
    done: post-impl-review
  post-impl-review:
    done: validate
    has-blocker: implement
  validate:
    done: strategic-review
  strategic-review:
    review-mode: submit-for-review
    review-passed: submit-for-review
    review-failed: plan-prepare
  submit-for-review:
    review-mode: complete
    review-approved: complete
    review-requires-changes: plan-prepare
    provide-input: submit-for-review
    abort: complete
  codebase-comprehension:
    needs-elicitation: requirements-elicitation
    research-needed: research
    skip-optional-activities: plan-prepare
    comprehension-complete: implementation-analysis
