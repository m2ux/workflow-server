id: assumptions-review
version: 2.13.0
name: Assumptions Review
description: Converge open assumptions via analyse-challenge, then batch residual stakeholder judgements.
variables:
  reads:
    - branch_name
    - component_git_dir
    - has_resolvable_assumptions
    - is_review_mode
    - issue_number
    - issue_platform
    - needs_comprehension
    - needs_further_discussion
    - needs_plan_revision
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - stealth_mode
    - target_path
    - target_repo
  writes:
    - name: assumption_outcome
      type: string
      description: The outcome the deciding gate gave the assumption under discussion. Empty before any gate has decided one.
      defaultValue: ""
    - name: assumption_review_presentation
      type: object
      description: Structured judgement-augmentation context for decision, shaped like the Open Assumptions entry fields of the assumptions log template (decision space, non-resolvability rationale, technical context, agent's position, reversibility) plus a link to the assumptions log.
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: current_assumption
      type: object
      description: Current assumption during assumption review loop (from task_assumptions).
    - name: has_deferred_assumptions
      type: boolean
      description: Whether any assumptions were deferred during review (triggers issue tracker posting).
      defaultValue: false
    - name: has_open_assumptions
      type: boolean
      description: Whether unresolved assumptions remain after analyse-challenge that require stakeholder input.
      defaultValue: false
    - name: has_resolvable_assumptions
      type: boolean
      description: Whether code-resolvable assumptions exist that can be validated through targeted analysis.
      defaultValue: false
    - name: needs_individual_interview
      type: boolean
      description: Whether the residual batch checkpoint selected individual drill-down.
      defaultValue: false
    - name: open_assumptions
      type: array
      description: Residual open assumptions after analyse-challenge for batch presentation and optional individual forEach drill-down.
    - name: post_summary_approved
      type: boolean
      description: Whether the deferred-assumptions summary is posted to the issue tracker, as decided at the post-summary-review gate.
      defaultValue: false
required: true
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: evaluate-open-assumptions
    technique: review-assumptions::collect
  - kind: technique
    id: analyse-challenge-loop
    technique:
      name: analyse-challenge::run-loop
      inputs:
        concern_kind: assumptions
        analyse_technique: review-assumptions::reconcile
        challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
        concern_document: assumptions_log
        concerns_agent_resolvable: has_resolvable_assumptions
        residual_opens_remain: has_open_assumptions
        residual_opens: open_assumptions
      outputs:
        concerns_agent_resolvable: has_resolvable_assumptions
        residual_opens_remain: has_open_assumptions
        residual_opens: open_assumptions
  - kind: technique
    id: present-residual-assumptions
    technique:
      name: review-assumptions::interview
      inputs:
        assembly_mode: batch
    when: is_review_mode != true && has_open_assumptions == true
  - kind: checkpoint
    id: residual-assumption-batch
    ref: assumption-interview
  - kind: technique
    id: record-batch-decision
    technique: review-assumptions::record
    when: is_review_mode != true && has_open_assumptions == true && needs_individual_interview != true
  - kind: loop
    id: assumption-interview-loop
    name: Individual Assumption Interview Loop
    loopType: forEach
    variable: current_assumption
    over: open_assumptions
    when: is_review_mode != true && needs_individual_interview == true && has_open_assumptions == true
    steps:
      - kind: technique
        id: present-assumption
        technique:
          name: review-assumptions::interview
          inputs:
            assembly_mode: interview
      - kind: checkpoint
        id: assumption-decision#{current_assumption.id}
        condition:
          type: simple
          variable: is_review_mode
          operator: "!="
          value: true
        message: "Assumption {current_assumption.id}: {current_assumption.statement}"
        options:
          - id: accept
            label: Accept assumption
            description: This assumption is valid — proceed with it
            effect:
              setVariable:
                assumption_outcome: confirmed
          - id: reject
            label: Reject assumption
            description: This assumption is wrong — provide a correction
            effect:
              setVariable:
                assumption_outcome: corrected
          - id: defer
            label: Defer
            description: Not enough information to decide now — revisit later
            effect:
              setVariable:
                has_deferred_assumptions: true
                assumption_outcome: deferred
      - kind: technique
        id: record-decision
        technique: review-assumptions::record
  - kind: technique
    id: update-assumptions-log
    technique: review-assumptions::record
  - kind: checkpoint
    id: post-summary-review
    condition:
      type: and
      conditions:
        - type: simple
          variable: stealth_mode
          operator: "!="
          value: true
        - type: simple
          variable: is_review_mode
          operator: "!="
          value: true
        - type: simple
          variable: issue_platform
          operator: exists
        - type: simple
          variable: has_deferred_assumptions
          operator: ==
          value: true
    message: Some assumptions were deferred and need external stakeholder attention. Select whether to post the summary to {issue_platform}.
    options:
      - id: post-summary
        label: Post summary to issue tracker
        description: Post the resolution summary
        effect:
          setVariable:
            post_summary_approved: true
      - id: skip-posting
        label: Skip posting
        description: Do not post to issue tracker
        effect:
          setVariable:
            post_summary_approved: false
  - kind: technique
    id: post-summary-jira
    technique: atlassian-operations::comment-jira-issue
    when: stealth_mode != true && is_review_mode != true && issue_platform == 'jira' && has_deferred_assumptions == true && post_summary_approved == true
  - kind: technique
    id: post-summary-github
    technique:
      name: github-cli-protocol::comment-issue
      inputs:
        repo_path: component_git_dir
    when: stealth_mode != true && is_review_mode != true && issue_platform == 'github' && has_deferred_assumptions == true && post_summary_approved == true
exits:
  - id: needs-comprehension
    when: needs_comprehension == true
  - id: needs-plan-revision
    when: needs_plan_revision == true
  - id: needs-further-discussion
    when: needs_further_discussion == true
  - id: review-mode
    when: is_review_mode == true
  - id: assumptions-approved
    isDefault: true
outcome:
  - Open assumptions converged through analyse-challenge before any residual ask
  - Residual stakeholder judgements batched (or individually reviewed only when requested)
  - Implementation can proceed on a vetted set of assumption decisions, with any deferred items explicitly tracked
  - External stakeholders are notified of deferred assumptions that need their attention
