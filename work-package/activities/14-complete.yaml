id: complete
version: 1.10.0
name: Complete Work Package
description: Wrap up the work package after PR merge (or after review-mode close-out).
variables:
  reads:
    - branch_name
    - component_git_dir
    - host_repo_path
    - is_review_mode
    - issue_number
    - planning_folder_path
    - pr_number
    - problem_complexity
    - target_path
    - target_repo
    - worktree_created
  writes:
    - name: artifact_publish_ref
      type: string
      description: Engineering checkout's branch name, the ref engineering-artifact hyperlinks in the consolidated review resolve against.
      defaultValue: ""
    - name: broken_artifact_links
      type: array
      description: Planning-folder links that do not resolve, each { file, link, target, class }.
      defaultValue: []
    - name: completion_document_path
      type: string
      description: Path to the close-out document.
      defaultValue: ""
    - name: worktree_created
      type: boolean
      description: True when a worktree at target_path was created or reused by this workflow run (only those worktrees are eligible for cleanup).
      defaultValue: false
required: true
steps:
  - kind: technique
    id: create-adr
    technique: create-adr
    when: is_review_mode != true && (problem_complexity == "moderate" || problem_complexity == "complex")
  - kind: technique
    id: update-adr-status
    technique: finalize-documentation::update-adr
    when: is_review_mode != true && (problem_complexity == "moderate" || problem_complexity == "complex")
  - kind: technique
    id: finalize-test-plan
    technique: finalize-documentation::finalize-test-plan
    when: is_review_mode != true
  - kind: technique
    id: create-complete-doc
    technique: finalize-documentation::create-complete-doc
  - kind: technique
    id: render-token-usage
    technique: finalize-documentation::render-token-usage
  - kind: technique
    id: ensure-docs
    technique: finalize-documentation::ensure-docs
    when: is_review_mode != true
  - kind: technique
    id: read-session
    technique: workflow-engine::read-session
  - kind: technique
    id: conduct-retrospective
    technique: conduct-retrospective::retrospective
  - kind: action
    id: announce-retrospective
    actions:
      - action: message
        message: "Retrospective written to the [close-out document]({completion_document_path}), within the item budget."
  - kind: technique
    id: verify-artifact-links
    technique: manage-artifacts::verify-artifact-links
    actions:
      - action: validate
        target: broken_artifact_links == []
        message: "Planning artifacts carry links that do not resolve: {broken_artifact_links}. Repoint each to a target that resolves at the publish ref, then re-run."
  - kind: technique
    id: resolve-close-out-publish
    technique: resolve-artifact-publish
    when: is_review_mode == true
  - kind: technique
    id: publish-close-out-artifacts
    technique:
      name: manage-git::artifact-commits
      inputs:
        activity_name: complete
        issue_key: issue_number
        files: publishable_files
        branch: artifact_publish_ref
    when: is_review_mode == true
  - kind: technique
    id: remove-worktree
    technique: manage-git::remove-worktree
    when: worktree_created == true
  - kind: technique
    id: select-next
    technique: conduct-retrospective::select-next
    actions:
      - action: message
        message: |-
          Hand-off for the next work package:

          {next_work_package_context}
  - kind: action
    id: announce-completion
    actions:
      - action: log
        message: Work package workflow complete
outcome:
  - The key design decision is durably recorded for future reference when complexity is moderate or complex
  - Project documentation reflects the delivered change
  - A reader of the close-out learns what was delivered, what it cost, and what remains, on both the implementation and review paths
  - Lessons learned are captured to improve future work packages
  - Every link a reader follows out of the planning folder resolves at the ref the artifacts are published on
  - The temporary worktree this work package created is cleaned up, leaving no orphaned workspaces
  - Reference monorepo left untouched
  - Ready for next work package
