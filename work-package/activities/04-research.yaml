id: research
version: 2.18.0
name: Research
description: Research the knowledge base and external sources to discover best practices, patterns, and resources to inform the plan-prepare activity.
variables:
  reads:
    - assumption_outcome
    - branch_name
    - component_git_dir
    - has_resolvable_assumptions
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - target_path
    - target_repo
  writes:
    - name: assumption_outcome
      type: string
      description: The outcome the deciding gate gave the assumption under discussion. Empty before any gate has decided one.
      defaultValue: ""
    - name: assumption_review_presentation
      type: object
      description: Structured judgement-augmentation context for decision, shaped like the Open Assumptions entry fields of the assumptions log template (decision space, non-resolvability rationale, technical context, agent's position, reversibility) plus a link to the assumptions log.
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: context_scope
      type: string
      description: Provenance scope of AI-generated code in this work package.
      defaultValue: repo-only
    - name: context_scope_uncertain
      type: boolean
      description: True when research run evidence cannot decide repo-only vs web-retrieval vs mixed for context_scope.
      defaultValue: false
    - name: current_assumption
      type: object
      description: Current assumption during assumption review loop (from task_assumptions).
    - name: has_deferred_assumptions
      type: boolean
      description: Whether any assumptions were deferred during review (triggers issue tracker posting).
      defaultValue: false
    - name: has_open_assumptions
      type: boolean
      description: Whether unresolved assumptions remain after analyse-challenge that require stakeholder input.
      defaultValue: false
    - name: has_reconcilable_research
      type: boolean
      description: Whether open research-reconcilable candidates remain — gaps further knowledge-base or web research could close.
      defaultValue: false
    - name: has_resolvable_assumptions
      type: boolean
      description: Whether code-resolvable assumptions exist that can be validated through targeted analysis.
      defaultValue: false
    - name: needs_individual_interview
      type: boolean
      description: Whether the residual batch checkpoint selected individual drill-down.
      defaultValue: false
    - name: needs_research
      type: boolean
      description: Whether research phase is needed.
      defaultValue: false
    - name: open_assumptions
      type: array
      description: Residual open assumptions after analyse-challenge for batch presentation and optional individual forEach drill-down.
    - name: research_candidates
      type: array
      description: Inventory of open research gaps surfaced after synthesis, each triaged as reconcilable-by-research or irreconcilable, with rationale and.
required: false
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: research-knowledge-base
    technique: research
  - kind: technique
    id: synthesize
    technique: synthesize
  - kind: technique
    id: triage-research-candidates
    technique: triage
  - kind: loop
    id: research-reconciliation
    name: Research Reconciliation Loop
    loopType: doWhile
    condition:
      type: simple
      variable: has_reconcilable_research
      operator: ==
      value: true
    maxIterations: 10
    steps:
      - kind: technique
        id: reconcile-research-candidates
        technique: reconcile
        when: has_reconcilable_research == true
      - kind: checkpoint
        id: research-convergence
        condition:
          type: simple
          variable: has_reconcilable_research
          operator: ==
          value: false
        message: "Research has converged. Full candidate inventory ([Open Research Candidates]({research_document})): {research_candidates}."
        defaultOption: accept-research
        autoAdvanceMs: 30000
        options:
          - id: accept-research
            label: Accept — proceed to planning
            description: Research is complete; remaining open candidates are irreconcilable by research and are carried to their handoff targets (stakeholder interview, assumption reconciliation, or recorded out-of-scope).
          - id: request-more
            label: Direct further research
            description: Reopen the loop to research a named candidate further — provide the focus in your response; the next pass incorporates it.
            effect:
              setVariable:
                has_reconcilable_research: true
  - kind: technique
    id: collect-assumptions
    technique:
      name: review-assumptions::collect
      inputs:
        assumption_categories: Pattern Applicability, Source Relevance, Synthesis Decisions, Risk Assessment
  - kind: technique
    id: document
    technique: document
  - kind: technique
    id: update-assumptions-log
    technique: review-assumptions::record
  - kind: technique
    id: analyse-challenge-loop
    technique:
      name: analyse-challenge::run-loop
      inputs:
        concern_kind: assumptions
        analyse_technique: review-assumptions::reconcile
        challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
        concern_document: assumptions_log
        convergence_flag: has_resolvable_assumptions
        residue_flag: has_open_assumptions
        residue_collection: open_assumptions
      outputs:
        convergence_flag: has_resolvable_assumptions
        residue_flag: has_open_assumptions
        residue_collection: open_assumptions
  - kind: technique
    id: present-resolved-assumptions
    technique:
      name: review-assumptions::interview
      inputs:
        assembly_mode: batch
    actions:
      - action: message
        message: "**Assumptions** — analyse-challenge outcomes (resolved via analysis/challenge; residual opens listed when any remain)."
  - kind: action
    id: close-research-phase
    actions:
      - action: set
        target: needs_research
        value: false
        description: Research has run and left its artifact, so the phase is no longer outstanding and a later return to an earlier activity routes past it.
  - kind: action
    id: derive-context-scope
    actions:
      - action: set
        target: context_scope
        description: "From research run evidence — repo-only when no external web sources informed design; web-retrieval when only web did; mixed when both repository/kb and web did. Leave prior/default when evidence is insufficient and set context_scope_uncertain instead."
      - action: set
        target: context_scope_uncertain
        description: true only when run evidence cannot decide among repo-only / web-retrieval / mixed; false when context_scope was derived confidently
  - kind: action
    id: announce-derived-context-scope
    when: context_scope_uncertain != true
    actions:
      - action: message
        message: "Research context scope derived as `{context_scope}`."
  - kind: checkpoint
    id: context-scope-declaration
    condition:
      type: simple
      variable: context_scope_uncertain
      operator: ==
      value: true
    message: Research context scope could not be derived from run evidence. Declare whether research used repository only, external web sources, or both.
    defaultOption: repo-only
    autoAdvanceMs: 15000
    options:
      - id: repo-only
        label: Repository only — no external web sources used
        description: All research was based on codebase and local knowledge (default)
        effect:
          setVariable:
            context_scope: repo-only
            context_scope_uncertain: false
      - id: web-retrieval
        label: External web sources used for design decisions
        description: Web search, external docs, or third-party references informed the approach
        effect:
          setVariable:
            context_scope: web-retrieval
            context_scope_uncertain: false
      - id: mixed
        label: Both repository and external sources used
        description: Mix of codebase analysis and external references
        effect:
          setVariable:
            context_scope: mixed
            context_scope_uncertain: false
  - kind: checkpoint
    id: research-assumption-interview
    ref: assumption-interview
  - kind: technique
    id: record-batch-response
    technique: review-assumptions::record
    when: has_open_assumptions == true && needs_individual_interview != true
  - kind: loop
    id: assumption-interview
    name: Individual Assumption Interview Loop
    loopType: forEach
    variable: current_assumption
    over: open_assumptions
    maxIterations: 20
    when: needs_individual_interview == true && has_open_assumptions == true
    steps:
      - kind: technique
        id: present-assumption
        technique:
          name: review-assumptions::interview
          inputs:
            assembly_mode: interview
      - kind: checkpoint
        id: research-assumption-decision#{current_assumption.id}
        ref: assumption-decision
      - kind: technique
        id: record-response
        technique: review-assumptions::record
exits:
  - id: done
    isDefault: true
outcome:
  - Best practices identified from multiple sources
  - Patterns validated and mapped to requirements
  - Risks and anti-patterns documented
