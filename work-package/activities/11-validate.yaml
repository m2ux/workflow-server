id: validate
version: 3.8.0
name: Verify & Validate Design
description: Validate the implementation against tests, build, format, and lint checks when the local environment can run them.
required: true
steps:
  - kind: action
    id: mark-validation-na
    when: run_local_validation == false
    actions:
      - action: set
        target: mark_progress_na
        value: true
  - kind: technique
    id: preflight
    technique: cargo-operations::preflight
    when: project_type == 'rust-substrate' && run_local_validation == true
    actions:
      - action: validate
        target: missing_prerequisites.length == 0
        message: "Toolchain prerequisites are unmet, so the validation suite cannot run: {missing_prerequisites}"
  # Process-unit suite spine mirrors meta/patterns/06-process-unit-fan-out.yaml
  - kind: action
    id: seed-cargo-process-suite
    when: project_type == 'rust-substrate' && run_local_validation == true
    actions:
      - action: set
        target: work_units
        description: >-
          Ordered cargo suite units (process-unit pattern): check, clippy, test,
          fmt-check — each an invocation spec against build_scope `--workspace`
          (and features when set), carrying that op's resource budget (nice -n 19
          + CARGO_BUILD_JOBS cap; fmt-check uses nice only). On tight RAM, lower
          CARGO_BUILD_JOBS across compiling units or set dispatch_concurrency to 1.
      - action: set
        target: dispatch_concurrency
        description: >-
          Prefer concurrent same-context cargo units when the host can absorb four;
          use 1 when RAM or shared mutation requires sequential
          check/clippy/test/fmt-check. Activity owns this bound.
  - kind: action
    id: execute-and-gather-cargo-units
    when: project_type == 'rust-substrate' && run_local_validation == true
    actions:
      - action: set
        target: unit_results
        description: >-
          Run every cargo unit in work_units under dispatch_concurrency (concurrent
          same-context process when greater than one; sequential when one). Wait
          for all four. Append each outcome into unit_results in suite order with
          unit keys check, clippy, test, fmt-check (ordered gather; never overwrite).
  - kind: action
    id: require-cargo-unit-results
    when: project_type == 'rust-substrate' && run_local_validation == true
    actions:
      - action: validate
        target: unit_results
        message: >-
          unit_results must hold ordered check/clippy/test/fmt-check outcomes
          before the validation combine runs.
  - kind: technique
    id: combine-validation-results
    technique: cargo-operations::run-suite
    when: project_type == 'rust-substrate' && run_local_validation == true
  - kind: technique
    id: document-failures
    technique:
      name: findings-classification
      inputs:
        findings_to_classify: "{validation_results.failed_checks}"
    when: is_review_mode == true
  - kind: technique
    id: assess-test-coverage
    technique: review-test-suite
    when: is_review_mode == true
  - kind: technique
    id: triage-reported-failures
    technique: review-test-suite
    when: is_review_mode == true
  - kind: action
    id: fix-failures
    when: is_review_mode != true && run_local_validation == true && validation_results.validation_passed == false
    actions: []
  - kind: loop
    id: fix-revalidate-cycle
    name: Fix and Revalidate Cycle
    loopType: doWhile
    condition:
      type: and
      conditions:
        - type: simple
          variable: run_local_validation
          operator: ==
          value: true
        - type: simple
          variable: validation_results.validation_passed
          operator: ==
          value: false
    maxIterations: 10
    steps:
      - kind: technique
        id: analyze-failure
        technique:
          name: validate-build::analyze-failure
          inputs:
            check_id: "{validation_results.first_failure.check_id}"
            failure_diagnostics: "{validation_results.first_failure.diagnostics}"
      - kind: technique
        id: apply-fix
        technique:
          name: validate-build::apply-fix
          inputs:
            check_id: "{validation_results.first_failure.check_id}"
      - kind: action
        id: reseed-cargo-process-suite
        actions:
          - action: set
            target: work_units
            description: >-
              Recompose the ordered cargo suite units (check, clippy, test, fmt-check)
              against build_scope `--workspace` with the same resource-budget envelope
              as seed-cargo-process-suite.
          - action: set
            target: dispatch_concurrency
            description: Same concurrency policy as the initial process-unit suite.
      - kind: action
        id: re-execute-and-gather-cargo-units
        actions:
          - action: set
            target: unit_results
            description: >-
              Re-run every cargo unit under dispatch_concurrency; wait-all; ordered
              gather into unit_results (same contract as execute-and-gather-cargo-units).
      - kind: action
        id: require-recargo-unit-results
        actions:
          - action: validate
            target: unit_results
            message: >-
              unit_results must hold ordered check/clippy/test/fmt-check outcomes
              before the validation recombine runs.
      - kind: technique
        id: recombine-validation-results
        technique: cargo-operations::run-suite
transitions:
  - to: strategic-review
    isDefault: true
outcome:
  - All tests passing when the suite ran locally, or Progress Validation marked cancelled/N/A when local validation was unavailable
  - Build successful when the agent ran the suite
