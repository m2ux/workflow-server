id: validate
version: 3.8.0
name: Verify & Validate Design
description: Validate the implementation against tests, build, format, and lint checks when the local environment can run them.
required: true
steps:
  - kind: action
    id: mark-validation-na
    when: run_local_validation == false
    actions:
      - action: set
        target: mark_progress_na
        value: true
  - kind: technique
    id: preflight
    technique: cargo-operations::preflight
    when: project_type == 'rust-substrate' && run_local_validation == true
    actions:
      - action: validate
        target: missing_prerequisites.length == 0
        message: "Toolchain prerequisites are unmet, so the validation suite cannot run: {missing_prerequisites}"
  - kind: action
    id: compose-cargo-suite-units
    when: project_type == 'rust-substrate' && run_local_validation == true
    actions:
      - action: set
        target: work_units
        description: >-
          Ordered cargo suite units for unit-fan-out: check, clippy, test, fmt-check —
          each an invocation spec against build_scope `--workspace` (and features when set),
          carrying that op's resource budget (nice -n 19 + CARGO_BUILD_JOBS cap; fmt-check
          uses nice only). On tight RAM, lower CARGO_BUILD_JOBS across compiling units or
          set dispatch_concurrency to 1 for the following fan-out step.
      - action: set
        target: dispatch_concurrency
        description: >-
          Prefer concurrent scatter when the host can absorb four cargo units; use 1 when
          RAM or shared mutation requires sequential check/clippy/test/fmt-check.
  - kind: technique
    id: fan-out-cargo-suite
    technique: unit-fan-out
    when: project_type == 'rust-substrate' && run_local_validation == true
  - kind: technique
    id: combine-validation-results
    technique: cargo-operations::run-suite
    when: project_type == 'rust-substrate' && run_local_validation == true
  - kind: technique
    id: document-failures
    technique:
      name: findings-classification
      inputs:
        findings_to_classify: "{validation_results.failed_checks}"
    condition:
      type: simple
      variable: is_review_mode
      operator: ==
      value: true
  - kind: technique
    id: assess-test-coverage
    technique: review-test-suite
    condition:
      type: simple
      variable: is_review_mode
      operator: ==
      value: true
  - kind: technique
    id: triage-reported-failures
    technique: review-test-suite
    condition:
      type: simple
      variable: is_review_mode
      operator: ==
      value: true
  - kind: action
    id: fix-failures
    condition:
      type: and
      conditions:
        - type: simple
          variable: is_review_mode
          operator: "!="
          value: true
        - type: simple
          variable: run_local_validation
          operator: ==
          value: true
        - type: simple
          variable: validation_results.validation_passed
          operator: ==
          value: false
    actions: []
  - kind: loop
    id: fix-revalidate-cycle
    name: Fix and Revalidate Cycle
    loopType: doWhile
    condition:
      type: and
      conditions:
        - type: simple
          variable: run_local_validation
          operator: ==
          value: true
        - type: simple
          variable: validation_results.validation_passed
          operator: ==
          value: false
    maxIterations: 10
    steps:
      - kind: technique
        id: analyze-failure
        technique:
          name: validate-build::analyze-failure
          inputs:
            check_id: "{validation_results.first_failure.check_id}"
            failure_diagnostics: "{validation_results.first_failure.diagnostics}"
      - kind: technique
        id: apply-fix
        technique:
          name: validate-build::apply-fix
          inputs:
            check_id: "{validation_results.first_failure.check_id}"
      - kind: action
        id: recompose-cargo-suite-units
        actions:
          - action: set
            target: work_units
            description: >-
              Recompose the ordered cargo suite units (check, clippy, test, fmt-check)
              against build_scope `--workspace` with the same resource-budget envelope
              as compose-cargo-suite-units.
          - action: set
            target: dispatch_concurrency
            description: Same concurrency policy as the initial fan-out step.
      - kind: technique
        id: refan-out-cargo-suite
        technique: unit-fan-out
      - kind: technique
        id: recombine-validation-results
        technique: cargo-operations::run-suite
transitions:
  - to: strategic-review
    isDefault: true
outcome:
  - All tests passing when the suite ran locally, or Progress Validation marked cancelled/N/A when local validation was unavailable
  - Build successful when the agent ran the suite
