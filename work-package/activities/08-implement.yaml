id: implement
version: 2.16.0
name: Implement Tasks
description: Execute the implementation plan task by task.
variables:
  reads:
    - branch_name
    - component_git_dir
    - has_resolvable_assumptions
    - has_uncertain_symbols
    - host_repo_path
    - implementation_plan
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - target_path
    - target_repo
  writes:
    - name: assumption_outcome
      type: string
      description: The outcome the deciding gate gave the assumption under discussion. Empty before any gate has decided one.
      defaultValue: ""
    - name: assumption_review_presentation
      type: object
      description: Structured judgement-augmentation context for decision, shaped like the Open Assumptions entry fields of the assumptions log template (decision space, non-resolvability rationale, technical context, agent's position, reversibility) plus a link to the assumptions log.
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: current_assumption
      type: object
      description: Current assumption during assumption review loop (from task_assumptions).
    - name: current_task
      type: object
      description: Current task during implementation loop (from implementation_plan.tasks).
    - name: failures
      type: array
      description: Per-test failure detail when any failed
      defaultValue: []
    - name: has_deferred_assumptions
      type: boolean
      description: Whether any assumptions were deferred during review (triggers issue tracker posting).
      defaultValue: false
    - name: has_open_assumptions
      type: boolean
      description: Whether unresolved assumptions remain after analyse-challenge that require stakeholder input.
      defaultValue: false
    - name: has_resolvable_assumptions
      type: boolean
      description: Whether code-resolvable assumptions exist that can be validated through targeted analysis.
      defaultValue: false
    - name: has_uncertain_symbols
      type: boolean
      description: True when the current implement task's self-review flagged one or more symbols whose provenance could not be confirmed.
      defaultValue: false
    - name: needs_individual_interview
      type: boolean
      description: Whether the residual batch checkpoint selected individual drill-down.
      defaultValue: false
    - name: open_assumptions
      type: array
      description: Residual open assumptions after analyse-challenge for batch presentation and optional individual forEach drill-down.
    - name: test_status
      type: string
      description: Pass/fail summary
      defaultValue: ""
    - name: uncertain_symbols
      type: string
      description: "Multi-line list of symbols flagged by the implement task-cycle self-review whose provenance could not be confirmed (one per line: symbol."
      defaultValue: ""
required: true
techniques:
  - scatter-gather
steps:
  - kind: action
    id: verify-preconditions
    actions:
      - action: validate
        target: branch
        message: Verify on correct feature branch before any code changes
  - kind: loop
    id: task-cycle
    name: Task Implementation Cycle
    loopType: forEach
    variable: current_task
    over: implementation_plan.tasks
    breakCondition:
      type: simple
      variable: has_uncertain_symbols
      operator: "=="
      value: true
    steps:
      - kind: technique
        id: implement-task
        technique: implement-task
      - kind: technique
        id: run-tests
        technique:
          name: cargo-operations::test
          inputs:
            build_scope: -p {current_task.crate}
      - kind: technique
        id: commit
        technique: manage-git::artifact-commits
      - kind: technique
        id: log-provenance
        technique:
          name: dco-provenance::append-task-row
          inputs:
            task_id: "{current_task.id}"
            task_description: "{current_task.description}"
      - kind: technique
        id: self-review
        technique: task-completion-review
      - kind: checkpoint
        id: symbol-provenance-confirmed
        condition:
          type: simple
          variable: has_uncertain_symbols
          operator: ==
          value: true
        message: |-
          One or more symbols in this task could not be confirmed against the codebase or declared dependencies:

          {uncertain_symbols}
        options:
          - id: confirmed
            label: Symbols are intentional — proceed
            description: The flagged symbols were introduced intentionally by this task, or were verified by hand.
            effect:
              setVariable:
                has_uncertain_symbols: false
          - id: uncertain
            label: Investigate before proceeding
            description: The flagged symbols remain unaccounted for.
            effect:
              setVariable:
                has_uncertain_symbols: true
      - kind: technique
        id: collect-assumptions
        technique: review-assumptions::collect
  - kind: technique
    id: analyse-challenge-loop
    technique:
      name: analyse-challenge::run-loop
      inputs:
        concern_kind: assumptions
        analyse_technique: review-assumptions::reconcile
        challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
        concern_document: assumptions_log
        convergence_flag: has_resolvable_assumptions
        residue_flag: has_open_assumptions
        residue_collection: open_assumptions
      outputs:
        convergence_flag: has_resolvable_assumptions
        residue_flag: has_open_assumptions
        residue_collection: open_assumptions
  - kind: technique
    id: present-resolved-assumptions
    technique:
      name: review-assumptions::interview
      inputs:
        assembly_mode: batch
    actions:
      - action: message
        message: "**Assumptions** — analyse-challenge outcomes for implementation (residual opens listed when any remain)."
  - kind: checkpoint
    id: implementation-assumption-interview
    ref: assumption-interview
  - kind: technique
    id: record-batch-response
    technique: review-assumptions::record
    when: has_open_assumptions == true && needs_individual_interview != true
  - kind: loop
    id: assumption-interview
    name: Individual Assumption Interview Loop
    loopType: forEach
    variable: current_assumption
    over: open_assumptions
    maxIterations: 20
    when: needs_individual_interview == true && has_open_assumptions == true
    steps:
      - kind: technique
        id: present-assumption
        technique:
          name: review-assumptions::interview
          inputs:
            assembly_mode: interview
      - kind: checkpoint
        id: implementation-assumption-decision#{current_assumption.id}
        ref: assumption-decision
      - kind: technique
        id: record-response
        technique: review-assumptions::record
  - kind: technique
    id: update-assumptions-log
    technique: review-assumptions::record
exits:
  - id: done
    isDefault: true
outcome:
  - All tasks implemented
  - The implemented work is captured as reviewable, attributable commits on the feature branch
  - An auditable per-task record of what changed and why exists to support the later DCO attestation
