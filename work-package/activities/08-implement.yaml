id: implement
version: 2.17.0
name: Implement Tasks
description: Execute the implementation plan task by task.
variables:
  reads:
    - branch_name
    - component_git_dir
    - has_resolvable_assumptions
    - has_uncertain_symbols
    - host_repo_path
    - implementation_plan
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - target_path
    - target_repo
  writes:
    - name: assumption_outcome
      type: string
      description: The outcome given the assumption under discussion. Empty before one has been decided.
      defaultValue: ""
    - name: assumption_review_presentation
      type: object
      description: Judgement-augmentation context per open assumption — decision space, non-resolvability rationale, technical context, agent's position, reversibility — with a link to the assumptions log.
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: current_assumption
      type: object
      description: The assumption under individual review.
    - name: current_task
      type: object
      description: The implementation-plan task under construction.
    - name: failures
      type: array
      description: Per-test failure detail when any failed
      defaultValue: []
    - name: has_deferred_assumptions
      type: boolean
      description: Whether any assumption was deferred to stakeholders.
      defaultValue: false
    - name: has_open_assumptions
      type: boolean
      description: Whether unresolved assumptions requiring stakeholder input remain.
      defaultValue: false
    - name: has_resolvable_assumptions
      type: boolean
      description: Whether code-resolvable assumptions exist that can be validated through targeted analysis.
      defaultValue: false
    - name: has_uncertain_symbols
      type: boolean
      description: True when one or more symbols in the task under construction have unconfirmed provenance.
      defaultValue: false
    - name: needs_individual_interview
      type: boolean
      description: Whether each residual open assumption is reviewed one at a time.
      defaultValue: false
    - name: open_assumptions
      type: array
      description: The residual open assumptions awaiting a stakeholder judgement.
    - name: test_status
      type: string
      description: Pass/fail summary
      defaultValue: ""
    - name: uncertain_symbols
      type: string
      description: "Symbols whose provenance could not be confirmed against the codebase or declared dependencies, one per line."
      defaultValue: ""
required: true
techniques:
  - scatter-gather
steps:
  - kind: loop
    id: task-cycle
    name: Task Implementation Cycle
    loopType: forEach
    variable: current_task
    over: implementation_plan.tasks
    steps:
      - kind: technique
        id: implement-task
        technique: implement-task
      - kind: technique
        id: run-tests
        technique:
          name: cargo-operations::test
          inputs:
            build_scope: -p {current_task.crate}
      - kind: technique
        id: commit
        technique: manage-git::artifact-commits
      - kind: technique
        id: log-provenance
        technique:
          name: dco-provenance::append-task-row
          inputs:
            task_id: "{current_task.id}"
            task_description: "{current_task.description}"
      - kind: loop
        id: provenance-settle-cycle
        name: Symbol Provenance Settle Cycle
        loopType: doWhile
        continueWhile:
          type: simple
          variable: has_uncertain_symbols
          operator: ==
          value: true
        maxIterations: 3
        steps:
          - kind: technique
            id: self-review
            technique: task-completion-review
          - kind: checkpoint
            id: symbol-provenance-confirmed
            condition:
              type: simple
              variable: has_uncertain_symbols
              operator: ==
              value: true
            message: |-
              One or more symbols in this task could not be confirmed against the codebase or declared dependencies:

              {uncertain_symbols}
            options:
              - id: confirmed
                label: Symbols are intentional
                description: The flagged symbols were introduced intentionally by this task, or were verified by hand.
                effect:
                  setVariable:
                    has_uncertain_symbols: false
              - id: uncertain
                label: Trace the flagged symbols again
                description: The flagged symbols remain unaccounted for and the task's self-review runs again over them.
                effect:
                  setVariable:
                    has_uncertain_symbols: true
      - kind: technique
        id: collect-assumptions
        technique: review-assumptions::collect
  - kind: technique
    id: analyse-challenge-loop
    technique:
      name: analyse-challenge::run-loop
      inputs:
        concern_kind: assumptions
        analyse_technique: review-assumptions::reconcile
        challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
        concern_document: assumptions_log
        concerns_agent_resolvable: has_resolvable_assumptions
        residual_opens_remain: has_open_assumptions
        residual_opens: open_assumptions
      outputs:
        concerns_agent_resolvable: has_resolvable_assumptions
        residual_opens_remain: has_open_assumptions
        residual_opens: open_assumptions
  - kind: technique
    id: present-resolved-assumptions
    technique:
      name: review-assumptions::interview
      inputs:
        assembly_mode: batch
    actions:
      - action: message
        message: |-
          **Assumptions**

          {assumption_review_presentation}
  - kind: checkpoint
    id: implementation-assumption-interview
    ref: assumption-interview
  - kind: technique
    id: record-batch-response
    technique: review-assumptions::record
    when: has_open_assumptions == true && needs_individual_interview != true
  - kind: loop
    id: assumption-interview
    name: Individual Assumption Interview Loop
    loopType: forEach
    variable: current_assumption
    over: open_assumptions
    maxIterations: 20
    when: needs_individual_interview == true && has_open_assumptions == true
    steps:
      - kind: technique
        id: present-assumption
        technique:
          name: review-assumptions::interview
          inputs:
            assembly_mode: interview
      - kind: checkpoint
        id: implementation-assumption-decision#{current_assumption.id}
        ref: assumption-decision
      - kind: technique
        id: record-response
        technique: review-assumptions::record
  - kind: technique
    id: update-assumptions-log
    technique: review-assumptions::record
exits:
  - id: done
    isDefault: true
outcome:
  - All tasks implemented
  - The implemented work is captured as reviewable, attributable commits on the feature branch
  - An auditable per-task record of what changed and why exists to support the later DCO attestation
