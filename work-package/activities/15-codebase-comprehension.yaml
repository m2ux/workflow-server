id: codebase-comprehension
version: 1.13.0
name: Codebase Comprehension
description: Build or augment a mental model of the codebase.
variables:
  reads:
    - branch_name
    - component_git_dir
    - gitnexus_indexed
    - host_repo_path
    - needs_comprehension
    - needs_elicitation
    - needs_research
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - skip_optional_activities
    - target_path
    - target_repo
  writes:
    - name: challenge_findings
      type: object
      description: Per-perspective challenge findings over the concern set, keyed by perspective name.
    - name: comprehension_artifact
      type: string
      description: The comprehension corpus artifact for the current codebase area, carrying what is settled about it.
      defaultValue: ""
    - name: comprehension_artifact_path
      type: string
      description: Absolute path the comprehension corpus artifact was written to, for user-facing links.
      defaultValue: ""
    - name: comprehension_dir
      type: string
      description: Absolute path of the cumulative codebase-comprehension corpus, outside any one session's planning folder.
    - name: comprehension_scope
      type: string
      description: Whether the next deep-dive deepens the area under study or moves to a different one.
      values:
        - same-area
        - new-area
      defaultValue: same-area
    - name: has_open_questions
      type: boolean
      description: Whether unresolved open questions remain after the codebase comprehension deep-dive.
      defaultValue: false
    - name: needs_comprehension
      type: boolean
      description: Whether codebase comprehension is outstanding.
      defaultValue: true
required: false
techniques:
  - scatter-gather
steps:
  - kind: action
    id: bind-comprehension-dir
    actions:
      - action: set
        target: comprehension_dir
        value: "{host_repo_path}/.engineering/artifacts/comprehension"
  - kind: technique
    id: build-comprehension
    technique:
      name: survey
      outputs:
        comprehension_survey: comprehension_artifact
  - kind: technique
    id: create-comprehension-artifact
    technique:
      name: manage-artifacts::write-artifact
      inputs:
        artifact_content: comprehension_artifact
        target_dir: comprehension_dir
      outputs:
        written_artifact: comprehension_artifact_path
    actions:
      - action: message
        message: "[Comprehension artifact]({comprehension_artifact_path}) recorded for the next work package on this area."
  - kind: loop
    id: deep-dive-iteration
    name: Deep-Dive Iteration
    loopType: while
    continueWhile:
      type: simple
      variable: needs_comprehension
      operator: ==
      value: true
    steps:
      - kind: technique
        id: deep-dive
        technique: codebase-comprehension::deep-dive
      - kind: technique
        id: revise-questions
        technique: revise-questions
      - kind: technique
        id: challenge-open-questions
        technique:
          name: analyse-challenge::challenge
          inputs:
            challenge_perspectives: '["pedagogy", "rejected-paths"]'
            concern_document: comprehension_artifact
      - kind: technique
        id: combine-question-challenges
        technique:
          name: analyse-challenge::combine
          inputs:
            concern_document: comprehension_artifact
          outputs:
            concern_document: comprehension_artifact
            concerns_agent_resolvable: needs_comprehension
            residual_opens_remain: has_open_questions
      - kind: technique
        id: update-artifact
        technique:
          name: manage-artifacts::write-artifact
          inputs:
            artifact_content: comprehension_artifact
            target_dir: comprehension_dir
          outputs:
            written_artifact: comprehension_artifact_path
      - kind: technique
        id: record-log
        technique:
          name: manage-artifacts::write-artifact
          inputs:
            artifact_content: comprehension_log
      - kind: checkpoint
        id: comprehension-sufficient
        condition:
          type: simple
          variable: has_open_questions
          operator: ==
          value: true
        message: "Open questions remain in the [comprehension artifact]({comprehension_artifact_path})."
        defaultOption: sufficient
        autoAdvanceMs: 30000
        options:
          - id: sufficient
            label: Understanding sufficient
            description: Accept remaining gaps and proceed
            effect:
              setVariable:
                needs_comprehension: false
          - id: dive-deeper
            label: Dive deeper
            description: The remaining open questions warrant more detail in this area
            effect:
              setVariable:
                needs_comprehension: true
                comprehension_scope: same-area
          - id: different-area
            label: Explore a different area
            description: A different part of the codebase warrants comprehension
            effect:
              setVariable:
                needs_comprehension: true
                comprehension_scope: new-area
exits:
  - id: needs-elicitation
    when: needs_elicitation == true
  - id: research-needed
    when: needs_elicitation == false && needs_research == true
  - id: skip-optional-activities
    when: skip_optional_activities == true
  - id: comprehension-complete
    isDefault: true
outcome:
  - Mental model of codebase architecture established
  - Key abstractions and design rationale documented
  - Domain concepts mapped to technical constructs
  - A reusable comprehension reference lands in the cumulative corpus, where the next work package on the same area reads it instead of re-investigating
  - The questions, investigations and follow-ups behind that reference stay in the session's planning folder as a comprehension log
  - Open questions converged via analyse-challenge before the soft sufficiency gate
