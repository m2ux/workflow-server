id: codebase-comprehension
version: 1.12.0
name: Codebase Comprehension
description: Build or augment a mental model of the codebase.
variables:
  reads:
    - branch_name
    - component_git_dir
    - gitnexus_indexed
    - has_open_questions
    - host_repo_path
    - needs_comprehension
    - needs_elicitation
    - needs_research
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - skip_optional_activities
    - target_path
    - target_repo
  writes:
    - name: comprehension_artifact
      type: string
      description: Absolute path to the comprehension artifact for the current codebase area.
      defaultValue: ""
    - name: comprehension_dir
      type: string
      description: Absolute path of the cumulative codebase-comprehension corpus, outside any one session's planning folder.
    - name: has_open_questions
      type: boolean
      description: Whether unresolved open questions remain after the codebase comprehension deep-dive.
      defaultValue: false
    - name: needs_comprehension
      type: boolean
      description: Whether codebase comprehension is needed (mandatory after design-philosophy; may be re-requested after stakeholder feedback).
      defaultValue: true
required: false
techniques:
  - scatter-gather
steps:
  - kind: action
    id: bind-comprehension-dir
    actions:
      - action: set
        target: comprehension_dir
        value: "{host_repo_path}/.engineering/artifacts/comprehension"
  - kind: technique
    id: build-comprehension
    technique: survey
  - kind: technique
    id: create-comprehension-artifact
    technique:
      name: manage-artifacts::write-artifact
      inputs:
        artifact_content: comprehension_survey
        target_dir: comprehension_dir
    actions:
      - action: message
        message: Comprehension artifact recorded for reference.
  - kind: technique
    id: initial-deep-dive
    technique: deep-dive
  - kind: technique
    id: update-artifact-initial
    technique:
      name: manage-artifacts::write-artifact
      inputs:
        artifact_content: comprehension_artifact
        target_dir: comprehension_dir
  - kind: technique
    id: revise-initial-questions
    technique: revise-questions
  - kind: technique
    id: record-log-initial
    technique:
      name: manage-artifacts::write-artifact
      inputs:
        artifact_content: comprehension_log
  - kind: loop
    id: deep-dive-iteration
    name: Deep-Dive Iteration
    loopType: while
    continueWhile:
      type: simple
      variable: needs_comprehension
      operator: ==
      value: true
    steps:
      - kind: technique
        id: analyse-challenge-pass
        technique:
          name: analyse-challenge::run-loop
          inputs:
            concern_kind: open_questions
            analyse_technique: codebase-comprehension::deep-dive
            challenge_perspectives: '["pedagogy", "rejected-paths"]'
            concern_document: comprehension_artifact
            concerns_agent_resolvable: needs_comprehension
            residual_opens_remain: has_open_questions
            iteration_mode: once
          outputs:
            concerns_agent_resolvable: needs_comprehension
            residual_opens_remain: has_open_questions
      - kind: technique
        id: update-artifact
        technique:
          name: manage-artifacts::write-artifact
          inputs:
            artifact_content: comprehension_artifact
            target_dir: comprehension_dir
      - kind: technique
        id: record-log
        technique:
          name: manage-artifacts::write-artifact
          inputs:
            artifact_content: comprehension_log
      - kind: checkpoint
        id: comprehension-sufficient
        condition:
          type: simple
          variable: has_open_questions
          operator: ==
          value: true
        message: Open questions remain after analyse-challenge (see above). Select whether understanding is sufficient or further exploration is needed.
        defaultOption: sufficient
        autoAdvanceMs: 30000
        options:
          - id: sufficient
            label: Understanding sufficient
            description: Accept remaining gaps and proceed
            effect:
              setVariable:
                needs_comprehension: false
          - id: dive-deeper
            label: Dive deeper
            description: Investigate remaining open questions in more detail
            effect:
              setVariable:
                needs_comprehension: true
          - id: different-area
            label: Explore a different area
            description: Shift focus to a different part of the codebase
            effect:
              setVariable:
                needs_comprehension: true
exits:
  - id: needs-elicitation
    when: needs_elicitation == true
  - id: research-needed
    when: needs_elicitation == false && needs_research == true
  - id: skip-optional-activities
    when: skip_optional_activities == true
  - id: comprehension-complete
    isDefault: true
outcome:
  - Mental model of codebase architecture established
  - Key abstractions and design rationale documented
  - Domain concepts mapped to technical constructs
  - A reusable comprehension reference lands in the cumulative corpus, where the next work package on the same area reads it instead of re-investigating
  - The questions, investigations and follow-ups behind that reference stay in the session's planning folder as a comprehension log
  - Open questions converged via analyse-challenge before the soft sufficiency gate
