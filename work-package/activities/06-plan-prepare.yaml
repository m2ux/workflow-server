id: plan-prepare
version: 1.12.0
name: Plan & Prepare
description: Design the approach, create the work package plan, and prepare for implementation.
variables:
  reads:
    - assumption_outcome
    - branch_name
    - component_git_dir
    - default_branch
    - has_resolvable_assumptions
    - host_repo_path
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - review_summary
    - stealth_mode
    - target_path
    - target_repo
  writes:
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: body_conforms
      type: boolean
      description: True once the rendered PR body satisfies every conformance criterion in the pr-description guide.
      defaultValue: false
    - name: body_findings
      type: array
      description: List of PR-body conformance violations.
      defaultValue: []
    - name: has_deferred_assumptions
      type: boolean
      description: Whether any assumptions were deferred during review (triggers issue tracker posting).
      defaultValue: false
    - name: has_open_assumptions
      type: boolean
      description: Whether unresolved assumptions remain after analyse-challenge that require stakeholder input.
      defaultValue: false
    - name: has_resolvable_assumptions
      type: boolean
      description: Whether code-resolvable assumptions exist that can be validated through targeted analysis.
      defaultValue: false
    - name: open_assumptions
      type: array
      description: Residual open assumptions after analyse-challenge for batch presentation and optional individual forEach drill-down.
    - name: rendered_pr_body
      type: string
      description: The body now live on the PR after the patch.
    - name: stakeholder_overview
      type: string
      description: The two-paragraph plain-language overview written under `{readme_section_heading}` in the planning folder README.
required: true
techniques:
  - scatter-gather
steps:
  - kind: action
    id: env-prerequisites
    actions:
      - action: validate
        target: workflows.worktree.present == true
        message: The workflows worktree is missing. From the parent repo root run 'git worktree add ./workflows workflows' (see SETUP.md).
      - action: validate
        target: target_path != null
        message: target_path is unset. Re-enter start-work-package if its compute-canonical-target-path step was skipped.
      - action: validate
        target: host_repo_path != null
        message: host_repo_path is unset. Re-enter start-work-package if its resolve-repo-root step was skipped.
      - action: validate
        target: planning_folder_path.writable == true
        message: planning_folder_path is not writable. Confirm the path exists and is writable.
      - action: validate
        target: gh.auth.status == 0
        message: gh CLI is not authenticated. Authenticate (or refresh an expired token) at your preferred scope before re-running.
        condition:
          type: simple
          variable: stealth_mode
          operator: "!="
          value: true
      - action: validate
        target: gpg.agent.reachable == true
        message: GPG agent is not reachable. Ensure it is running at your preferred scope before re-running.
  - kind: technique
    id: create-plan
    technique: plan
  - kind: technique
    id: create-test-plan
    technique: create-test-plan
  - kind: technique
    id: present-solution-overview
    technique:
      name: stakeholder-overview
      inputs:
        readme_section_heading: "## Solution Overview"
    actions:
      - action: message
        message: |-
          **Solution Overview** — plain-language summary for stakeholder reference

          {stakeholder_overview}
  - kind: technique
    id: collect-assumptions
    technique:
      name: review-assumptions::collect
      inputs:
        assumption_categories: Design Approach, Task Breakdown, Dependency Assumptions, Test Strategy, Scope Decisions
  - kind: technique
    id: update-assumptions-log
    technique: review-assumptions::record
  - kind: technique
    id: analyse-challenge-loop
    technique:
      name: analyse-challenge::run-loop
      inputs:
        concern_kind: assumptions
        analyse_technique: review-assumptions::reconcile
        challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
        concern_document: assumptions_log
        convergence_flag: has_resolvable_assumptions
        residue_flag: has_open_assumptions
        residue_collection: open_assumptions
      outputs:
        convergence_flag: has_resolvable_assumptions
        residue_flag: has_open_assumptions
        residue_collection: open_assumptions
  - kind: technique
    id: create-todos
    technique: create-todos
  - kind: technique
    id: sync-branch
    technique: manage-git::sync-branch
  - kind: technique
    id: update-pr
    technique:
      name: update-pr::render
      inputs:
        pr_template_variant: initial
    when: is_review_mode != true && stealth_mode != true
  - kind: checkpoint
    id: approach-confirmed
    condition:
      type: simple
      variable: is_review_mode
      operator: "!="
      value: true
    message: Approach presented above. Select whether to confirm or revise.
    defaultOption: confirmed
    autoAdvanceMs: 30000
    options:
      - id: confirmed
        label: Approach confirmed
        description: Proceed with this approach
      - id: revise
        label: Revise approach
        description: Adjust the approach before planning continues
        effect:
          exit: revise
exits:
  - id: done
    isDefault: true
  - id: revise
    immediate: true
outcome:
  - A sequenced approach the implement activity can execute against task by task, put to the user for a decision before implementation begins
  - A defined verification strategy that validation will run the implementation against
  - Reviewers and stakeholders can see the intended approach on the PR before any code is written
