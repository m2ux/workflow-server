id: strategic-review
version: 2.14.0
name: Strategic Review
description: Review the implementation to ensure changes are minimal and focused.
required: true
steps:
  - kind: technique
    id: review-strategy
    technique: review-scope
  - kind: technique
    id: refresh-pr-body
    technique:
      name: update-pr::render
      inputs:
        pr_template_variant: final
    when: is_review_mode != true && stealth_mode != true
  - kind: checkpoint
    id: unsigned-commits-prompt
    condition:
      type: and
      conditions:
        - type: simple
          variable: is_review_mode
          operator: "!="
          value: true
        - type: simple
          variable: unsigned_commits_in_pr
          operator: ==
          value: true
    message: "Signature scan reports one or more commits without a valid GPG signature in this branch range: {unsigned_commit_list_summary}. Select whether to re-sign all unsigned commits now. Re-signing rewrites branch history and may require force-with-lease push."
    blocking: true
    options:
      - id: resign-all
        label: Yes — re-sign all unsigned commits
        description: Rewrites commits with GPG signatures using git rebase; confirm signing key is available
        effect:
          setVariable:
            resign_unsigned_commits_requested: true
      - id: decline-resign
        label: No — proceed without re-signing
        description: Keep history as-is; note unsigned commits in strategic-review documentation
        effect:
          setVariable:
            resign_unsigned_commits_requested: false
  - kind: technique
    id: resign-unsigned-commits
    technique: resign-commits
    when: is_review_mode != true && resign_unsigned_commits_requested == true
  - kind: technique
    id: verify-artifact-conformance
    technique:
      name: verify-artifact-conforms
      inputs:
        canonical_home_map: manage-artifacts#canonical-home-map
        guide_map: work-package/README#planning-artifact-to-guide-map
  - kind: technique
    id: verify-readme
    technique:
      name: workflow-engine::verify-readme-conforms
      inputs:
        seed_profile: work-package/readme-seed
  - kind: technique
    id: ensure-changes-folder-entry
    technique: changes-folder
  - kind: technique
    id: verify-change-fragment
    technique: verify-fragment
    actions:
      - action: validate
        target: fragment_references_issue != false
        message: "Change fragment for this work package does not reference issue_url ({issue_url}). Add a 'Closes: #{issue_number}' line (GitHub) or the full issue_url (when sibling fragments use that style) to the fragment body, commit, and re-run."
        condition:
          type: simple
          variable: stealth_mode
          operator: "!="
          value: true
  - kind: technique
    id: document-findings
    technique: document-findings
  - kind: technique
    id: document-cleanup-recommendations
    technique: recommend-cleanup
    when: is_review_mode == true
  - kind: technique
    id: apply-cleanup
    technique: apply-cleanup
    when: is_review_mode != true
  - kind: technique
    id: create-architecture-summary
    technique: summarize-architecture
  - kind: technique
    id: analyze-strategic-findings
    technique: strategic-findings-analysis
  - kind: checkpoint
    id: review-findings
    condition:
      type: and
      conditions:
        - type: simple
          variable: is_review_mode
          operator: "!="
          value: true
        - type: simple
          variable: strategic_findings_summary
          operator: "!="
          value: ""
    message: |-
      Strategic review complete.

      Findings:
      {strategic_findings_summary}

      Recommended action: {recommended_strategic_option}.
    blocking: true
    options:
      - id: acceptable
        label: All acceptable
        description: Findings noted but no changes needed
        effect:
          setVariable:
            review_passed: true
      - id: fix-findings
        label: Fix findings before proceeding
        description: Address strategic review findings now
        effect:
          setVariable:
            strategic_findings_actionable: true
      - id: selective-fixes
        label: Fix selected findings
        description: Choose which findings to fix, by priority
        effect:
          setVariable:
            strategic_findings_actionable: true
            strategic_fixes_selective: true
      - id: defer-findings
        label: Defer findings
        description: Note findings for future but proceed now
        effect:
          setVariable:
            review_passed: true
            strategic_findings_deferred: true
      - id: more-review
        label: Need more review
        description: Additional areas need examination
  - kind: checkpoint
    id: findings-delivery
    condition:
      type: and
      conditions:
        - type: simple
          variable: is_review_mode
          operator: ==
          value: true
        - type: simple
          variable: strategic_findings_summary
          operator: "!="
          value: ""
    message: |-
      Strategic review complete. Every finding is the pull-request author's to act on; this gate decides which of them the posted review carries.

      Findings:
      {strategic_findings_summary}

      Recommended action: {recommended_strategic_option}.
    blocking: true
    defaultOption: raise-all
    autoAdvanceMs: 30000
    options:
      - id: raise-all
        label: Raise all findings to the author
        description: The posted review carries every finding
        effect:
          setVariable:
            findings_raised_to_author: all
            review_passed: true
      - id: raise-selected
        label: Raise selected findings
        description: The posted review carries the findings named in the reply; the report keeps the rest
        effect:
          setVariable:
            findings_raised_to_author: selected
            review_passed: true
      - id: raise-none
        label: Raise none
        description: The report keeps every finding and the posted review carries none of them
        effect:
          setVariable:
            findings_raised_to_author: none
            review_passed: true
transitions:
  - to: submit-for-review
    condition:
      type: simple
      variable: is_review_mode
      operator: ==
      value: true
  - to: submit-for-review
    condition:
      type: simple
      variable: review_passed
      operator: ==
      value: true
  - to: plan-prepare
    isDefault: true
outcome:
  - Changes validated as minimal and focused
  - Investigation artifacts and over-engineering removed
  - A record of scope and quality findings exists for reviewers to act on
  - Stakeholders have an architecture overview to understand the change
  - This work will appear in the project's release notes, traceable to the issue, when the repo uses a root changes/ convention
