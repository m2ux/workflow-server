id: post-impl-review
version: 1.22.0
name: Post-Implementation Review
description: Review implementation quality before validation.
required: true
triggers:
  - workflow: prism
    description: Run the full analytical pipeline over the change surface when the problem is complex; a simpler one binds prism/structural-analysis inline instead.
    passContext:
      - target_path
      - component_name
      - issue_title
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Starting post-implementation review
  - kind: technique
    id: gitnexus-detect-changes-preflight
    technique: gitnexus-operations::detect-changes
    when: gitnexus_indexed == true
  - kind: technique
    id: manual-diff-review
    technique: review-diff
  - kind: checkpoint
    id: file-index-table
    message: "Change-block index: {change_block_index}, Block titles link to file:line. Review the diff in your side-by-side app, then reply with the block numbers of any blocks with issues (e.g. '24, 31') or 'none', plus any rationale corrections (recorded in the [manual diff review report]({code_review_report})). Your confirmation is the provenance attestation for each change."
    blocking: false
    defaultOption: rationale-confirmed
    autoAdvanceMs: 30000
    options:
      - id: rationale-confirmed
        label: Rationale confirmed — no issues
        description: Agent rationale paragraphs are accurate. All changes understood. Proceed with automated reviews.
      - id: rationale-confirmed-with-issues
        label: Rationale confirmed (with corrections) — issues found
        description: Provide rationale corrections (recorded in the [manual diff review report]({code_review_report})) and comma-separated block indices with issues
        effect:
          setVariable:
            has_flagged_blocks: true
      - id: has-issues
        label: Issues found — rationale not yet reviewed
        description: Enter comma-separated list of block indices with issues; rationale review deferred
        effect:
          setVariable:
            has_flagged_blocks: true
  - kind: loop
    id: block-interview-loop
    name: Block Interview Loop
    loopType: forEach
    variable: current_block_index
    over: flagged_block_indices
    maxIterations: 50
    when: has_flagged_blocks == true
    steps:
      - kind: checkpoint
        id: block-interview#{current_block_index}
        message: "Reviewing block {current_block_index}: {block_path}:{block_line_range}. Record the issue with this change, or mark it as a critical blocker — then the next flagged block."
        blocking: false
        defaultOption: issue-recorded
        autoAdvanceMs: 30000
        options:
          - id: issue-recorded
            label: Issue recorded - continue
            description: Move to next flagged block
          - id: critical-blocker
            label: This is a critical blocker
            description: Mark as blocking issue that must be fixed
            effect:
              setVariable:
                has_critical_blocker: true
          - id: skip-block
            label: Skip this block
            description: No longer an issue, move to next
  - kind: technique
    id: code-review
    technique: review-code
  - kind: technique
    id: structural-analysis-inline
    technique: prism/structural-analysis
    when: problem_complexity != 'complex'
  - kind: technique
    id: dispatch-prism
    when: problem_complexity == 'complex'
    technique:
      name: workflow-engine::handle-sub-workflow
      inputs:
        workflow_id: prism
  - kind: technique
    id: test-suite-review
    technique: review-test-suite
  - kind: loop
    id: review-fix-cycle
    name: Review-Fix Cycle
    loopType: doWhile
    when: is_review_mode != true
    condition:
      type: or
      conditions:
        - type: simple
          variable: code_findings_actionable
          operator: ==
          value: true
        - type: simple
          variable: test_findings_actionable
          operator: ==
          value: true
    maxIterations: 3
    steps:
      - kind: technique
        id: apply-fixes
        technique: apply-review-fixes
      - kind: action
        id: reset-fix-flags
        actions:
          - action: set
            target: code_findings_actionable
            value: false
          - action: set
            target: test_findings_actionable
            value: false
      - kind: technique
        id: re-manual-diff-review
        technique: review-diff
      - kind: technique
        id: re-code-review
        technique: review-code
      - kind: technique
        id: re-test-suite-review
        technique: review-test-suite
  - kind: technique
    id: architecture-summary
    technique: summarize-architecture
    required: false
    when: skip_architecture_summary != true
  - kind: technique
    id: classify-and-route-findings
    technique:
      name: findings-classification
      inputs:
        findings_to_classify: manual_diff_review_report
  - kind: checkpoint
    id: local-validation-permission
    message: The project's validation suite either runs here against the checked-out head, or its result is recorded as not run.
    blocking: true
    condition:
      type: simple
      variable: has_critical_blocker
      operator: "!="
      value: true
    options:
      - id: run-suite
        label: Run the suite against the checked-out head
        description: The validate activity runs the project suite in this environment and records what it reports
        effect:
          setVariable:
            run_local_validation: true
      - id: suite-not-run
        label: Record validation as not run
        description: Progress Validation is recorded as cancelled/N/A and the run states that the suite was not exercised here
        effect:
          setVariable:
            run_local_validation: false
decisions:
  - id: blocker-gate
    name: Critical Blocker Gate
    branches:
      - id: has-blocker
        label: Critical blocker found — return to implement
        condition:
          type: simple
          variable: has_critical_blocker
          operator: ==
          value: true
        transitionTo: implement
      - id: no-blocker
        label: No critical blockers — proceed to validate
        isDefault: true
transitions:
  - to: validate
    isDefault: true
outcome:
  - Every change block has a confirmed rationale and provenance attestation, so reviewers can trust each change is understood and intentional
  - Code-level defects and risks are surfaced and triaged before validation
  - Structural risks across the change set are identified for triage
  - Test coverage gaps are surfaced so they can be closed before validation
  - A stakeholder-readable architecture overview is available when the change warrants one
