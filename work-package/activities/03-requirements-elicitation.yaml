id: requirements-elicitation
version: 2.12.0
name: Requirements Elicitation
description: Discover and clarify what the work package should accomplish through structured sequential conversation.
variables:
  reads:
    - assumption_outcome
    - branch_name
    - component_git_dir
    - issue_number
    - issue_platform
    - needs_research
    - planning_folder_path
    - pr_number
    - problem_statement
    - question_domains
    - requirements
    - target_path
    - target_repo
  writes:
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: current_domain
      type: string
      description: Current question domain during elicitation loop (from question_domains).
    - name: elicitation_complete
      type: boolean
      description: Whether requirements elicitation is finished.
      defaultValue: false
    - name: has_deferred_assumptions
      type: boolean
      description: Whether any assumption was deferred to stakeholders.
      defaultValue: false
    - name: has_open_assumptions
      type: boolean
      description: Whether unresolved assumptions requiring stakeholder input remain.
      defaultValue: false
    - name: has_resolvable_assumptions
      type: boolean
      description: Whether code-resolvable assumptions exist that can be validated through targeted analysis.
      defaultValue: false
    - name: needs_elicitation
      type: boolean
      description: Whether requirements elicitation is needed.
      defaultValue: false
    - name: open_assumptions
      type: array
      description: The residual open assumptions awaiting a stakeholder judgement.
    - name: requirements
      type: array
      description: The captured requirements list elicited across the domains.
      defaultValue: []
required: false
steps:
  - kind: technique
    id: stakeholder-discussion
    technique: discuss
  - kind: technique
    id: elicit-requirements
    technique: elicit
  - kind: loop
    id: domain-iteration
    name: Question Domain Iteration
    loopType: forEach
    variable: current_domain
    over: question_domains
    maxIterations: 5
    steps:
      - kind: technique
        id: ask-question
        technique: ask-question
  - kind: technique
    id: collect-assumptions
    technique:
      name: review-assumptions::collect
      inputs:
        assumption_categories: Requirement Interpretation, Scope Boundaries, Implicit Requirements, Success Criteria Interpretation
  - kind: technique
    id: create-document
    technique: create-document
  - kind: technique
    id: update-assumptions-log
    technique: review-assumptions::record
  - kind: technique
    id: reconcile-assumptions
    technique: review-assumptions::reconcile
  - kind: checkpoint
    id: elicitation-complete
    message: Every question domain has been covered.
    defaultOption: complete
    autoAdvanceMs: 30000
    options:
      - id: complete
        label: Elicitation complete
        description: Requirements are captured
        effect:
          setVariable:
            elicitation_complete: true
            needs_elicitation: false
      - id: revisit-domain
        label: Revisit a domain
        description: Ask more questions in a specific domain before finalizing
        effect:
          setVariable:
            elicitation_complete: false
      - id: add-requirements
        label: Add additional requirements
        description: Capture requirements not covered by the question domains
        effect:
          setVariable:
            elicitation_complete: false
  - kind: loop
    id: assumption-reconciliation
    name: Assumption Reconciliation Loop
    loopType: while
    continueWhile:
      type: simple
      variable: has_resolvable_assumptions
      operator: ==
      value: true
    steps:
      - kind: technique
        id: reconcile-iteration
        technique: review-assumptions::reconcile
exits:
  - id: no-research-needed
    when: elicitation_complete == true && needs_research == false
  - id: elicitation-incomplete
    when: elicitation_complete == false
  - id: research-needed
    when: elicitation_complete == true && needs_research == true
    isDefault: true
outcome:
  - Requirements explicitly captured through structured conversation
  - Success criteria defined with verification methods
  - A single authoritative reference of requirements and scope boundaries that planning and review can build against
