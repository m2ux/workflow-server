id: lean-coding-audit
version: 1.6.0
name: Lean-Coding Audit
description: Apply the ponytail lean-coding lens to the just-implemented change.
variables:
  reads:
    - branch_name
    - component_git_dir
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - safety_floor_cleared
    - target_path
    - target_repo
  writes:
    - name: has_debt_markers
      type: boolean
      description: Whether at least one ponytail debt marker was found in the tree.
      defaultValue: false
    - name: needs_simplification
      type: boolean
      description: Whether accepted simplifications remain to apply at the audit-findings-confirmed gate.
      defaultValue: false
    - name: review_findings
      type: array
      description: The tagged findings for the change, each under a stable `LC-{n}` designator so a reader and a caller reference the same finding — carrying a taxonomy tag, the location, the simpler alternative, and the lines it would save — closing with the diff-scoped scoreboard.
required: true
steps:
  - kind: technique
    id: review-over-engineering
    technique: ponytail/review-over-engineering
  - kind: technique
    id: harvest-debt
    technique: ponytail/harvest-debt
  - kind: technique
    id: report-gain
    technique: ponytail/report-gain
    when: has_debt_markers == true
  - kind: checkpoint
    id: audit-findings-confirmed
    condition:
      type: simple
      variable: is_review_mode
      operator: "!="
      value: true
    message: "Lean-coding audit complete. Select whether to accept the audit as-is, apply the recommended simplifications, or flag the findings for correction."
    options:
      - id: audit-accepted
        label: Accept audit — no changes to apply
        description: The audit findings and scoreboard are accurate; apply no simplifications and proceed.
      - id: apply-simplifications
        label: Apply recommended simplifications
        description: Apply the accepted simplifications in a bounded cycle, then re-score.
        effect:
          setVariable:
            needs_simplification: true
      - id: audit-findings-disputed
        label: Findings need correction
        description: The findings require correction; record the dispute and apply no simplifications this pass.
        effect:
          setVariable:
            needs_simplification: false
  - kind: loop
    id: simplification-apply-cycle
    name: Simplification Apply Cycle
    loopType: doWhile
    when: is_review_mode != true
    condition:
      type: simple
      variable: needs_simplification
      operator: ==
      value: true
    maxIterations: 3
    steps:
      - kind: technique
        id: apply-simplifications
        technique: ponytail/apply-ladder
      - kind: technique
        id: re-review-over-engineering
        technique: ponytail/review-over-engineering
      - kind: action
        id: validate-safety-floor
        actions:
          - action: validate
            target: safety_floor_cleared == true
            message: Confirm the applied simplifications hold the safety floor — reject any simplification that breaches it.
      - kind: action
        id: reassess-simplification
        actions:
          - action: set
            target: needs_simplification
            message: After applying the accepted simplifications and re-running the over-engineering re-score, set true iff the re-score still surfaces accepted-but-unapplied simplifications that hold the safety floor; false when none remain.
rules:
  - safety-floor-never-simplified - The safety floor is never simplified away during the lean-coding audit - understanding the problem, input validation at trust boundaries, error handling that prevents data loss, security, accessibility, anything explicitly requested by the issue, and one runnable check for non-trivial logic. A simplification that would breach the floor is rejected; the simplification-apply-cycle validates the floor before resetting its driver flag.
  - report-before-apply - The over-engineering review, debt harvest, and gain report are read-only - they list findings into their artifacts and change no code. Code is only ever changed in the simplification-apply-cycle, and only on simplifications the user accepted at the audit-findings-confirmed gate.
  - leanness-reported-honestly - The net-lines scoreboard and gain figures are reported honestly - the harvested debt ledger is the source of the real per-change count; aggregate or benchmark figures never overstate the gain.
  - complementary-not-duplicative-with-strategic-review - The lean-coding audit applies the over-engineering and leanness lens; it does not re-adjudicate scope-vs-issue fit, which remains strategic-review's concern. The two stages stay complementary.
exits:
  - id: done
    isDefault: true
outcome:
  - The change is tagged and scored against the over-engineering taxonomy
  - Every deliberate simplification is harvested into a tracked debt ledger with its upgrade trigger and honest gain
  - Accepted simplifications are applied without breaching the safety floor
