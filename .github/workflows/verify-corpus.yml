name: Verify corpus

# The guards and the walks whose subject is this tree run against a pull request on THIS branch.
#
# They live on `main`, and this branch holds definitions only — no package.json. A pull request here
# therefore borrows main's tooling and points it at the corpus under review.
#
# GitHub reads a pull-request workflow file from the head ref, so this file has to sit on the branch
# it guards.
#
# `npm run check:all` walks the registry in guards/guards.ts (after named roots land on main), so a
# guard added there is enforced here without touching this file. Discovery enters corpus/ and reads
# ledgers/ of this tree. Snapshot and all-workflows walks read walks/ of this tree.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guard sweep against the corpus under review
    runs-on: ubuntu-latest
    steps:
      # The tooling: main's guards, registry and package manifest.
      - name: Check out the server tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: false

      # The corpus under review, where check:all looks for it by default. For a pull request this is
      # the branch tip; for a manual run it is the ref the run was dispatched on.
      #
      # The tip, not the merge result. GitHub computes a pull request's merge commit asynchronously,
      # so the sha in the event payload can name a merge of the previous push — the run then grades a
      # corpus one commit behind the one that triggered it and reports on prose the branch no longer
      # carries. That happened: a commit moving a triage record into the corpus was graded against
      # the tree without it, and the failure named a file the push had already fixed. The tip is
      # whatever was pushed, every time.
      #
      # path: workflows is the branch root (corpus/, ledgers/, walks/, specimens/, docs/), not corpus/.
      - name: Check out the corpus under review
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workflows

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A guard that cannot reach its corpus exits 2 and fails the job, so an unmeasured guard is
      # never folded into a pass.
      - name: Run every guard against the corpus
        run: npm run check:all

      - name: Walk snapshots against this tree
        run: npx vitest run tests/e2e/snapshot.test.ts

      - name: All-workflows drift against this tree
        run: npx vitest run tests/e2e/all-workflows-walk.test.ts
