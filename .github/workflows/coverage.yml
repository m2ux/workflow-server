name: Coverage walk

# When how walking works changes, every workflow has to be walked: a scoped run would grade such a
# change against a fraction of its effect. The corpus this tree adopts is the subject.
#
# Definition changes are walked on the `workflows` branch, where they land — that job borrows this
# tree's walker and points it at the corpus under review. This job runs the full roster when the
# walker, the policies, the server, or this file itself moved.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-walk:
    name: Every declared checkpoint option is reached
    runs-on: ubuntu-latest
    # The ceiling that says the walk is stuck rather than merely slow. The roster measures about 21
    # minutes on a quiet machine and near 38 on a shared runner, so this sits well clear of the real
    # cost: a walk cut off part-way reports a gap it had not reached yet, which is worse than a slow
    # job. The test carries its own 60-minute timeout below this one, and setup ahead of it is a
    # matter of seconds, so the test is what fails first when a walk hangs.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          # As in verify.yml: `.engineering` nests a private repo this runner cannot clone, so the
          # corpus is checked out on its own below rather than with `submodules: recursive`.
          submodules: false
          # The walker-change probe is a diff against the pull-request base, so that commit has to
          # be in the checkout.
          fetch-depth: 0

      # What this pull request can move. A change to how walking works — the walker, the policies,
      # the server, the roster — moves every workflow at once. Anything else is a definition change
      # and is walked on the workflows branch.
      #
      # A push to main walks everything.
      - name: Resolve whether this change moves how walking works
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          walker_changed=$(git diff --name-only "$BASE_SHA"...HEAD -- src tests/e2e/walker.ts tests/e2e/policies.ts tests/e2e/coverage.ts tests/e2e/walked-workflows.ts tests/e2e/option-coverage.test.ts .github/workflows/coverage.yml | head -1)
          if [ -n "$walker_changed" ]; then
            echo "how walking works changed ($walker_changed) — walking every workflow"
            echo "scope=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "definition coverage runs on the workflows branch — nothing to walk here"
          echo "scope=none" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/workflows-corpus
        if: github.event_name != 'pull_request' || steps.scope.outputs.scope != 'none'

      # Walk artifacts live under walks/ of the adopted corpus. A gitlink that has not yet taken
      # that layout has nothing for this job to measure; definition coverage and the ratchet sit
      # on the workflows-branch job.
      - name: Whether the adopted corpus records option coverage
        if: github.event_name != 'pull_request' || steps.scope.outputs.scope != 'none'
        id: ratchet
        run: |
          if [ -f workflows/walks/option-coverage.json ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "Adopted corpus has no walks/option-coverage.json — nothing to walk here."
          fi

      - uses: actions/setup-node@v4
        if: (github.event_name != 'pull_request' || steps.scope.outputs.scope != 'none') && steps.ratchet.outputs.present == 'yes'
        with:
          node-version: 20
          cache: npm

      - if: (github.event_name != 'pull_request' || steps.scope.outputs.scope != 'none') && steps.ratchet.outputs.present == 'yes'
        run: npm ci

      - name: Walk every checkpoint option
        if: (github.event_name != 'pull_request' || steps.scope.outputs.scope != 'none') && steps.ratchet.outputs.present == 'yes'
        run: npm run test:coverage-walk
