name: Verify

# Typecheck, the test suite against the definitions this engine serves, and the delivery-cost gate
# against a fixture under `tests/fixtures/`.
#
# What this job leaves to the corpus branch: grading the definitions themselves. The guard sweep and
# the coverage roster run in `verify-corpus.yml` on that branch, against the tree under review there.
# This job asks the other question — whether the engine still serves the definitions it ships
# alongside — so a change on either side of that boundary is measured by one of the two.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and the fixture delivery gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `.engineering` is a gitlink this runner has no credential for. The corpus is not a
          # submodule, so refusing them all costs nothing the next step does not supply.
          submodules: false

      # The definitions this engine serves. Without them the corpus-reading tests skip, and a
      # change on either side of the engine/definitions boundary passes both gates while the two
      # disagree — which is how three tests here rotted unnoticed (#759).
      #
      # The branch head, not a recorded revision. The definitions carry their own walk baselines and
      # ratchet files, so a corpus commit is self-consistent or its own gate is red; and a pin is a
      # record someone has to bump, which hides exactly the divergence these tests exist to catch.
      # A corpus change that breaks the engine reddens the next engine pull request, which is the
      # point rather than the cost.
      - name: Check out the definitions the engine serves
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: workflows
          path: workflows

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Two compilations: the server source under the full house style, then the guards, tests and
      # scripts under the same strictness with the index-signature preference relaxed. A script that
      # stops resolving fails here on the commit that breaks it.
      - name: Typecheck the server source, the guards, the tests and the scripts
        run: npm run typecheck

      # The generated schemas are what an authoring client validates against, so a schema change
      # that never reached `schemas/` surfaces to an author as their own file being wrong. The
      # subject is the files the generator writes; `technique.schema.json` is hand-authored.
      - name: Verify the generated schemas match their Zod sources
        run: npm run check:schemas

      # `npm test` is vitest in watch mode; `test:ci` is the single-run entry point so the job cannot
      # hang waiting for file changes.
      #
      # `WORKFLOWS_DIR` names the checkout above, so the corpus-reading tests measure rather than
      # skip. It is the branch root (corpus/, ledgers/, walks/), not corpus/.
      - name: Run the test suite against the definitions
        env:
          WORKFLOWS_DIR: workflows
        run: npm run test:ci

      # Delivery cost is the one property no guard measures, because it is a property of a WALK
      # rather than of a file. The gate walks the `delivery-fixture` under tests/fixtures/token-bench
      # and compares the characters delivered against tests/fixtures/token-benchmark-baseline.json.
      #
      # A change that adds delivery on that fixture fails here at 1%. Confirm the increase is
      # wanted, re-record the fixture in the same commit, and say what the walk gained.
      - name: Gate delivery cost against the recorded baseline
        env:
          WORKFLOWS_DIR: tests/fixtures/token-bench
        run: npm run --silent bench:token -- --workflow=delivery-fixture --label=ci --context-mode=fresh --gate --reference=tests/fixtures/token-benchmark-baseline.json > /dev/null
