name: Verify

# Typecheck, the test suite, and the delivery-cost gate against a fixture
# under `tests/fixtures/`. Live-corpus tests skip when `workflows/` is absent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and the fixture delivery gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `.engineering` nests a private repo this runner cannot clone.
          # Typecheck and `test:ci` skip live-corpus tests when `workflows/` is absent.
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Two compilations: the server source under the full house style, then the guards, tests and
      # scripts under the same strictness with the index-signature preference relaxed. A script that
      # stops resolving fails here on the commit that breaks it.
      - name: Typecheck the server source, the guards, the tests and the scripts
        run: npm run typecheck

      # The generated schemas are what an authoring client validates against, so a schema change
      # that never reached `schemas/` surfaces to an author as their own file being wrong. The
      # subject is the files the generator writes; `technique.schema.json` is hand-authored.
      - name: Verify the generated schemas match their Zod sources
        run: npm run check:schemas

      # `npm test` is vitest in watch mode; `test:ci` is the single-run entry point so the job cannot
      # hang waiting for file changes.
      - name: Run the test suite
        run: npm run test:ci

      # Delivery cost is the one property no guard measures, because it is a property of a WALK
      # rather than of a file. The gate walks the `delivery-fixture` under tests/fixtures/token-bench
      # and compares the characters delivered against tests/fixtures/token-benchmark-baseline.json.
      #
      # A change that adds delivery on that fixture fails here at 1%. Confirm the increase is
      # wanted, re-record the fixture in the same commit, and say what the walk gained.
      - name: Gate delivery cost against the recorded baseline
        env:
          WORKFLOWS_DIR: tests/fixtures/token-bench
        run: npm run --silent bench:token -- --workflow=delivery-fixture --label=ci --context-mode=fresh --gate --reference=tests/fixtures/token-benchmark-baseline.json > /dev/null
