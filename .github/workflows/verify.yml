name: Verify

# Typecheck, the test suite against the definitions this engine serves, and the delivery-cost gate
# against a fixture under `tests/fixtures/`.
#
# What this workflow leaves to the corpus branch: grading the definitions themselves. The guard
# sweep and the coverage roster run in `verify-corpus.yml` on that branch, against the tree under
# review there. This one asks the other question — whether the engine still serves the definitions
# it ships alongside — so a change on either side of that boundary is measured by one of the two.
#
# One guard runs here as well as there, because it is the one whose inputs straddle the boundary:
# `check-tool-call-shape` reads the calls the definitions describe against the schemas this source
# registers. Running it on both sides is what makes the sentence above true of it.
#
# Three questions, three jobs, because a job is the unit GitHub reports a verdict for and a step
# behind a failing one is recorded as skipped. The guard's two inputs are the corpus tip and this
# source, and the corpus tip moves without the change under review: a pull request against `main` is
# paired with the `workflows` tip, and one against `workflows` with the `main` tip. A guard sharing
# a job with the suite lets that drift decide whether the change under review is measured at all,
# which is how an undeclared `start_session` argument held both skipped on every pull request from
# 2026-10-07 to 2026-10-09 (#1277). The delivery-cost gate reads neither the suite's result nor the
# definitions, so what a change costs to deliver is reported whatever the suite concludes.
#
# No job names `needs`, and each resolves for itself the definitions it reads, so none waits on
# another.

on:
  push:
    # A pull request reaches every promotion step, so these cover what reaches a branch without
    # one: an epic base takes the integration branch merged into it directly, with no pull request
    # of its own. A glob does not cross `/`, so each depth is its own pattern.
    branches: [main, 'i[0-9]+/main', 'i[0-9]+/e[0-9]+/main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one guard with an input on each side of the engine/definitions boundary: it reads the calls
  # the definitions describe against the schemas this source registers for those tools. Every other
  # guard reads definitions against definitions, so the corpus branch's sweep measures each of its
  # inputs; this one's other input is here, and a parameter renamed in `src/tools/` falsifies a
  # corpus nobody is touching. The suite would not catch it — it drives the server directly rather
  # than through the operation text, which is how a contract change reached the corpus without its
  # callers (#788). So the sweep keeps grading the definitions on their own branch, and this single
  # guard also runs where its other input changes, which puts the failure on the pull request that
  # caused it.
  tool-call-shape:
    name: The definitions call the tools this engine registers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the definitions branch this change pairs with
        id: pair
        env:
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          ref=workflows
          case "$BASE" in
            i[0-9]*/*)
              candidate="${BASE%%/*}/workflows"
              if git ls-remote --exit-code --heads origin "$candidate" > /dev/null; then ref="$candidate"; fi
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Definitions branch: $ref"

      - name: Check out the definitions the engine serves
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pair.outputs.ref }}
          path: workflows

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify the definitions call the tools this engine registers
        run: npx tsx guards/check-tool-call-shape.ts --root workflows

  verify:
    name: Typecheck, schemas, and the test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The definitions this engine serves. Without them the corpus-reading tests skip, and a
      # change on either side of the engine/definitions boundary passes both gates while the two
      # disagree — which is how three tests here rotted unnoticed (#759).
      #
      # The branch head, not a recorded revision. The definitions carry their own walk baselines and
      # ratchet files, so a corpus commit is self-consistent or its own gate is red; and a pin is a
      # record someone has to bump, which hides exactly the divergence these tests exist to catch.
      # A corpus change that breaks the engine reddens the next engine pull request, which is the
      # point rather than the cost.
      #
      # An initiative's code and definitions land on its own integration branches, `iNN/main` and
      # `iNN/workflows`, so a change on one is measured against the initiative's other half where
      # that branch exists, and against `workflows` otherwise.
      #
      # The initiative is the first segment of the base, whatever follows it. Every task pull
      # request targets an epic base, `iNN/eMM/main`, so a rule reading the whole name pairs the
      # initiative's engine with the shared corpus and reports agreement between two trees that
      # were never the pair under test.
      - name: Resolve the definitions branch this change pairs with
        id: pair
        env:
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          ref=workflows
          case "$BASE" in
            i[0-9]*/*)
              candidate="${BASE%%/*}/workflows"
              if git ls-remote --exit-code --heads origin "$candidate" > /dev/null; then ref="$candidate"; fi
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Definitions branch: $ref"

      - name: Check out the definitions the engine serves
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pair.outputs.ref }}
          path: workflows

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Two compilations: the server source under the full house style, then the guards, tests and
      # scripts under the same strictness with the index-signature preference relaxed. A script that
      # stops resolving fails here on the commit that breaks it.
      - name: Typecheck the server source, the guards, the tests and the scripts
        run: npm run typecheck

      # The generated schemas are what an authoring client validates against, so a schema change
      # that never reached `schemas/` surfaces to an author as their own file being wrong. The
      # subject is the files the generator writes, including the technique schema.
      - name: Verify the generated schemas match their Zod sources
        run: npm run check:schemas

      # `npm test` is vitest in watch mode; `test:ci` is the single-run entry point so the job cannot
      # hang waiting for file changes.
      #
      # `WORKFLOWS_DIR` names the checkout above, so the corpus-reading tests measure rather than
      # skip. It is the branch root (corpus/, ledgers/, walks/), not corpus/.
      - name: Run the test suite against the definitions
        env:
          WORKFLOWS_DIR: workflows
        run: npm run test:ci

  # Delivery cost is the one property no guard measures, because it is a property of a WALK rather
  # than of a file. The gate walks the `delivery-fixture` under tests/fixtures/token-bench and
  # compares the characters delivered against benchmark/fixtures/token-benchmark-baseline.json.
  #
  # Both of its inputs are in this tree, so the job resolves no definitions and reads no suite
  # result. That independence is what puts the answer in front of a reviewer of a change that
  # reddens a test, which is when the cost of the change is least obvious from the diff.
  #
  # A change that adds delivery on that fixture fails here at 1%. Confirm the increase is wanted,
  # re-record the fixture in the same commit, and say what the walk gained.
  delivery-cost:
    name: The delivery cost of a walk against the recorded baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gate delivery cost against the recorded baseline
        run: npm run --silent bench:token -- --workflow=delivery-fixture --fixture-corpus --label=ci --context-mode=fresh --gate --reference=benchmark/fixtures/token-benchmark-baseline.json > /dev/null
