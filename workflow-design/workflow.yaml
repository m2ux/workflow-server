$schema: ../../schemas/workflow.schema.json
id: workflow-design
version: 1.34.0
title: DEPRECATED — use workflow-authoring — Workflow Design Workflow
description: >-
  DEPRECATED — start `workflow-authoring` instead. This workflow remains only so sessions already
  in flight can finish; it is removed once none remain. Guide agents through creating, updating, or
  reviewing workflow definitions.
author: m2ux
tags:
  - deprecated
  - workflow-creation
  - workflow-review
  - workflow-design
  - schema-validation
  - design-principles
  - elicitation
  - conventions
rules:
  activity:
    - Corrections must persist — record corrections and verify compliance at every subsequent checkpoint
    - When `{headless_mode}` is true (the default), soft mid-flow checkpoints (those with `defaultOption` and `autoAdvanceMs`) auto-resolve without AskQuestion. Gap-only Gate 1 (`design-intent-batch`), Gate 2 (`approve-to-commit`), and safety gaps (`preservation-check`, `review-disposition`) stay interactive. Soft-gate headless is the default; set `{headless_mode}` false at intake via an explicit interactive opt-out (“interactive”, “not headless”, “with checkpoints”).
techniques:
  activity:
    - variable-binding
variables:
  - name: scope_manifest
    type: array
    description: List of files to create, modify, or remove with full paths and actions.
  - name: assumptions_log
    type: object
    description: The design-assumptions log surfaced and reviewed during requirements-refinement — each assumption with its category, risk.
initialActivity: intake-and-context
