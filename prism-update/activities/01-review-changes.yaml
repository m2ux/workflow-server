id: review-changes
version: 1.3.0
name: Review Changes
description: Present discovered changes for approval and apply any exclusion adjustments before import.
variables:
  reads:
    - change_set
    - next_index
    - upstream_path
  writes:
    - name: change_set
      type: object
      description: "Categorized diff result: { new: [{name, upstream_file, family, optimal_model}], modified: [{name, resource_file, upstream_file}], renamed: [{old_name, new_name, resource_file, upstream_file}], deleted: [{name, resource_file}] }"
    - name: exclusions_adjusted
      type: boolean
      description: Whether the user chose to adjust exclusions at the review checkpoint
      defaultValue: false
required: true
steps:
  - kind: technique
    id: present-summary
    technique: review-change-set::present-summary
  - kind: checkpoint
    id: change-review
    message: Here are the upstream changes. Review the summary above and confirm which changes to apply.
    options:
      - id: confirm
        label: Confirm — apply all changes
        description: Import all discovered changes as listed
      - id: adjust-exclusions
        label: Adjust exclusions
        description: Exclude specific prisms before importing
        effect:
          setVariable:
            exclusions_adjusted: true
      - id: abort
        label: Abort
        description: Do not import any changes
        effect:
          transitionTo: __terminal__
    blocking: true
  - kind: technique
    id: apply-exclusions
    technique: review-change-set::apply-exclusions
transitions:
  - to: apply-updates
    isDefault: true
outcome:
  - User-approved change set ready for import
