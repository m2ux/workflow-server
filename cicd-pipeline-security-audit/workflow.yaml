$schema: ../../schemas/workflow.schema.json
id: cicd-pipeline-security-audit
version: 1.3.0
title: CI/CD Pipeline Security Audit Workflow
description: Fully automated multi-phase AI security audit for GitHub Actions CI/CD pipelines. Detects source-to-sink injection vulnerabilities exploited by autonomous attack agents (hackerbot-claw campaign, Feb 2026).
author: m2ux
tags:
  - security
  - cicd
  - github-actions
  - injection-detection
  - automated
  - multi-phase
rules:
  workflow:
    - ref: work-packages::agents-md-prerequisite
    - "PREREQUISITE: At least one target submodule MUST be specified before the workflow begins. If 'all' is specified, scan every submodule that contains .github/workflows/."
    - "FULLY AUTOMATED: This workflow executes without user checkpoints. Phase gates are set by each activity's completion step (a `set` flag on its final step)."
    - "CONCURRENT DISPATCH: All per-submodule scanner agents (S1-Sn) dispatch via meta orchestration-patterns::dispatch-workers with concurrency bound to scanners_assigned (greater than 1 → one spawn-concurrent batch). Every assigned agent MUST be dispatched — skipping any agent is a HARD STOP."
    - "AGENT OUTPUT PERSISTENCE: The orchestrator verifies all expected sub-agent output files exist BEFORE dispatching V or M, and re-dispatches any agent whose file is missing. File naming: s{scanner_number}-{submodule_path}.json for scanners, verification-report.json for V, merged-findings.json and reconciliation-table.json for M."
    - "SUB-AGENT BOOTSTRAP: Every sub-agent receives workflow-server bootstrap instructions in its worker brief (composed by dispatch-scanners ops; dispatched via orchestration-patterns::dispatch-workers → harness-compat): call start_session(session_token, agent_id) to inherit the dispatched session, then next_activity({ activity_id: <assigned> }), then follow activity steps sequentially. Sub-agents self-load their activity definition — the orchestrator does NOT inline the activity content."
  activity:
    - "DETECTION SCOPE: Seven vulnerability classes derived from the hackerbot-claw campaign (P1-P7): expression injection, Pwn Request, comment trigger abuse, excessive permissions, fork code execution, AI config poisoning, dangerous execution patterns."
    - "SEVERITY SCORING: Use Impact x Exploitability rubric from resource 02. Impact factors: secret exposure, code execution scope, repository takeover potential. Exploitability factors: unauthenticated fork PR (high), comment trigger without auth check (high), requires maintainer action (low)."
    - "CROSS-PATTERN CORRELATION: Compound vulnerabilities (e.g., pull_request_target + expression injection + excessive permissions) receive elevated severity over individual patterns."
    - "SCANNER OUTPUT FORMAT: Each scanner writes structured JSON to s{scanner_number}-{submodule_path}.json in the planning folder, following the schema in resource 04."
    - "REMEDIATION GUIDANCE: Every finding in the final report MUST include a specific remediation recommendation referencing the playbook in resource 03."
    - "AI CONFIG FILES: Detection pattern P6 covers CLAUDE.md, AGENTS.md, .cursorrules, .cursor/rules/, and similar AI agent configuration files. These are high-value prompt injection targets when not protected by CODEOWNERS."
  universal:
    - ref: substrate-node-security-audit::planning-artifacts-gitignored
techniques:
  activity:
    - variable-binding
variables:
  - name: target_submodules
    type: string
    description: Comma-separated list of submodule paths to audit, or 'all' to scan every submodule with .github/workflows/
  - name: planning_folder_path
    type: string
    description: "Path to planning folder: .engineering/artifacts/planning/YYYY-MM-DD-cicd-security-audit"
initialActivity: scope-setup
graph:
  scope-setup:
    done: reconnaissance
  reconnaissance:
    done: primary-scan
  primary-scan:
    scan-verified: report-generation
