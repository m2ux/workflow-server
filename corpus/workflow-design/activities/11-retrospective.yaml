id: retrospective
version: 1.5.0
name: Retrospective
description: A recorded completion summary (create/update) and a session retrospective capturing lessons before the workflow ends.
variables:
  reads:
    - component_git_dir
    - host_repo_path
    - manifest_entries
    - operation_type
    - planning_folder_path
    - pr_number
    - target_path
    - worktree_created
  writes:
    - name: worktree_created
      type: boolean
      description: True when a dedicated worktree at target_path was created or reused by this workflow run (only those worktrees are eligible for optional.
      defaultValue: false
required: true
steps:
  - kind: technique
    id: conduct-retrospective
    technique: conduct-retrospective
  - kind: technique
    id: create-completion-doc
    technique: create-completion-doc
    when: operation_type != 'review'
  - kind: technique
    id: persist-completion-doc
    technique:
      name: legacy::manage-artifacts::write-artifact
      inputs:
        bare_filename: COMPLETE.md
        artifact_content: completion_document
    when: operation_type != 'review'
  - kind: technique
    id: persist-retrospective
    technique:
      name: legacy::manage-artifacts::write-artifact
      inputs:
        bare_filename: COMPLETE.md
        artifact_content: retrospective_document
    when: operation_type == 'review'
  - kind: technique
    id: remove-session-worktree
    technique: legacy::manage-git::remove-worktree
    when: worktree_created == true
outcome:
  - A later reader learns what the session delivered and what it left open without replaying it
  - A session retrospective captures friction points and prioritized workflow improvements before the work ends
  - When this run created or reused a dedicated edit worktree, optional teardown clears `{target_path}` after the retrospective
