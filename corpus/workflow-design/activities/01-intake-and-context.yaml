id: intake-and-context
version: 1.13.0
name: Intake and Context
description: "Establish the operation type, mode, and target for the request, and internalize the schema system and YAML-format conventions that ground all drafting."
variables:
  reads:
    - component_git_dir
    - host_repo_path
    - pr_number
    - report_path
    - target_path
    - update_seeded_from_review
  writes:
    - name: change_category
      type: string
      description: "In update mode, the categorised change request from `{user_description}`: one or more of the categories in Change Categories. Unset otherwise."
    - name: change_request_clear
      type: boolean
      description: In update mode, true when the change request is clear enough to proceed without Gate 1 clarification.
      defaultValue: true
    - name: format_literacy_confirmed
      type: boolean
      description: Whether YAML format understanding has been demonstrated for this session.
      defaultValue: false
    - name: headless_mode
      type: boolean
      description: When true, soft mid-flow gates auto-resolve without reaching a person.
      defaultValue: true
    - name: intent_needs_confirmation
      type: boolean
      description: Whether the classified intent needs the reader's confirmation.
      defaultValue: false
    - name: operation_type
      type: string
      description: The classified operation for the request.
      values:
        - create
        - update
        - review
    - name: operation_type_ambiguous
      type: boolean
      description: True when intake cannot confidently classify create vs update vs review from the request alone.
      defaultValue: false
    - name: planning_folder_path
      type: string
      description: Absolute path to this workflow planning folder.
    - name: review_scope_confirmed
      type: boolean
      description: "In review mode: whether the user confirmed the audit target set in intake."
      defaultValue: false
    - name: schema_constructs_confirmed
      type: boolean
      description: Whether applicable schema constructs have been identified and confirmed.
      defaultValue: false
    - name: target_workflow_id
      type: string
      description: ID of the existing workflow to modify (update mode) or the current review-mode audit target (bound per iteration when reviewing multiple.
    - name: target_workflow_ids
      type: array
      description: Ordered list of workflow ids to audit in review mode (one or more).
    - name: update_seeded_from_review
      type: boolean
      description: True when update mode was entered from a review-mode fix disposition (fix-issues or selective-fixes).
      defaultValue: false
    - name: workflow_id
      type: string
      description: The ID of the workflow being created or updated.
required: true
steps:
  - kind: action
    id: bind-planning-folder-path
    actions:
      - action: set
        target: planning_folder_path
        message: Absolute planning folder this session writes its artifacts into, as reported in the server session summary.
  - kind: technique
    id: intake-classification
    technique: intake-classification
  - kind: checkpoint
    id: design-intent-batch
    condition:
      type: and
      conditions:
        - type: simple
          variable: intent_needs_confirmation
          operator: ==
          value: true
        - type: simple
          variable: update_seeded_from_review
          operator: "!="
          value: true
    message: "Design intent needs confirmation — classified `{operation_type}` for `{workflow_id}` (mode ambiguous={operation_type_ambiguous}, change_request_clear={change_request_clear})."
    options:
      - id: confirm-intent
        label: Confirm classified intent
        description: Accept the classified mode, target, and change request as stated.
        effect:
          setVariable:
            intent_needs_confirmation: false
            review_scope_confirmed: true
      - id: confirm-create
        label: Create a new workflow
        description: Correct classification to create mode.
        effect:
          setVariable:
            operation_type: create
            operation_type_ambiguous: false
            intent_needs_confirmation: false
      - id: confirm-update
        label: Update an existing workflow
        description: Correct classification to update mode.
        effect:
          setVariable:
            operation_type: update
            operation_type_ambiguous: false
            intent_needs_confirmation: false
      - id: wrong-review-target
        label: Wrong review target set
        description: Rejects the review target set.
        effect:
          setVariable:
            review_scope_confirmed: false
            intent_needs_confirmation: true
          exit: retarget
      - id: cancel-as-create
        label: Cancel update — create new instead
        description: Abandon the update path; flip mode to create.
        effect:
          setVariable:
            operation_type: create
            operation_type_ambiguous: false
            intent_needs_confirmation: false
  - kind: technique
    id: persist-structural-inventory
    technique:
      name: work-package::manage-artifacts::write-artifact
      inputs:
        bare_filename: structural-inventory.json
        artifact_content: structural_inventory
    when: operation_type == "update" || operation_type == "review"
  - kind: action
    id: announce-certain-intent
    when: intent_needs_confirmation == false && update_seeded_from_review != true && operation_type != 'review'
    actions:
      - action: message
        message: "Classified as a {operation_type} operation for workflow `{workflow_id}`."
  - kind: action
    id: announce-certain-review-scope
    when: operation_type == 'review' && intent_needs_confirmation == false
    actions:
      - action: set
        target: review_scope_confirmed
        value: true
      - action: message
        message: "Compliance review target set: {target_workflow_ids}."
  - kind: action
    id: announce-review-seeded-update
    when: update_seeded_from_review == true
    actions:
      - action: message
        message: "Update seeded from compliance review — mode is update; findings in the [compliance report]({report_path}) are the change specification."
  - kind: action
    id: announce-headless
    when: headless_mode == true
    actions:
      - action: message
        message: "Headless by default — soft mid-flow gates auto-resolve. Gate 2 (`approve-to-commit`) and safety gaps stay interactive. Say \"interactive\", \"not headless\", or \"with checkpoints\" to opt out."
  - kind: action
    id: announce-interactive
    when: headless_mode == false
    actions:
      - action: message
        message: "Interactive mode — soft mid-flow gates may reach you. Gate 2 (`approve-to-commit`) and safety gaps stay interactive."
  - kind: technique
    id: initialize-planning-folder
    technique:
      name: workflow-engine::create-readme
      inputs:
        entity_context: "entity_title={workflow_id}; entity_type={operation_type}; status=Planning"
        seed_profile: workflow-design/readme-seed
        operation_type: "{operation_type}"
    when: operation_type != 'review'
  - kind: technique
    id: context-loading
    technique: context-loading
  - kind: technique
    id: persist-format-conventions
    technique:
      name: work-package::manage-artifacts::write-artifact
      inputs:
        bare_filename: format-conventions.md
        artifact_content: format_conventions
    when: operation_type != 'review'
  - kind: technique
    id: persist-applicable-constructs
    technique:
      name: work-package::manage-artifacts::write-artifact
      inputs:
        bare_filename: applicable-constructs.md
        artifact_content: applicable_constructs
    when: operation_type != 'review'
  - kind: technique
    id: present-problem-overview
    technique:
      name: work-package::stakeholder-overview
      inputs:
        readme_section_heading: "## Problem Overview"
        source_material: the requested change, the target workflow's current shape, and any context gathered during this activity
    actions:
      - action: message
        message: "Problem Overview for `{workflow_id}` — plain-language summary ([planning README]({planning_folder_path}/README.md#problem-overview))"
    when: operation_type != 'review'
  - kind: action
    id: auto-confirm-literacy
    when: operation_type != 'review'
    actions:
      - action: set
        target: format_literacy_confirmed
        value: true
      - action: set
        target: schema_constructs_confirmed
        value: true
  - kind: action
    id: clear-review-seed-flag
    when: update_seeded_from_review == true
    actions:
      - action: set
        target: update_seeded_from_review
        value: false
exits:
  - id: review-scope-confirmed
    when: operation_type == "review" && review_scope_confirmed == true
  - id: context-established
    when: format_literacy_confirmed == true && schema_constructs_confirmed == true
    isDefault: true
  - id: retarget
    immediate: true
outcome:
  - The workflow knows whether it is creating, updating, or reviewing, and against which target — every downstream branch can route on a derived operation
  - Intent, its gap flags and `{headless_mode}` are derived from the request, and only uncertain intent reaches the reader
  - The agent can author schema-correct YAML without re-deriving syntax or guessing which constructs apply
  - Create and update drafting starts with format literacy and the applicable schema constructs confirmed
