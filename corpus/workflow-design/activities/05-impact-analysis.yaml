id: impact-analysis
version: 1.9.0
name: Impact Analysis
description: Impact assessment of proposed changes against an existing workflow's files, exits and graph, and references.
variables:
  reads:
    - accumulated_design
    - component_git_dir
    - operation_type
    - planning_folder_path
    - pr_number
    - target_path
  writes:
    - name: impact_analysis_path
      type: string
      description: Absolute path to the persisted impact-analysis artifact.
      defaultValue: ""
    - name: impact_correction
      type: string
      description: The reader's corrections to the impact scope, from each `revise-impact` reply in order. Absent until the reader revises the scope.
    - name: impact_revision_requested
      type: boolean
      description: True between the reader asking to revise the impact scope and that reply's correction landing in `impact_correction`.
      defaultValue: false
    - name: preservation_required
      type: boolean
      description: Whether the reader asked for flagged content to survive the change.
      defaultValue: false
    - name: removal_count
      type: number
      description: Count of inventoried content removals.
      defaultValue: 0
required: false
steps:
  - kind: technique
    id: impact-analysis
    technique: impact-analysis
    when: operation_type == 'update'
  - kind: technique
    id: persist-impact-analysis
    technique:
      name: work-package::manage-artifacts::write-artifact
      inputs:
        bare_filename: impact-analysis.md
        artifact_content: impact_analysis
        target_dir: planning_folder_path
      outputs:
        written_artifact: impact_analysis_path
    when: operation_type == 'update'
  - kind: action
    id: impact-no-removals
    when: removal_count == 0
    actions:
      - action: message
        message: "Impact analysis complete — no content removals flagged ([impact analysis]({impact_analysis_path}))."
  - kind: checkpoint
    id: impact-and-preservation-confirmed
    condition:
      type: simple
      variable: removal_count
      operator: ">"
      value: 0
    message: "Impact analysis: {removal_count} removal(s) flagged ([impact analysis]({impact_analysis_path}))."
    defaultOption: confirmed
    autoAdvanceMs: 30000
    options:
      - id: confirmed
        label: Impact and removals look correct
        description: Impact scope is accurate and every flagged removal is intentional
        effect:
          setVariable:
            preservation_required: false
      - id: revise-impact
        label: Revise impact scope
        description: Impact scope is incomplete or over-inclusive, and the reply carries the correction.
        effect:
          setVariable:
            impact_revision_requested: true
          exit: revise
      - id: preserve
        label: Preserve some flagged content
        description: Some flagged content must be preserved rather than removed.
        effect:
          setVariable:
            preservation_required: true
  - kind: action
    id: record-impact-correction
    when: impact_revision_requested == true
    actions:
      - action: set
        target: impact_correction
        message: The correction the reader's reply to the impact review carries, appended to any earlier correction, so the next impact pass reads it from the bag.
      - action: set
        target: impact_revision_requested
        value: false
exits:
  - id: done
    isDefault: true
  - id: revise
outcome:
  - Drafting knows exactly which files the change touches and how, so the edit blast radius is bounded before any content is written
  - Exit bindings and technique/resource references are known-intact, so the update won't silently orphan or break the workflow's wiring
  - No content disappears by accident — every flagged removal is one the user consciously approved (or there were none)
