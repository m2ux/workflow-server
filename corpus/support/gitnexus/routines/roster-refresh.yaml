id: roster-refresh
version: 2.0.0
name: Roster Refresh
description: >-
  Walk a roster of trees, bring each checkout to the revision the roster names where the caller asks
  for it, give each tree a graph where none covers it and bring the graph current where it trails,
  and answer with what each tree's graph holds and the name it answers under.

inputs:
  - id: index_roster
    description: >-
      The trees this run walks, one entry per tree, each carrying the working tree as `repo_path`
      and the revision its checkout is brought to as `revision_name`. A tree the roster leaves out
      is one no graph is built or refreshed for, which is the roster's purpose — an absent graph is
      a decision the roster records rather than a tree nobody reached.
  - id: ready_trees
    description: >-
      Whether each checkout is returned to what its repository records and brought to the revision
      the roster names before its graph is read. A tree a tool writes into carries modifications
      nobody made, and both the reset and the pin that follows it discard work, so this is asked for
      and never assumed. Unset leaves every checkout where it stands and reads the graphs against it.
  - id: planning_folder_path
    description: The session's planning folder, which every operation of the git library this run composes carries as a shared input.

outputs:
  - id: roster_graph_report
    type: array
    description: >-
      One entry per roster entry, in roster order — the tree, the name its graph answers under, and
      what that graph holds, or the statement that no graph could be named for it.
  - id: tree_readiness
    type: array
    optional: true
    description: >-
      One entry per roster entry naming the commit its checkout landed at, or the refusal that left
      it as it stood. Unset where the run was not asked to ready the trees.

internals:
  - id: roster_entry
    description: The roster entry the run holds, whose tree the reads in that pass address.
  - id: entry_repo_name
    description: The name the held entry's graph answers under, as the build or the inventory named it.
  - id: entry_build_stats
    description: The counts a build reports where the held entry's tree had no graph covering it.
  - id: entry_index_stats
    description: The counts the held entry's graph holds once it stands current with its tree.
  - id: entry_index_stale
    description: Whether the held entry's graph trailed its tree when the pass read it.

steps:
  - kind: routine
    id: ready-trees
    when: ready_trees
    routine: git::ready-checkouts
    with:
      checkout_pins: "{index_roster}"
      reset_before_pin: "{ready_trees}"
    outputs:
      checkout_readiness: tree_readiness
  - kind: loop
    id: roster-cycle
    name: Roster Cycle
    loopType: forEach
    variable: roster_entry
    over: index_roster
    maxIterations: 100
    steps:
      - kind: routine
        id: name-graph
        routine: gitnexus::graph-for-tree
        with:
          tree_path: "{roster_entry.repo_path}"
        outputs:
          repo_name: entry_repo_name
          index_stats: entry_build_stats
      - kind: routine
        id: bring-current
        routine: gitnexus::index-refresh
        with:
          repo_path: "{roster_entry.repo_path}"
        outputs:
          stats: entry_index_stats
          index_stale: entry_index_stale
      - kind: action
        id: announce-build
        when: entry_build_stats
        actions:
          - action: message
            message: "{roster_entry.repo_path}: no graph covered this tree, so one was built holding {entry_build_stats}."
      - kind: action
        id: record-entry
        actions:
          - action: message
            message: "{roster_entry.repo_path}: graph {entry_repo_name} stands current holding {entry_index_stats}, having trailed its tree ({entry_index_stale})."
          - action: set
            target: roster_graph_report
            description: >-
              The held entry's tree, the name its graph answers under, whether the pass built that
              graph or found one already covering the tree, whether it trailed its tree, and the
              counts it holds afterwards — appended to the report the run answers with.
