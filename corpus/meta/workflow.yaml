$schema: ../../schemas/workflow.schema.json
id: meta
version: 7.4.0
title: Meta Workflow
description: Top-level lifecycle workflow that orchestrates client workflow sessions. Excluded from list_workflows — bootstrap navigates here directly.
author: m2ux
tags:
  - meta
  - bootstrap
  - lifecycle
  - dispatch
  - session
techniques:
  workflow:
    - workflow-engine::start-session
    - workflow-engine::handle-sub-workflow
    - workflow-engine::dispatch-activity
    - workflow-engine::resume-worker
    - workflow-engine::continue-batch
    - workflow-engine::workflow-orchestrator
  activity:
    - workflow-engine::activity-worker
    # The orchestrator baseline: what a meta activity applies and no step of it binds.
    - workflow-engine::workflow-orchestrator
    - workflow-engine::take-activity
    - workflow-engine::handle-sub-workflow
    - orchestrator-conduct
    - harness-compat::resolve-harness-operation
    - harness-compat::claude-code
    - harness-compat::cursor
    - harness-compat::cline
    - harness-compat::generic
initialActivity: dispatch-client-workflow
graph:
  dispatch-client-workflow:
    "null": end-workflow
  end-workflow:
    return: dispatch-client-workflow
    completed: __terminal__
variables:
  - name: user_request
    type: string
    description: The user's free-form request that opened this session.
  - name: meta_session_index
    type: string
    description: 6-character base32 session_index of the meta session itself.
  - name: host_repo_path
    type: string
    description: Absolute path to the host repository the session belongs to.
  - name: mentioned_repo
    type: string
    description: Repository named in the user's request, such as the owner/repo of a PR or issue URL.
  - name: target_workflow_outcomes
    type: string
    description: The client workflow's own outcome list
  - name: planning_folder_path
    type: string
    description: Canonical absolute path to the client workflow's planning folder, as resolved by the server under its own workspace .engineering root.
  - name: client_session_index
    type: string
    description: 6-character base32 index of the embedded client session
  - name: client_initial_activity
    type: string
    description: First activity id of the embedded client workflow
  - name: component_path
    type: string
    description: Path of the component under work relative to host_repo_path
  - name: worker_result
    type: object
    description: The envelope the client walk's last entry closed on
  - name: target_workflow_id
    type: string
    description: Catalog id of the embedded client workflow
  - name: seed_profile
    type: string
    description: Resource id of the client workflow's readme-seed profile
