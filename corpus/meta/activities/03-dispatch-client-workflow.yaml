id: dispatch-client-workflow
version: 6.5.0
name: Dispatch Client Workflow
description: Drive the client workflow's activity loop, each worker carrying a bounded run of activities.
variables:
  reads:
    - client_initial_activity
    - client_session_index
    - component_path
    - host_repo_path
    - planning_folder_path
    - target_workflow_id
  writes:
    - name: client_workflow_completed
      type: boolean
      description: Whether the client walk reached an exit leading to `__terminal__`. The client session then stands on the activity that took it, and completes on the advance close-out makes on confirmation.
      defaultValue: false
    - name: client_walk_aborted
      type: boolean
      description: Whether the client walk stopped on an engineering push that did not land rather than reaching the end of its graph.
      defaultValue: false
    - name: client_in_flight
      type: array
      description: The client activities in flight when the walk opens
    - name: current_activity
      type: string
      description: The client activity the walk holds
    - name: from_activity
      type: string
      description: The client activity an advance retires
    - name: trace_tokens
      type: array
      description: The trace token of every advance the client walk made, in the order it made them
    - name: seed_profile
      type: string
      description: Resource id of the client workflow's readme-seed profile
required: true
steps:
  - kind: action
    id: open-client-walk
    actions:
      - action: set
        target: client_workflow_completed
        value: false
  - kind: technique
    id: read-client-position
    technique:
      name: workflow-engine::read-session
      inputs:
        session_index: client_session_index
      outputs:
        in_flight: client_in_flight
        session_state: client_session_state
        execution_trace: client_execution_trace
  - kind: action
    id: name-seed-profile
    actions:
      - action: set
        target: seed_profile
        value: "{client_session_state.seed_profile}"
        description: The readme-seed profile the client workflow declares, which every Progress mark the walk writes resolves row ownership through.
  - kind: routine
    id: client-activity-loop
    routine: activity-loop
    with:
      session_index: client_session_index
      initial_activity: client_initial_activity
      workflow_id: target_workflow_id
      completes_session: false
      standing_activity: "{client_in_flight.0}"
    outputs:
      current_activity: current_activity
      from_activity: from_activity
      trace_tokens: trace_tokens
      walk_aborted: client_walk_aborted
  - kind: action
    id: record-client-completion
    when: current_activity == null && !client_walk_aborted
    actions:
      - action: set
        target: client_workflow_completed
        value: true
exits:
  - id: "null"
    when: current_activity == null
    isDefault: true
outcome:
  - The client workflow has executed end to end with its artifacts committed and state persisted at every activity boundary
  - Each worker carried a bounded run of activities in one context, paying the harness baseline once for the run
  - The user retained control over every decision point — checkpoints surfaced to them and their selections steered the workflow
  - The client session stands on its last activity, and the advance onto `__terminal__` that completes it is left to close-out
  - Reaching the end of the activity loop is recorded, so close-out can tell a completed run from one that stopped at the iteration bound
