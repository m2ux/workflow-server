id: end-workflow
version: 4.10.0
name: End Workflow
description: Close out the client workflow.
variables:
  reads:
    - client_session_index
    - client_workflow_completed
    - component_path
    - from_activity
    - host_repo_path
    - planning_folder_path
    - target_workflow_id
    - target_workflow_outcomes
    - worker_result
  writes:
    - name: trace_tokens
      type: array
      description: The trace token of every advance the client run made, the terminal advance last
    - name: worker_result
      type: object
      description: The envelope the advance onto `__terminal__` closed on
required: true
steps:
  - kind: technique
    id: read-session
    technique: workflow-engine::read-session
  - kind: technique
    id: verify-outcomes
    technique:
      name: workflow-engine::verify-outcomes
      inputs:
        outcomes: target_workflow_outcomes
  - kind: technique
    id: generate-summary
    technique:
      name: workflow-engine::generate-summary
      inputs:
        workflow_definition: target_workflow_id
  - kind: checkpoint
    id: completion-confirmed
    message: Session closure, with each target outcome reported as met or as a gap to address.
    options:
      - id: confirm
        label: Confirm closure
        description: The outcomes stand as reported and the session is complete
      - id: return
        label: Return to workflow
        description: Some outcomes are unmet and the client workflow has more to do on them
        effect:
          exit: return
  - kind: technique
    id: complete-client-session
    when: client_workflow_completed == true
    technique:
      name: workflow-engine::dispatch-activity
      inputs:
        session_index: client_session_index
        activity_id: __terminal__
        exit_id: "{worker_result.activity_exit}"
        step_manifest: "{worker_result.steps_completed}"
        variables_changed: "{worker_result.variables_changed}"
    actions:
      - action: set
        target: trace_tokens
        value: "{advance_trace_tokens}"
        description: The token the terminal advance returned, appended to the client run's tokens.
  - kind: technique
    id: revise-session-metrics
    technique: workflow-engine::revise-session-metrics
    when: client_workflow_completed == true && planning_folder_path != ''
  - kind: routine
    id: persist-client-completion
    when: client_workflow_completed == true && planning_folder_path != ''
    routine: persist-activity
    with:
      activity_id: from_activity
    outputs:
      push_landed: push_landed
  - kind: action
    id: surface-unlanded-push
    when: client_workflow_completed == true && planning_folder_path != '' && !push_landed
    actions:
      - action: message
        message: "The push did not land. The error is surfaced and the walk does not advance."
  - kind: action
    id: announce-completion
    when: push_landed
    actions:
      - action: log
        message: Workflow session closed
outcome:
  - The user can decide whether the work is truly done — every target outcome is shown as met or flagged as a gap to address
  - Confirming closure completes a client session whose walk reached `__terminal__`, carrying its last activity's exit, steps and bag writes
  - Session-trace and token-usage artifacts include the client terminal activity after that activity has exited
  - The completed session can be resumed or audited later because its final state is durably preserved
exits:
  - id: completed
    isDefault: true
  - id: return
    immediate: true
