id: activity-loop
version: 1.5.0
name: Activity Loop
description: >-
  Walk a session one activity at a time — enter the current activity and carry it, answer any
  checkpoint it yields, commit what it produced, and advance onto what its exit routes to — until
  the walk reaches `__terminal__`. A worker carries a bounded run of activities and is continued
  across each boundary. Where an exit names several branches, one call opens every branch, they
  run in one turn under their own identities, each branch is one activity and is not continued, and the run resumes from the
  activity they converge on. The fan's width is the destination's.

inputs:
  - id: session_index
    description: The session this run walks, whose pointer each entry advances.
  - id: initial_activity
    description: The activity the walk opens with.
  - id: enter_activity
    kind: technique
    default: workflow-engine::dispatch-activity
    description: The operation that enters an activity and carries it to the envelope it returns, or, entering `__terminal__`, completes the session.
  - id: planning_folder_path
    description: Absolute path to the walked session's planning folder, whose Progress surface each entry marks.
  - id: component_path
    description: Path of the component under work, relative to the host repository.
  - id: host_repo_path
    description: Absolute path of the outermost git host for the workspace checkout.
  - id: kind
    description: Path kind of the engineering checkout. `worktree` selects the worktree commit; any other value selects an ordinary commit of the host checkout. A caller that binds nothing supplies the host's own kind.
  - id: target_status
    description: The Progress status an entry publishes for the activity it marks.
  - id: completes_session
    default: true
    description: Whether the walk makes the advance onto `__terminal__`, which completes the session. Where false, the walk ends on the envelope that names `__terminal__`, held as `worker_result`, and the session stays on `from_activity`.
  - id: standing_activity
    description: The activity the session stands on, where an earlier walk left it. The walk opens on that activity and carries it without an advance. Unset, the walk opens on `initial_activity`.

outputs:
  - id: current_activity
    type: string
    description: The activity the walk holds, and null once the walk reaches `__terminal__`.
  - id: from_activity
    type: string
    description: The activity an advance retires, which every entry names as the one its exit belongs to.
  - id: trace_tokens
    type: array
    description: The trace token of every advance the walk made, in the order it made them. A walk opened on `standing_activity` appends to the tokens the host holds.

internals:
  - id: fan_convergence_activity
    description: The activity a fan's branches converge on, which the walk resumes from once the fan is opened.
  - id: stands_on_activity
    description: Whether the session already stands on the activity the next entry carries, the advance that entered it having been made.

steps:
  - kind: action
    id: verify-preconditions
    actions:
      - action: validate
        target: session_index
        message: Cannot walk a session without a session_index; the session must be open
  # The host holds from_activity, worker_result and the walk's tokens from any earlier walk, so each
  # opening step clears what that walk retired: the walk's first advance retires nothing.
  - kind: action
    id: prime-initial-activity
    when: "!standing_activity"
    actions:
      - action: set
        target: current_activity
        value: "{initial_activity}"
      - action: set
        target: from_activity
        value: null
      - action: set
        target: worker_result
        value: null
      - action: set
        target: trace_tokens
        value: []
  - kind: action
    id: resume-standing-activity
    when: standing_activity
    actions:
      - action: set
        target: current_activity
        value: "{standing_activity}"
      - action: set
        target: from_activity
        value: "{standing_activity}"
      - action: set
        target: stands_on_activity
        value: true
      - action: set
        target: worker_result
        value: null
  - kind: loop
    id: activity-cycle
    name: Activity Cycle
    loopType: while
    continueWhile:
      type: simple
      variable: current_activity
      operator: "!="
      value: null
    maxIterations: 200
    steps:
      - kind: technique
        id: enter-activity
        when: "!worker_agent_id && !worker_result.next_activity_fans && worker_result.result_type != 'checkpoint_pending'"
        technique:
          name: enter_activity
          inputs:
            activity_id: current_activity
            exit_id: "{worker_result.activity_exit}"
            session_index: session_index
            agent_technique: workflow-engine::activity-worker
            step_manifest: "{worker_result.steps_completed}"
            variables_changed: "{worker_result.variables_changed}"
            stands_on_activity: stands_on_activity
            variable_bag: variables
        actions:
          - action: set
            target: trace_tokens
            value: "{advance_trace_tokens}"
            description: The tokens this entry returned, appended to the tokens the walk holds.
      - kind: action
        id: spend-entered-activity
        when: stands_on_activity
        actions:
          # The entry just made carried the activity the session stood on; every later entry advances.
          - action: set
            target: stands_on_activity
            value: false
      - kind: action
        id: end-walk
        when: worker_result.result_type == "workflow_complete"
        actions:
          # The advance onto `__terminal__` completed the session, so the walk ends on this iteration.
          - action: set
            target: current_activity
            value: null
      - kind: technique
        id: enter-fan
        when: "!worker_agent_id && worker_result.next_activity_fans"
        technique:
          name: fan::enter-fan
          inputs:
            fan_destination: current_activity
            exit_id: "{worker_result.activity_exit}"
            session_index: session_index
            step_manifest: "{worker_result.steps_completed}"
            variables_changed: "{worker_result.variables_changed}"
          outputs:
            barrier_destination: fan_convergence_activity
        actions:
          - action: set
            target: trace_tokens
            value: "{advance_trace_tokens}"
            description: The tokens this entry returned, appended to the tokens the walk holds.
      - kind: technique
        id: spawn-branches
        when: "!worker_agent_id && worker_result.next_activity_fans"
        technique:
          name: fan::spawn-branches
          inputs:
            branch_activities: branch_activities
            agent_technique: workflow-engine::activity-worker
            variable_bag: variables
          outputs:
            branch_envelopes: branch_envelopes
      - kind: loop
        id: branch-retirement
        name: Branch Retirement
        loopType: forEach
        variable: current_branch
        over: branch_activities
        maxIterations: 50
        when: "!worker_agent_id && worker_result.next_activity_fans"
        steps:
          - kind: technique
            id: retire-branch
            technique:
              name: fan::retire-branch
              inputs:
                branch_activity: current_branch
                branch_envelopes: branch_envelopes
                barrier_destination: fan_convergence_activity
                session_index: session_index
            actions:
              - action: set
                target: trace_tokens
                value: "{advance_trace_tokens}"
                description: The token this retirement returned, appended to the tokens the walk holds.
      - kind: routine
        id: persist-the-fan
        when: "!worker_agent_id && worker_result.next_activity_fans"
        routine: persist-activity
        with:
          activity_id: "{branch_activities}"
        outputs:
          push_landed: push_landed
      - kind: action
        id: surface-unlanded-fan-push
        when: "!worker_agent_id && worker_result.next_activity_fans && !push_landed"
        actions:
          - action: message
            message: "The push did not land. The error is surfaced and the walk does not advance."
          - action: set
            target: current_activity
            value: null
      - kind: action
        id: advance-past-fan
        when: fan_convergence_activity && push_landed
        actions:
          - action: set
            target: current_activity
            value: "{fan_convergence_activity}"
          # The last branch retirement entered the convergence activity, so its entry makes no advance.
          - action: set
            target: stands_on_activity
            value: true
      - kind: action
        id: retire-fan-envelope
        when: fan_convergence_activity && push_landed
        actions:
          # After the fan is opened the walk holds the convergence as current_activity.
          # The envelope and the convergence name stay unset so later steps in this
          # iteration, and the next iteration, treat that activity as the next one to carry.
          - action: set
            target: worker_result
            value: null
          - action: set
            target: fan_convergence_activity
            value: null
      - kind: technique
        id: present-yielded-checkpoint
        when: worker_result.result_type == "checkpoint_pending"
        technique:
          name: workflow-engine::present-checkpoint-to-user
          inputs:
            session_index: session_index
      - kind: technique
        id: respond-yielded-checkpoint
        when: worker_result.result_type == "checkpoint_pending"
        technique:
          name: workflow-engine::respond-checkpoint
          inputs:
            session_index: session_index
            checkpoint_resolution: user_selection
      - kind: technique
        id: resume-yielded-worker
        when: worker_result.result_type == "checkpoint_pending" && worker_agent_id
        technique:
          name: workflow-engine::resume-worker
          inputs:
            session_index: session_index
            activity_id: current_activity
            worker_agent_id: worker_agent_id
            checkpoint_reply: checkpoint_reply
            variable_bag: variables
      - kind: technique
        id: resume-entered-activity
        when: worker_result.result_type == "checkpoint_pending" && !worker_agent_id
        technique:
          name: enter_activity
          inputs:
            activity_id: current_activity
            session_index: session_index
            agent_technique: workflow-engine::activity-worker
            variable_bag: variables
        actions:
          - action: set
            target: trace_tokens
            value: "{advance_trace_tokens}"
            description: The tokens this entry returned, appended to the tokens the walk holds.
      - kind: action
        id: clear-checkpoint-reply
        when: checkpoint_reply
        actions:
          # The reply belongs to the continuation just made; no later dispatch in the walk binds it.
          - action: set
            target: checkpoint_reply
            value: null
      - kind: routine
        id: commit-activity-artifacts
        when: worker_result.result_type == "activity_complete"
        routine: persist-activity
        with:
          activity_id: current_activity
        outputs:
          push_landed: push_landed
      - kind: action
        id: surface-unlanded-push
        when: worker_result.result_type == "activity_complete" && !push_landed
        actions:
          - action: message
            message: "The push did not land. The error is surfaced and the walk does not advance."
          - action: set
            target: current_activity
            value: null
      - kind: technique
        id: continue-batched-worker
        when: push_landed && worker_agent_id && worker_result.result_type == "activity_complete" && worker_result.batch_may_continue && worker_result.next_activity_id != "__terminal__" && !worker_result.next_activity_fans
        technique:
          name: workflow-engine::continue-batch
          inputs:
            activity_id: "{worker_result.next_activity_id}"
            exit_id: "{worker_result.activity_exit}"
            session_index: session_index
            worker_agent_id: worker_agent_id
            step_manifest: "{worker_result.steps_completed}"
            variables_changed: "{worker_result.variables_changed}"
            variable_bag: variables
        actions:
          - action: set
            target: trace_tokens
            value: "{advance_trace_tokens}"
            description: The tokens this entry returned, appended to the tokens the walk holds.
      - kind: action
        id: note-exiting-activity
        when: worker_result.result_type == "activity_complete" && push_landed
        actions:
          # Kept before the pointer moves: every advance names the activity it retires, and the
          # next step makes current_activity the destination. Each operation's `from_activity`
          # input resolves to this target by name, so no step binds it.
          - action: set
            target: from_activity
            value: "{current_activity}"
      - kind: action
        id: advance-activity
        when: worker_result.result_type == "activity_complete" && push_landed
        actions:
          - action: set
            target: current_activity
            value: "{worker_result.next_activity_id}"
      - kind: action
        id: release-spent-worker
        when: worker_result.result_type == "activity_complete" && (!worker_result.batch_may_continue || worker_result.next_activity_id == "__terminal__" || worker_result.next_activity_fans)
        actions:
          - action: set
            target: worker_agent_id
            value: null
      - kind: action
        id: stop-before-terminal
        when: completes_session == false && current_activity == "__terminal__"
        actions:
          # The walk ends on the envelope naming `__terminal__`, and the advance onto it is the caller's.
          - action: set
            target: current_activity
            value: null
