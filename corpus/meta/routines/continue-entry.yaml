id: continue-entry
version: 1.0.0
name: Continue Entry
description: >-
  Advance the session once, continue the worker that holds the batch, and open a
  replacement when that continuation does not return an accepted envelope.

inputs:
  - id: activity_id
    description: The activity the advance opens.
  - id: session_index
    description: The session whose pointer this entry advances.
  - id: workflow_id
    description: The workflow the worker executes.
  - id: from_activity
    description: The activity this advance retires.
  - id: exit_id
    description: The exit the retired activity took.
  - id: step_manifest
    description: The steps the retired activity completed.
  - id: variables_changed
    description: The bag writes of the retired activity.
  - id: worker_agent_id
    description: The delivery identity the batch is carried under.
  - id: harness_agent_id
    description: The harness identifier of the agent carrying worker_agent_id.
  - id: agent_technique
    description: The agent technique a replacement follows.

outputs:
  - id: worker_result
    description: The envelope this entry closes on.
  - id: worker_agent_id
    description: The identity now holding the activity.
  - id: advance_trace_tokens
    description: The trace token the advance returned.

steps:
  - kind: technique
    id: advance
    technique:
      name: workflow-engine::continue-batch
      inputs:
        activity_id: activity_id
        session_index: session_index
        from_activity: from_activity
        exit_id: exit_id
        step_manifest: step_manifest
        variables_changed: variables_changed
        worker_agent_id: worker_agent_id
  - kind: routine
    id: continue-worker
    routine: continue-worker
    with:
      session_index: session_index
      workflow_id: workflow_id
      activity_id: activity_id
      worker_agent_id: worker_agent_id
      harness_agent_id: harness_agent_id
    outputs:
      worker_result: worker_result
  - kind: routine
    id: finish-activity
    when: worker_result.result_type == "steps_complete"
    routine: finish-activity
    with:
      current_activity: "{worker_result.activity_definition}"
      exit_destinations: "{worker_result.exit_destinations}"
      selected_exit: "{worker_result.selected_exit}"
      steps_completed: "{worker_result.steps_completed}"
      checkpoints_responded: "{worker_result.checkpoints_responded}"
      artifacts_produced: "{worker_result.artifacts_produced}"
      batch_may_continue: "{worker_result.batch_may_continue}"
    outputs:
      activity_result: worker_result
  - kind: routine
    id: open-replacement
    when: worker_result.result_type != "activity_complete" && worker_result.result_type != "checkpoint_pending" && worker_result.result_type != "steps_complete"
    routine: open-worker
    with:
      agent_technique: agent_technique
      session_index: session_index
      workflow_id: workflow_id
      activity_id: activity_id
      worker_agent_id: worker_agent_id
    outputs:
      worker_result: worker_result
  - kind: routine
    id: finish-replacement
    when: worker_result.result_type == "steps_complete"
    routine: finish-activity
    with:
      current_activity: "{worker_result.activity_definition}"
      exit_destinations: "{worker_result.exit_destinations}"
      selected_exit: "{worker_result.selected_exit}"
      steps_completed: "{worker_result.steps_completed}"
      checkpoints_responded: "{worker_result.checkpoints_responded}"
      artifacts_produced: "{worker_result.artifacts_produced}"
      batch_may_continue: "{worker_result.batch_may_continue}"
    outputs:
      activity_result: worker_result
  - kind: technique
    id: account
    technique:
      name: workflow-engine::account-worker
      inputs:
        activity_id: activity_id
        worker_agent_id: worker_agent_id
        worker_result: worker_result
