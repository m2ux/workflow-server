id: persist-activity
version: 1.6.0
name: Persist Activity
description: >-
  Mark a completed activity's Progress and lifecycle status, commit its source changes and its
  engineering artifacts, push both commits, and emit the run status once the engineering push is
  on the remote. The source commit takes the shape the component has: a submodule carries its own
  commit and the parent's pointer, and a component inside the host checkout carries its changes on
  the host branch. The completion status lands on the cell the in-progress mark used, so the commit
  carries the outcome. Where the activity holds the branches a fan retired, the run persists once
  for all of them.

inputs:
  - id: activity_id
    description: The activity whose completion this run records. A fan's convergence passes the list of branches it retired.
  - id: mark_progress_na
    default: false
    description: True when the completing activity is marked path-skip / cancel / N/A rather than complete.
  - id: planning_folder_path
    description: Path to the session's planning folder, as the server returned it.
  - id: host_repo_path
    description: Absolute path of the outermost git host for the workspace checkout.
  - id: component_path
    description: Path of the component under work, relative to the host repository.
  - id: workflow_id
    description: The workflow the activity belongs to.
  - id: is_signed
    description: Whether the engineering commit is signed.
  - id: seed_profile
    description: The readme-seed profile. Unset when the walk has none.
  - id: session_index
    description: The session this persist is recorded against.

outputs:
  - id: push_landed
    type: boolean
    description: Whether the engineering push is on the remote tracking branch, with every named path in that commit.

internals:
  - id: source_kind
    description: Whether the component under work is a submodule of the host.
  - id: source_repo_path
    description: The checkout the source commit and its push run in.
  - id: source_branch
    description: The branch checked out where the source commit lands, which the source push sends.
  - id: source_paths
    description: The component files this activity's source commit names.
  - id: source_commit_message
    description: The Conventional Commits message the source commit carries.
  - id: has_source_changes
    description: Whether this activity left any component file to commit.
  - id: paths
    description: The engineering files this activity's commit names.
  - id: commit_message
    description: The Conventional Commits message the engineering commit carries.
  - id: engineering_branch
    description: The branch checked out where the engineering commit lands, which the push sends.
  - id: engineering_kind
    description: Whether `.engineering` is a linked worktree of the host or a checkout of its own.
  - id: engineering_repo_path
    description: The checkout the engineering push runs in.
  - id: has_engineering_changes
    description: Whether this activity left any engineering file to commit.

steps:
  - kind: technique
    id: sync-progress-status
    technique:
      name: workflow-engine::sync-progress-status
      inputs:
        activity_id: activity_id
        planning_folder_path: planning_folder_path
        mark_progress_na: mark_progress_na
        seed_profile: seed_profile
        session_index: session_index
  - kind: technique
    id: prepare-source-commit
    technique:
      name: workflow-engine::prepare-source-commit
      inputs:
        component_path: component_path
        host_repo_path: host_repo_path
        planning_folder_path: planning_folder_path
        activity_id: activity_id
        workflow_id: workflow_id
        session_index: session_index
      outputs:
        source_kind: source_kind
        source_repo_path: source_repo_path
        source_branch: source_branch
        source_paths: source_paths
        source_commit_message: source_commit_message
        has_source_changes: has_source_changes
  - kind: technique
    id: commit-source-submodule
    when: source_kind == "submodule" && has_source_changes
    technique:
      name: git::commit-submodule
      inputs:
        submodule_path: "{component_path}"
        activity_id: activity_id
        workflow_id: workflow_id
        planning_folder_path: planning_folder_path
      outputs:
        paths: source_paths
  - kind: technique
    id: commit-source-files
    when: source_kind != "submodule" && has_source_changes
    technique:
      name: git::commit-regular-files
      inputs:
        paths: source_paths
        commit_message: source_commit_message
        planning_folder_path: planning_folder_path
  - kind: technique
    id: push-source-branch
    when: source_kind != "submodule" && has_source_changes
    technique:
      name: git::push-branch
      inputs:
        repo_path: source_repo_path
        branch: source_branch
        remote_name: origin
        planning_folder_path: planning_folder_path
  - kind: technique
    id: prepare-engineering-commit
    technique:
      name: workflow-engine::prepare-engineering-commit
      inputs:
        host_repo_path: host_repo_path
        planning_folder_path: planning_folder_path
        activity_id: activity_id
        workflow_id: workflow_id
        session_index: session_index
      outputs:
        paths: paths
        commit_message: commit_message
        engineering_branch: engineering_branch
        engineering_kind: engineering_kind
        engineering_repo_path: engineering_repo_path
        has_engineering_changes: has_engineering_changes
  - kind: technique
    id: commit-worktree
    when: engineering_kind == "worktree" && has_engineering_changes
    technique:
      name: git::commit-worktree
      inputs:
        worktree_path: "{host_repo_path}/.engineering"
        paths: paths
        commit_message: commit_message
        is_signed: is_signed
        planning_folder_path: planning_folder_path
  - kind: technique
    id: push-worktree-branch
    when: engineering_kind == "worktree" && has_engineering_changes
    technique:
      name: git::push-branch
      inputs:
        repo_path: "{host_repo_path}/.engineering"
        branch: engineering_branch
        remote_name: origin
        planning_folder_path: planning_folder_path
  - kind: technique
    id: commit-engineering-files
    when: engineering_kind != "worktree" && has_engineering_changes
    technique:
      name: git::commit-regular-files
      inputs:
        paths: paths
        commit_message: commit_message
        planning_folder_path: planning_folder_path
  - kind: technique
    id: push-engineering-branch
    when: engineering_kind != "worktree" && has_engineering_changes
    technique:
      name: git::push-branch
      inputs:
        repo_path: "{host_repo_path}"
        branch: engineering_branch
        remote_name: origin
        planning_folder_path: planning_folder_path
  - kind: action
    id: skip-clean-engineering-commit
    when: "!has_engineering_changes"
    actions:
      - action: set
        target: push_landed
        value: true
  - kind: technique
    id: confirm-push
    when: has_engineering_changes
    technique:
      name: git::confirm-persisted
      inputs:
        repo_path: engineering_repo_path
        branch: engineering_branch
        paths: paths
        remote_name: origin
        planning_folder_path: planning_folder_path
  - kind: technique
    id: publish-run-status
    when: push_landed
    technique:
      name: workflow-engine::publish-run-status
      inputs:
        activity_id: activity_id
        planning_folder_path: planning_folder_path
        session_index: session_index
