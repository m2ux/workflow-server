id: dispatch-entry
version: 1.0.0
name: Dispatch Entry
description: >-
  Publish the entering mark, advance the session, announce the dispatch, and open one
  worker. A terminal advance completes the session and opens no worker.

inputs:
  - id: activity_id
    description: The activity this entry carries.
  - id: session_index
    description: The session whose pointer this entry advances.
  - id: workflow_id
    description: The workflow the worker executes.
  - id: planning_folder_path
    description: The planning folder whose Progress mark is published. Unset until the folder exists.
  - id: target_status
    description: The dispatch-moment Progress status.
  - id: seed_profile
    description: The readme-seed profile. Unset when the walk has none.
  - id: branch
    description: The branch checked out where the mark is pushed.
  - id: from_activity
    description: The activity this entry retires. Unset on a first entry.
  - id: exit_id
    description: The exit the retired activity took.
  - id: step_manifest
    description: The steps the retired activity completed.
  - id: variables_changed
    description: The bag writes of the retired activity.
  - id: stands_on_activity
    description: True when the session already stands on activity_id.
  - id: agent_technique
    description: The agent technique the worker follows.

outputs:
  - id: worker_result
    description: The envelope this entry closes on.
  - id: worker_agent_id
    description: The delivery identity bound for the worker. Unset when the session completed.
  - id: advance_trace_tokens
    description: The trace token the advance returned.

steps:
  - kind: routine
    id: publish-entering-mark
    when: planning_folder_path && activity_id != "__terminal__"
    routine: publish-entering-mark
    with:
      activity_id: activity_id
      planning_folder_path: planning_folder_path
      target_status: target_status
      seed_profile: seed_profile
      commit_message: "{activity_id} entering"
      branch: branch
      repo_path: "."
      paths: "{planning_folder_path}/README.md"
  - kind: technique
    id: advance-and-announce
    technique:
      name: workflow-engine::dispatch-activity
      inputs:
        activity_id: activity_id
        session_index: session_index
        from_activity: from_activity
        exit_id: exit_id
        step_manifest: step_manifest
        variables_changed: variables_changed
        stands_on_activity: stands_on_activity
  - kind: routine
    id: open-worker
    when: worker_result.result_type != "workflow_complete"
    routine: open-worker
    with:
      agent_technique: agent_technique
      session_index: session_index
      workflow_id: workflow_id
      activity_id: activity_id
      worker_agent_id: worker_agent_id
    outputs:
      worker_result: worker_result
  - kind: routine
    id: finish-activity
    when: worker_result.result_type == "steps_complete"
    routine: finish-activity
    with:
      current_activity: "{worker_result.activity_definition}"
      exit_destinations: "{worker_result.exit_destinations}"
      selected_exit: "{worker_result.selected_exit}"
      steps_completed: "{worker_result.steps_completed}"
      checkpoints_responded: "{worker_result.checkpoints_responded}"
      artifacts_produced: "{worker_result.artifacts_produced}"
      batch_may_continue: "{worker_result.batch_may_continue}"
    outputs:
      activity_result: worker_result
  - kind: technique
    id: account
    when: worker_result.result_type != "workflow_complete"
    technique:
      name: workflow-engine::account-worker
      inputs:
        activity_id: activity_id
        worker_agent_id: worker_agent_id
        worker_result: worker_result
  - kind: technique
    id: mark-followup
    when: followup_status
    technique:
      name: workflow-engine::sync-progress-status
      inputs:
        activity_id: activity_id
        planning_folder_path: planning_folder_path
        target_status: followup_status
