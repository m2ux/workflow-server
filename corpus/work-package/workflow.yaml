$schema: ../../schemas/workflow.schema.json
id: work-package
version: 4.9.1
title: Work Package Implementation Workflow
description: Defines how to carry ONE work package to the terminal state its mode reaches — implementation from inception to a merged pull request, or review from inception to a posted review awaiting the author's disposition. A work package is a discrete unit of work such as a feature, bug-fix, enhancement, refactoring, an audit of an existing pull request, or any other deliverable. For multiple related work packages, use the work-packages workflow to create a roadmap first.
author: m2ux
tags:
  - implementation
  - engineering
  - planning
  - feature
  - bug-fix
  - pr
  - review
techniques:
  activity:
    - variable-binding
variables:
  - name: is_review_mode
    type: boolean
    defaultValue: false
    description: True when the work package reviews an existing PR instead of producing a new implementation.
  - name: optional_activities_declined
    type: boolean
    description: Whether the user declined the optional discovery activities, elicitation and research.
    defaultValue: false
  - name: target_path
    type: string
    description: Feature worktree path for edits, builds, and PR ops.
  - name: target_repo
    type: string
    description: GitHub repository as owner/repo.
  - name: component_git_dir
    type: string
    description: Absolute path of the component's git working tree, whose origin remote names the component's repository.
  - name: pr_number
    type: string
    description: Pull request number.
  - name: branch_name
    type: string
    description: Feature branch name.
  - name: headless_mode
    type: boolean
    description: Whether the run resolves a soft mid-flow gate to its default without reaching a person.
    defaultValue: false
  - name: issue_type
    type: string
    description: What kind of change the ticket records.
    values:
      - feature
      - bug
      - task
      - enhancement
      - epic
  - name: user_request
    type: string
    description: The user's free-form request that opened this work package.
  # Seeded with the session and named by the shared contract of the operations this workflow
  # borrows, so the file owns the name and no activity produces it.
  - name: host_repo_path
    type: string
    description: Absolute path to the host repository the session belongs to.
  - name: planning_folder_path
    type: string
    description: "Path to planning folder: .engineering/artifacts/planning/YYYY-MM-DD-{work-package-name}."
  - name: provenance_log_path
    type: string
    description: Absolute path to the AI-assistance provenance log.
    defaultValue: ""
  - name: default_branch
    type: string
    description: The repository's default branch, which feature branches sync from and merge into.
  - name: needs_further_discussion
    type: boolean
    description: Whether further stakeholder discussion is needed.
    defaultValue: false
  - name: needs_plan_revision
    type: boolean
    description: Whether the approach needs significant revision.
    defaultValue: false
  - name: flagged_block_indices
    type: array
    description: Change-block indices the reviewer flagged as carrying an issue.
  - name: question_domains
    type: array
    description: The domains elicitation questions are drawn from.
  - name: jira_issue_key
    type: string
    description: Jira issue key in PROJ-NNN form.
    defaultValue: ""
  - name: block_path
    type: string
    description: File path of the code block under review.
    defaultValue: ""
  - name: block_line_range
    type: string
    description: Line range of the code block under review, as `start-end`.
    defaultValue: ""
  - name: implementation_plan
    type: object
    defaultValue: {}
    description: The ordered tasks the change is built from, each with its crate and description.
  - name: issue_title
    type: string
    description: Tracker issue/ticket title.
  - name: stealth_mode
    type: boolean
    description: True when the run suppresses every public-disclosure side-effect.
    defaultValue: false
  - name: base_remote
    type: string
    description: Git remote the feature branch is cut from.
    defaultValue: origin
  - name: push_remote
    type: string
    description: Git remote the run pushes to.
    defaultValue: origin
  - name: issue_request
    type: string
    description: The issue key, URL, or surrounding text the user supplied when opening the work package, or typed in reply to the issue-verification gate.
    defaultValue: ""
  # Fan barriers write these containers; empty default covers skip-optional → join paths.
  - name: research_outputs
    type: array
    defaultValue: []
    description: Fan container for the research branch of the discovery fan.
  - name: implementation_analysis_outputs
    type: array
    defaultValue: []
    description: Fan container for the implementation-analysis branch of the discovery fan.
  - name: code_review_outputs
    type: array
    defaultValue: []
    description: Fan container for the code-review branch of the review fan.
  - name: structural_analysis_outputs
    type: array
    defaultValue: []
    description: Fan container for the structural-analysis branch of the review fan.
  - name: test_suite_review_outputs
    type: array
    defaultValue: []
    description: Fan container for the test-suite-review branch of the review fan.
  - name: contract_tests_outputs
    type: array
    defaultValue: []
    description: Fan container for the contract-tests branch of the implementation fan.
  - name: implement_outputs
    type: array
    defaultValue: []
    description: Fan container for the implement branch of the implementation fan.

  - name: test_status
    type: object
    defaultValue: {}
    description: The latest test-check status.
  - name: failures
    type: array
    defaultValue: []
    description: Per-test failure detail.
  - name: commit_sha
    type: string
    defaultValue: ""
    description: Tip commit of the change.
  - name: needs_research
    type: boolean
    defaultValue: false
    description: Whether research runs.
  - name: task_implementation
    type: object
    defaultValue: {"summary": ""}
    description: Per-task implementation record.
  - name: changed_files
    type: array
    defaultValue: []
    description: Changed file paths.

initialActivity: start-work-package
graph:
  start-work-package:
    done: design-philosophy
  design-philosophy:
    done: codebase-comprehension
    revise-classification: design-philosophy
  requirements-elicitation:
    research-needed:
      - research
      - implementation-analysis
    no-research-needed:
      - research
      - implementation-analysis
    elicitation-incomplete: requirements-elicitation
  research:
    done: plan-prepare
  implementation-analysis:
    done: plan-prepare
  plan-prepare:
    done: assumptions-review
    revise: plan-prepare
  assumptions-review:
    needs-comprehension: codebase-comprehension
    needs-plan-revision: plan-prepare
    needs-further-discussion: assumptions-review
    review-mode: lean-coding-audit
    assumptions-approved:
      - contract-tests
      - implement
  contract-tests:
    done: implementation-join
  implement:
    done: implementation-join
  implementation-join:
    done: lean-coding-audit
    needs-rework: implement
    needs-contract-tests: contract-tests
  lean-coding-audit:
    done: prism-decision
  prism-decision:
    remeasure: prism-decision
    done:
      - code-review
      - structural-analysis
      - test-suite-review
  code-review:
    done: post-impl-review
  structural-analysis:
    done: post-impl-review
  test-suite-review:
    done: post-impl-review
  post-impl-review:
    done: validate
    has-blocker: implement
  validate:
    done: strategic-review
  strategic-review:
    review-mode: submit-for-review
    review-passed: submit-for-review
    needs-more-review: strategic-review
    review-failed: plan-prepare
  submit-for-review:
    review-mode: complete
    review-approved: complete
    review-requires-changes: plan-prepare
    provide-input: submit-for-review
    abort: complete
  complete:
    done: __terminal__
  codebase-comprehension:
    needs-elicitation: requirements-elicitation
    research-needed:
      - research
      - implementation-analysis
    skip-optional-activities: plan-prepare
    comprehension-complete:
      - research
      - implementation-analysis
