id: structural-analysis
version: 1.0.0
name: Structural Analysis
description: Run the single inline structural pass when the change takes that mode; the full prism pipeline runs at the review fan's join.
variables:
  reads:
    - pipeline_mode
  writes:
    - name: structural_findings
      type: array
      description: The structural-analysis findings for this change from the inline pass.
required: true
steps:
  - kind: technique
    id: structural-analysis-inline
    when: pipeline_mode != 'full-prism'
    technique:
      name: prism/structural-analysis
      outputs:
        structural_analysis: structural_findings
  - kind: action
    id: defer-full-prism
    when: pipeline_mode == 'full-prism'
    actions:
      - action: log
        message: Full prism pipeline runs at post-implementation review
exits:
  - id: done
    isDefault: true
outcome:
  - Structural findings from the inline pass are ready for triage at the review fan's join, or the join runs the full prism pipeline
