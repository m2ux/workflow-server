id: plan-prepare
version: 1.14.0
name: Plan & Prepare
description: Design the approach and prepare the plan and the test plan.
variables:
  reads:
    - assumptions_log
    - branch_name
    - component_git_dir
    - default_branch
    - host_repo_path
    - implementation_analysis_outputs
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - research_outputs
    - research_direction
    - review_summary
    - stealth_mode
    - target_path
    - target_repo
  writes:
    - name: analysis_assumptions
      type: array
      description: Assumptions the implementation-analysis branch surfaced, hoisted from its container when the discovery fan ran.
      defaultValue: []
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: body_conforms
      type: boolean
      description: True once the rendered PR body satisfies every conformance criterion in the pr-description guide.
      defaultValue: false
    - name: body_findings
      type: array
      description: List of PR-body conformance violations.
      defaultValue: []
    - name: query_report
      type: object
      description: Execution flows related to this work.
    - name: changed_files
      type: array
      description: Ordered list of changed file paths, hoisted from the implementation-analysis branch when the discovery fan ran.
      defaultValue: []
    - name: context_scope
      type: string
      description: Provenance scope of AI-generated code in this work package.
      values:
        - repo-only
        - web-retrieval
        - mixed
      defaultValue: repo-only
    - name: context_scope_uncertain
      type: boolean
      description: True when research run evidence cannot decide repo-only vs web-retrieval vs mixed for context_scope.
      defaultValue: false
    - name: has_reconcilable_research
      type: boolean
      description: Whether open research-reconcilable candidates remain.
      defaultValue: false
    - name: rendered_pr_body
      type: string
      description: The body now live on the PR after the patch.
    - name: research_assumptions
      type: array
      description: Assumptions the research branch surfaced, hoisted from its container when the discovery fan ran.
      defaultValue: []
    - name: research_candidates
      type: array
      description: Inventory of open research gaps from the research branch.
      defaultValue: []
    - name: research_direction
      type: string
      description: Text the user typed naming the candidate and the focus for a further research pass.
      defaultValue: ""
    - name: research_document
      type: object
      description: The research findings document, hoisted from the research branch when the discovery fan ran.
    - name: stakeholder_overview
      type: string
      description: The two-paragraph plain-language overview written under `{readme_section_heading}` in the planning folder README.
required: true
steps:
  - kind: action
    id: env-prerequisites
    actions:
      - action: validate
        target: workflows.worktree.present == true
        message: "The workflows worktree is missing. Add the workflows worktree beside this checkout."
      - action: validate
        target: target_path != null
        message: "`{target_path}` is unset, so there is no worktree to plan against."
      - action: validate
        target: host_repo_path != null
        message: "`{host_repo_path}` is unset, so the repository root is unresolved."
      - action: validate
        target: planning_folder_path.writable == true
        message: "`{planning_folder_path}` is not writable. Confirm the path exists and is writable."
      - action: validate
        target: gh.auth.status == 0
        message: gh CLI is not authenticated.
        condition:
          type: simple
          variable: stealth_mode
          operator: "!="
          value: true
      - action: validate
        target: gpg.agent.reachable == true
        message: GPG agent is not reachable.
  - kind: action
    id: take-research-fan
    when: research_outputs
    actions:
      - action: set
        target: research_assumptions
        value: "{research_outputs.0.result.research_assumptions}"
      - action: set
        target: research_candidates
        value: "{research_outputs.0.result.research_candidates}"
      - action: set
        target: has_reconcilable_research
        value: "{research_outputs.0.result.has_reconcilable_research}"
      - action: set
        target: context_scope
        value: "{research_outputs.0.result.context_scope}"
      - action: set
        target: context_scope_uncertain
        value: "{research_outputs.0.result.context_scope_uncertain}"
      - action: set
        target: research_document
        value: "{research_outputs.0.result.research_document}"
  - kind: action
    id: take-analysis-fan
    when: implementation_analysis_outputs
    actions:
      - action: set
        target: analysis_assumptions
        value: "{implementation_analysis_outputs.0.result.analysis_assumptions}"
      - action: set
        target: changed_files
        value: "{implementation_analysis_outputs.0.result.changed_files}"
  - kind: technique
    id: ingest-discovery-assumptions
    technique:
      name: ingest-assumption-surfaces
      inputs:
        research_assumptions: research_assumptions
        analysis_assumptions: analysis_assumptions
        assumptions_log: assumptions_log
  - kind: loop
    id: research-reconciliation
    name: Research Reconciliation Loop
    loopType: doWhile
    when: has_reconcilable_research == true
    continueWhile:
      type: simple
      variable: has_reconcilable_research
      operator: ==
      value: true
    maxIterations: 10
    steps:
      - kind: action
        id: announce-research-direction
        when: has_reconcilable_research == true
        actions:
          - action: message
            message: "Further research direction: {research_direction}."
      - kind: technique
        id: reconcile-research-candidates
        technique:
          name: research/reconcile
          inputs:
            research_direction: research_direction
        when: has_reconcilable_research == true
      - kind: checkpoint
        id: research-convergence
        condition:
          type: simple
          variable: has_reconcilable_research
          operator: ==
          value: false
        message: "Research has converged. Full candidate inventory ([Open Research Candidates]({research_document})): {research_candidates}."
        defaultOption: accept-research
        autoAdvanceMs: 30000
        options:
          - id: accept-research
            label: Accept — proceed to planning
            description: Research is complete; the remaining open candidates are irreconcilable by research.
          - id: request-more
            label: Direct further research
            description: The reply names the candidate and the focus for a further research pass.
            effect:
              recordReply: research_direction
              setVariable:
                has_reconcilable_research: true
  - kind: checkpoint
    id: context-scope-declaration
    condition:
      type: simple
      variable: context_scope_uncertain
      operator: ==
      value: true
    message: The research run's evidence settles no single provenance scope for the sources that informed the design.
    defaultOption: repo-only
    autoAdvanceMs: 15000
    options:
      - id: repo-only
        label: Repository only — no external web sources used
        description: All research was based on codebase and local knowledge
        effect:
          setVariable:
            context_scope: repo-only
            context_scope_uncertain: false
      - id: web-retrieval
        label: External web sources used for design decisions
        description: Web search, external docs, or third-party references informed the approach
        effect:
          setVariable:
            context_scope: web-retrieval
            context_scope_uncertain: false
      - id: mixed
        label: Both repository and external sources used
        description: Mix of codebase analysis and external references
        effect:
          setVariable:
            context_scope: mixed
            context_scope_uncertain: false
  - kind: technique
    id: create-plan
    technique: plan
  - kind: technique
    id: find-test-patterns
    technique:
      name: gitnexus::query
      inputs:
        search_query: problem_statement
  - kind: technique
    id: create-test-plan
    technique:
      name: create-test-plan
      inputs:
        query_report: query_report
  - kind: technique
    id: present-solution-overview
    technique:
      name: stakeholder-overview
      inputs:
        readme_section_heading: "## Solution Overview"
    actions:
      - action: message
        message: |-
          **Solution Overview** — plain-language summary for stakeholder reference

          {stakeholder_overview}
  - kind: technique
    id: collect-assumptions
    technique:
      name: review-assumptions::collect
      inputs:
        assumption_categories: Design Approach, Task Breakdown, Dependency Assumptions, Test Strategy, Scope Decisions
  - kind: technique
    id: create-todos
    technique: create-todos
  - kind: technique
    id: sync-branch
    technique: manage-git::sync-branch
  - kind: technique
    id: update-pr
    technique:
      name: update-pr::render
      inputs:
        pr_template_variant: initial
    when: is_review_mode != true && stealth_mode != true
  - kind: checkpoint
    id: approach-confirmed
    condition:
      type: simple
      variable: is_review_mode
      operator: "!="
      value: true
    message: "The approach the [plan]({plan_document}) is built on, summarised above."
    defaultOption: confirmed
    autoAdvanceMs: 30000
    options:
      - id: confirmed
        label: Approach confirmed
        description: Proceed with this approach
      - id: revise
        label: Revise approach
        description: Adjust the approach before planning continues
        effect:
          exit: revise
exits:
  - id: done
    isDefault: true
  - id: revise
    immediate: true
outcome:
  - A sequenced approach the implement activity can execute against task by task, put to the user for a decision before implementation begins
  - A defined verification strategy that validation will run the implementation against
  - Reviewers and stakeholders can see the intended approach on the PR before any code is written
  - Discovery-branch assumptions reach the log through one writer, and research's gates are raised here
