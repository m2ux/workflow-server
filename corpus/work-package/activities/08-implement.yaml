id: implement
version: 2.23.0
name: Implement Tasks
description: >-
  Execute the implementation plan task by task in the feature worktree. A branch
  of the implementation fan; symbol provenance and residual assumptions settle at
  implementation-join.
variables:
  reads:
    - host_repo_path
    - implementation_plan
    - planning_folder_path
    - project_type
    - target_repo
  writes:
    - name: assumptions_log
      type: object
      description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
    - name: task_implementation
      type: object
      description: Per-task implementation record gathered into the implement fan container.
    - name: changed_paths
      type: array
      description: Repository-relative paths the task under construction wrote.
    - name: target_symbol
      type: string
      description: The function, class, or method the task under construction changes.
    - name: task_impact
      type: object
      description: Blast radius of the symbol about to be edited — callers, flows reached, and a risk level.
    - name: context_report
      type: object
      description: Callers, callees, and flows of the symbol about to be edited.
    - name: change_report
      type: object
      description: Symbols and flows the task's diff touches.
    - name: commit_sha
      type: string
      description: SHA of the commit carrying the task under construction, empty where it staged nothing.
      defaultValue: ""
    - name: current_task
      type: object
      description: The implementation-plan task under construction.
    - name: failures
      type: array
      description: Per-test failure detail when any failed
      defaultValue: []
    - name: test_status
      type: object
      description: "The test check's status — `{ check_id, passed, diagnostics }`."
      defaultValue: {}
required: true
techniques:
  - scatter-gather
steps:
  - kind: loop
    id: task-cycle
    name: Task Implementation Cycle
    loopType: forEach
    variable: current_task
    over: implementation_plan.tasks
    steps:
      - kind: technique
        id: name-edit-target
        technique: name-edit-target
      - kind: technique
        id: pre-edit-impact
        technique:
          name: gitnexus::impact
          inputs:
            target: target_symbol
            direction: upstream
          outputs:
            impact_report: task_impact
      - kind: technique
        id: pre-edit-context
        technique:
          name: gitnexus::context
          inputs:
            name: target_symbol
      - kind: technique
        id: implement-task
        technique:
          name: implement-task
          inputs:
            impact_report: task_impact
      - kind: technique
        id: post-edit-changes
        technique: gitnexus::detect-changes
      - kind: technique
        id: record-change-scope
        technique:
          name: record-change-scope
          inputs:
            task_record: task_implementation
      - kind: technique
        id: run-tests
        technique:
          name: cargo::test
          inputs:
            build_scope: -p {current_task.crate}
        when: project_type == 'rust-substrate'
      - kind: technique
        id: commit
        technique:
          name: manage-git::commit-paths
          inputs:
            paths: changed_paths
            commit_message: "{current_task.description}"
      - kind: technique
        id: log-provenance
        technique:
          name: dco-provenance::append-task-row
          inputs:
            task_id: "{current_task.id}"
            task_description: "{current_task.description}"
      - kind: technique
        id: collect-assumptions
        technique: review-assumptions::collect
exits:
  - id: done
    isDefault: true
outcome:
  - All tasks implemented
  - The implemented work is captured as reviewable, attributable commits on the feature branch
  - An auditable per-task record of what changed and why exists to support the later DCO attestation
