id: implementation-analysis
version: 2.18.1
name: Implementation Analysis
description: Analyze the current implementation to understand effectiveness, establish baselines, and identify the gaps the change closes.
variables:
  reads:
    - base_branch
    - branch_name
    - component_git_dir
    - component_name
    - is_review_mode
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - target_path
    - target_repo
  writes:
    - name: analysis_assumptions
      type: array
      description: Assumptions this analysis pass surfaced.
      defaultValue: []
    - name: changed_files
      type: array
      description: Ordered list of changed file paths.
      defaultValue: []
required: false
steps:
  - kind: technique
    id: review-baseline-state
    technique: review-baseline-state
    when: is_review_mode == true
  - kind: technique
    id: analyze-implementation
    technique: analyze
  - kind: technique
    id: surface-assumptions
    technique:
      name: surface-assumptions
      inputs:
        assumption_categories: Current Behavior, Gap Identification, Baseline Interpretation, Dependency Understanding
      outputs:
        surfaced_assumptions: analysis_assumptions
  - kind: technique
    id: document
    technique: document
exits:
  - id: done
    isDefault: true
outcome:
  - Current state documented with baseline metrics
  - Gaps identified and prioritized
  - Success criteria defined with measurement methodology
  - Assumptions surfaced from this analysis pass
