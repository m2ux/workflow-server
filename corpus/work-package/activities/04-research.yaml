id: research
version: 2.23.1
name: Research
description: Research the knowledge base and external sources to discover best practices, patterns, and resources to inform the plan-prepare activity.
variables:
  reads:
    - branch_name
    - component_git_dir
    - needs_research
    - planning_folder_path
    - pr_number
    - problem_statement
    - requirements
    - target_path
    - target_repo
  writes:
    - name: context_scope
      type: string
      description: Provenance scope of AI-generated code in this work package.
      values:
        - repo-only
        - web-retrieval
        - mixed
      defaultValue: repo-only
    - name: context_scope_uncertain
      type: boolean
      description: True when research run evidence cannot decide repo-only vs web-retrieval vs mixed for context_scope.
      defaultValue: false
    - name: has_reconcilable_research
      type: boolean
      description: Whether open research-reconcilable candidates remain — gaps further knowledge-base or web research could close.
      defaultValue: false
    - name: needs_research
      type: boolean
      description: Whether research phase is needed.
      defaultValue: false
    - name: research_assumptions
      type: array
      description: Assumptions this research pass surfaced.
      defaultValue: []
    - name: research_candidates
      type: array
      description: Inventory of open research gaps, each triaged as reconcilable-by-research or irreconcilable, with its rationale.
      defaultValue: []
    - name: research_document
      type: object
      description: The research findings document produced when research ran.
required: false
steps:
  - kind: action
    id: skip-when-not-needed
    when: needs_research == false
    actions:
      - action: set
        target: research_assumptions
        value: []
      - action: set
        target: research_candidates
        value: []
      - action: set
        target: has_reconcilable_research
        value: false
      - action: set
        target: context_scope_uncertain
        value: false
  - kind: technique
    id: research-knowledge-base
    when: needs_research == true
    technique: research
  - kind: technique
    id: synthesize
    when: needs_research == true
    technique: synthesize
  - kind: technique
    id: triage-research-candidates
    when: needs_research == true
    technique: triage
  - kind: technique
    id: surface-assumptions
    when: needs_research == true
    technique:
      name: surface-assumptions
      inputs:
        assumption_categories: Pattern Applicability, Source Relevance, Synthesis Decisions, Risk Assessment
      outputs:
        surfaced_assumptions: research_assumptions
  - kind: technique
    id: document
    when: needs_research == true
    technique: document
  - kind: action
    id: announce-derived-context-scope
    when: needs_research == true && context_scope_uncertain != true
    actions:
      - action: message
        message: "Research context scope derived as `{context_scope}`."
  - kind: action
    id: close-research-phase
    when: needs_research == true
    actions:
      - action: set
        target: needs_research
        value: false
exits:
  - id: done
    isDefault: true
outcome:
  - Best practices identified from multiple sources when research was needed
  - Patterns validated and mapped to requirements when research was needed
  - Assumptions surfaced from this research pass
