id: converge-assumptions
version: 2.0.0
name: Assumption Convergence Loop
description: Reconcile assumptions and challenge the result until no agent-resolvable item remains.

inputs:
  - id: planning_folder_path
    description: Absolute path to this run's planning folder — the write location for every working artifact.
  - id: problem_statement
    description: A clear problem definition with system understanding, impact assessment, success criteria, and constraints — understandable without prior context.
  - id: target_repo
    description: GitHub repository as owner/repo.

outputs:
  - id: assumptions_log
    type: object
    description: The assumptions log — every assumption with its category, agent position and resolution status, and the record of truth for assumption outcomes.
  - id: has_open_assumptions
    type: boolean
    description: Whether unresolved assumptions requiring stakeholder input remain.
    optional: true
  - id: open_assumptions
    type: array
    description: The irreducible open assumptions after convergence.
    optional: true

internals:
  - id: query_report
    description: Execution flows read for this work before reconciliation.
  - id: has_resolvable_assumptions
    description: Whether a round left an assumption targeted analysis can still resolve, which keeps the loop running.

steps:
  - kind: loop
    id: convergence
    name: Assumption Convergence Loop
    loopType: doWhile
    continueWhile:
      type: simple
      variable: has_resolvable_assumptions
      operator: ==
      value: true
    maxIterations: 10
    steps:
      - kind: technique
        id: query-flows
        technique:
          name: gitnexus::query
          inputs:
            search_query: problem_statement
          outputs:
            query_report: query_report
      - kind: technique
        id: reconcile
        technique:
          name: review-assumptions::reconcile
          inputs:
            assumptions_log: assumptions_log
            query_report: query_report
          outputs:
            assumptions_log: assumptions_log
      # Named for the pass rather than for its first step: a reference id and the body step it
      # prefixes compose into one identifier, so two segments spelled alike read as a fault.
      - kind: routine
        id: challenge-pass
        routine: challenge-concerns
        with:
          challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
          concern_document: "{assumptions_log}"
        outputs:
          concern_document: assumptions_log
          concerns_agent_resolvable: has_resolvable_assumptions
          residual_opens_remain: has_open_assumptions
          residual_opens: open_assumptions
