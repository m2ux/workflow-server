id: challenge-concerns
version: 1.0.0
name: Challenge and Combine
description: Challenge a concern set from the given perspectives, then merge the resolutions back into it.

inputs:
  - id: challenge_perspectives
    description: The adversarial perspectives the challenge pass applies, as a JSON array.
  - id: concern_document
    description: The name of the document holding the concern set this pass reads and updates.
  - id: branch_name
    description: Feature branch name.
  - id: component_git_dir
    description: Absolute path of the component's git working tree, whose origin remote names the component's repository.
  - id: planning_folder_path
    description: Absolute path to this run's planning folder — the write location for every working artifact.
  - id: pr_number
    description: Pull request number.
  - id: problem_statement
    description: A clear problem definition with system understanding, impact assessment, success criteria, and constraints — understandable without prior context.
  - id: requirements
    description: The captured requirements list elicited across the domains.
  - id: target_path
    description: Feature worktree path for edits, builds, and PR ops.
  - id: target_repo
    description: GitHub repository as owner/repo.

outputs:
  - id: concern_document
    type: object
    description: The concern document with challenge resolutions applied and newly surfaced items appended.
  - id: concerns_agent_resolvable
    type: boolean
    description: Whether any item remains agent-resolvable, or is newly surfaced as such.
  - id: residual_opens_remain
    type: boolean
    description: Whether irreducible opens remain after this merge.
  - id: residual_opens
    type: array
    description: The irreducible open items after this merge.
    optional: true

internals:
  - id: challenge_findings
    description: Per-perspective challenge findings over the concern set, passed from the challenge step to the combine step.

steps:
  - kind: technique
    id: challenge
    technique:
      name: analyse-challenge::challenge
      inputs:
        challenge_perspectives: "{challenge_perspectives}"
        concern_document: concern_document
  - kind: technique
    id: combine
    technique:
      name: analyse-challenge::combine
      inputs:
        concern_document: concern_document
      outputs:
        concern_document: concern_document
        concerns_agent_resolvable: concerns_agent_resolvable
        residual_opens_remain: residual_opens_remain
        residual_opens: residual_opens
