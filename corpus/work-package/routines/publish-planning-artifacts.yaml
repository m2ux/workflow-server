id: publish-planning-artifacts
version: 1.0.0
name: Publish Planning Artifacts
description: Resolve the engineering checkout's publish branch and the changed planning-folder files, then commit and push them on that branch.

inputs:
  - id: activity_name
    description: The activity whose artifacts the commit carries, named in its message.
  - id: host_repo_path
    description: Absolute path to the host repository the session belongs to.
  - id: issue_number
    description: GitHub or Jira issue number.
  - id: planning_folder_path
    description: Absolute path to this run's planning folder — the write location for every working artifact.
  - id: target_repo
    description: GitHub repository as owner/repo.

outputs:
  - id: artifact_publish_ref
    type: string
    description: The engineering checkout's branch name — the ref engineering-artifact hyperlinks resolve against.

internals:
  - id: modified_paths
    description: Tracked paths carrying modifications in the engineering checkout.
  - id: publishable_files
    description: Every changed file under the planning folder, which the commit carries.

steps:
  - kind: technique
    id: read-working-state
    technique:
      name: git::read-working-state
      inputs:
        repo_path: host_repo_path
      outputs:
        modified_paths: modified_paths
  - kind: technique
    id: resolve
    technique:
      name: resolve-artifact-publish
      inputs:
        modified_paths: modified_paths
      outputs:
        artifact_publish_ref: artifact_publish_ref
        publishable_files: publishable_files
  - kind: technique
    id: commit
    technique:
      name: manage-git::artifact-commits
      inputs:
        activity_name: activity_name
        issue_key: issue_number
        files: publishable_files
        branch: artifact_publish_ref
