id: lint-wiki
version: 1.3.0
name: Lint Wiki
description: Bring the built pages into line with their guides, run the wiki integrity checks over the result, and decide whether findings warrant a re-ingest pass.
variables:
  reads:
    - raw_baseline_commit
    - wiki_path
  writes:
    - name: lint_findings_count
      type: number
      description: Number of lint findings from the lint pass.
      defaultValue: 0
    - name: needs_reingest
      type: boolean
      description: Whether the user opted to fix lint findings by re-ingesting.
      defaultValue: false
required: true
steps:
  - kind: technique
    id: verify-artifact-conformance
    technique:
      name: verify-artifact-conforms
      inputs:
        artifact_dir: wiki_path
        guide_map: codebase-wiki/README#planning-artifact-to-guide-map
  - kind: technique
    id: lint
    technique: lint
  - kind: checkpoint
    id: lint-findings-confirmed
    condition:
      type: simple
      variable: lint_findings_count
      operator: ">"
      value: 0
    message: |-
      Lint surfaced {lint_findings_count} finding(s):

      {lint_findings}
    options:
      - id: reingest
        label: Re-ingest to fix findings
        description: Return to the build pass to address the lint findings before publishing.
        effect:
          setVariable:
            needs_reingest: true
      - id: accept
        label: Accept findings and publish
        description: The findings are acceptable as recorded, and no further build pass is owed.
        effect:
          setVariable:
            needs_reingest: false
exits:
  - id: needs-reingest
    when: needs_reingest == true
  - id: done
    isDefault: true
outcome:
  - Pages conform to the guide their type maps to before the integrity checks measure them, so a finding the user adjudicates describes the page as it now stands
  - The wiki has been checked for citation coverage, confidence presence, contradictions, orphan pages, missing referenced concepts, and stale claims
  - Contradictions and gaps are surfaced explicitly rather than silently reconciled, so the user decides whether to fix or accept them
  - When findings warrant it, the flow returns to the build pass to re-ingest, closing the one rework loop before publish
