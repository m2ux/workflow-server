id: adversarial-pass
version: 2.4.0
name: Adversarial Analysis Pass
description: Run the adversarial lens against each full-prism unit's structural artifact.
variables:
  reads:
    - all_artifact_paths
    - analysis_units
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
    - name: current_unit
      type: object
      description: Current analysis unit during iteration loop
techniques:
  - scatter-gather
steps:
  - kind: loop
    id: adversarial-unit-cycle
    name: Adversarial Unit Cycle
    loopType: forEach
    variable: current_unit
    over: analysis_units
    maxIterations: 100
    steps:
      - kind: technique
        id: run-adversarial
        technique:
          name: full-prism::adversarial
          inputs:
            target_content: "{current_unit.target}"
            prior_artifact_paths: all_artifact_paths
        actions:
          - action: set
            target: all_artifact_paths
            description: Accumulated artifact paths across units.
        when: current_unit.pipeline_mode == 'full-prism'
exits:
  - id: done
    isDefault: true
