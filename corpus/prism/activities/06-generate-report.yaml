id: generate-report
version: 1.3.0
name: Generate Final Report
description: Generate the final REPORT.md from prior-pass analysis artifacts.
variables:
  reads:
    - all_artifact_paths
    - output_path
    - pipeline_mode
    - target_description
  writes:
    - name: definitive_findings_path
      type: string
      description: File path to the generated DEFINITIVE-FINDINGS.md artifact — the detailed findings contract (full per-finding field set + surviving conservation laws) that consumer workflows read instead of the raw pass artifacts
    - name: report_path
      type: string
      description: File path to the generated REPORT.md artifact
steps:
  - kind: technique
    id: generate-report
    technique: generate-report
  - kind: technique
    id: verify-artifact-conformance
    technique:
      name: verify-artifact-conforms
      inputs:
        artifact_dir: output_path
        guide_map: prism/README#planning-artifact-to-guide-map
exits:
  - id: done
    isDefault: true
