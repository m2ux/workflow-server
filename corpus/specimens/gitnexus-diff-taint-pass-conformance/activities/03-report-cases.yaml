id: report-cases
version: 1.0.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - negative_inherited_flows
    - negative_introduced_flows
    - negative_taint_unmeasured
    - positive_inherited_flows
    - positive_introduced_flows
    - positive_taint_unmeasured
    - repo_name
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell a partitioned change from the empty lists an empty change set lands, and both from a layer the graph does not hold
