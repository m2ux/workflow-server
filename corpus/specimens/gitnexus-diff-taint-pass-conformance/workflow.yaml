$schema: ../../../schemas/workflow.schema.json
id: gitnexus-diff-taint-pass-conformance
version: 1.2.0
title: GitNexus Diff Taint Pass Conformance Workflow
description: >-
  Hold the gitnexus diff-taint-pass run to three cases. The positive case takes the changed-symbol
  set from a comparison against a fixed commit, so the run iterates the same symbols on every walk, reads the
  taint findings anchored at each and separates the flows the change opened from the ones it
  inherited. The negative case takes it from the index, where nothing is staged, so the change set
  is empty, the per-symbol pass runs zero times, both lists land empty and the unmeasured flag stays
  false because no layer read was attempted — the fallback the run promises for a diff that moved
  nothing, distinct both from a change the layer partitioned and from a layer the graph does not
  hold. The absent-layer case takes it from a comparison over a graph built without its taint layer,
  so changed symbols land, each read reports the layer missing and the flag lands true.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - cases
techniques:
  activity:
    - variable-binding
variables:
  - name: repo_name
    type: string
    description: Name of the indexed graph every operation in the run addresses, which the absent-layer case rebinds to the graph it reads from.
    defaultValue: workflow-server
  - name: taint_layer_graph
    type: string
    description: Name of the graph carrying its taint layer, which the positive and negative cases address and the report names as the source of their answers.
    defaultValue: workflow-server
  - name: absent_layer_graph
    type: string
    description: Name of the graph built without its taint layer, which the absent-layer case binds `{repo_name}` to before referring to the run, and which the report names as the source of that case's answers.
    defaultValue: midnight-wallet
  - name: positive_diff_scope
    type: string
    description: A comparison against the commit `{base_ref}` names, whose changed symbols the positive case reads findings for.
    defaultValue: compare
  - name: base_ref
    type: string
    description: The commit the positive case measures against, fixed so the changed-symbol set its per-symbol pass iterates holds indexed functions on every walk, and which the absent-layer case rebinds to the base its own graph is compared over.
    defaultValue: 4cac20460c700a384830c7167d8aab346c9918e3
  - name: negative_diff_scope
    type: string
    description: The index, where nothing is staged, so the negative case's change set is empty.
    defaultValue: staged
  - name: absent_layer_diff_scope
    type: string
    description: A comparison against the commit the bag names, so the absent-layer case's change set holds symbols whose taint reads find no layer.
    defaultValue: compare
initialActivity: positive-case
graph:
  positive-case:
    passed: negative-case
  negative-case:
    passed: absent-layer-case
  absent-layer-case:
    passed: report-cases
  report-cases:
    reported: __terminal__
