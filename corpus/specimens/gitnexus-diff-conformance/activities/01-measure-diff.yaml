id: measure-diff
version: 1.0.0
name: Measure Diff
description: Refer to the two runs that read a diff and report what it reached.
variables:
  reads:
    - requirements_scope
  writes:
    - name: coverage_gaps
      type: array
      description: Changed symbols no test file calls.
      defaultValue: []
    - name: update_candidates
      type: array
      description: Changed symbols a test file calls against a signature or behaviour the change moved.
      defaultValue: []
    - name: scope_findings
      type: array
      description: Affected flows falling outside the intended scope, each with the changed symbol that reaches it.
      defaultValue: []
required: true
steps:
  - kind: routine
    id: map-coverage
    routine: gitnexus::diff-coverage-map
    outputs:
      coverage_gaps: coverage_gaps
      update_candidates: update_candidates
  - kind: routine
    id: check-scope
    routine: gitnexus::scope-discipline-check
    outputs:
      scope_findings: scope_findings
exits:
  - id: measured
    isDefault: true
outcome:
  - A run holding a per-symbol iteration materialised into this activity and landed both of its products
  - A run chaining two operations landed the comparison the second one settled
