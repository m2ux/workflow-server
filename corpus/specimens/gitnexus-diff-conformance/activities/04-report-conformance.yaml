id: report-conformance
version: 1.0.0
name: Report Conformance
description: State what each referred run produced.
variables:
  reads:
    - change_risk_verdict
    - coverage_gaps
    - orphan_candidates
    - public_api_symbols
    - scope_findings
    - update_candidates
required: true
steps:
  - kind: technique
    id: report
    technique: report-diff-conformance
exits:
  - id: reported
    isDefault: true
outcome:
  - Every run this walk referred to is named with what it landed, so a reader can tell a run that produced nothing from one that never materialised
