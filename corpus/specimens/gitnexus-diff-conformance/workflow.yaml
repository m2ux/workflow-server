$schema: ../../../schemas/workflow.schema.json
id: gitnexus-diff-conformance
version: 1.0.0
title: GitNexus Diff Conformance Workflow
description: >-
  Refer to every gitnexus run that reads a diff, from a workflow that holds none of the operations
  itself. Each reference materialises a run declared in a library namespace, so what the walk
  evidences is that a library's runs resolve, splice and land their outputs in the referring
  workflow's bag — the chain, the per-symbol iteration and the branch alike.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - library
techniques:
  activity:
    - variable-binding
variables:
  - name: requirements_scope
    type: array
    description: The execution flows and functional areas the change is meant to touch.
    defaultValue: []
  - name: changed_files
    type: array
    description: The files the change under review touches.
    defaultValue: []
  - name: target
    type: string
    description: The symbol a risk assessment centres on.
    defaultValue: ""
initialActivity: measure-diff
graph:
  measure-diff:
    measured: scan-surface
  scan-surface:
    scanned: weigh-risk
  weigh-risk:
    weighed: report-conformance
  report-conformance:
    reported: __terminal__
