$schema: ../../../schemas/workflow.schema.json
id: gitnexus-radius-conformance
version: 1.0.0
title: GitNexus Radius Conformance Workflow
description: >-
  Refer to the run that measures a concern's reach across a repository group, and report what it
  settled for each member — the graph each answer came from, whether the concern reaches it, and
  whether the member's edges or a search of its tree said so. The concern is whatever symbol the
  session names, so what the run evidences is the shape of the answer rather than anything about the
  code it was asked about.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - group
techniques:
  activity:
    - variable-binding
variables:
  - name: planning_folder_path
    type: string
    description: Absolute path to the planning folder this run writes its report into.
  - name: group_name
    type: string
    description: Name of the configured repository group the reach is measured across.
    defaultValue: ""
  - name: concern_symbol
    type: string
    description: The symbol the concern was raised against, in its home graph.
    defaultValue: ""
  - name: home_repo
    type: string
    description: The graph name of the member the concern was raised in.
    defaultValue: ""
initialActivity: measure-reach
graph:
  measure-reach:
    measured: report-conformance
  report-conformance:
    reported: __terminal__
