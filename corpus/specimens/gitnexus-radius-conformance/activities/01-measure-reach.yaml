id: measure-reach
version: 1.0.0
name: Measure Reach
description: Refer to the run that measures a concern's reach across every member of a repository group.
variables:
  reads:
    - concern_symbol
    - concern_uid
    - group_name
    - home_repo
  writes:
    - name: group_reach_report
      type: array
      description: One entry per member, naming the graph it answers for, whether the concern reaches it, and the instruments that answered.
    - name: boundary_symbols
      type: array
      description: The names another member could hold a reference to, each with its kind and its home file.
    - name: boundary_packages
      type: array
      description: The names under which another member consumes the home tree as a library, each with where the name was read.
    - name: group_query_report
      type: object
      description: Execution flows drawn from the group's members for the concern, each carrying the member it came from.
    - name: group_freshness_report
      type: object
      description: The group's name, when its contract registry last synced, and one freshness entry per member.
    - name: home_impact_report
      type: object
      description: What depends on the concern within its home graph, by depth, with a risk level.
    - name: contract_registry_stats
      type: object
      description: What the rebuilt contract registry holds — the contracts extracted per member, and how many cross-link.
required: true
steps:
  - kind: routine
    id: measuring
    routine: gitnexus::group-radius
    outputs:
      group_reach_report: group_reach_report
      boundary_symbols: boundary_symbols
      boundary_packages: boundary_packages
      group_query_report: group_query_report
      group_freshness_report: group_freshness_report
      home_impact_report: home_impact_report
      contract_registry_stats: contract_registry_stats
exits:
  - id: measured
    isDefault: true
outcome:
  - Every member of the group has an entry naming its graph and the instruments that answered for the concern's reach into it, so the report can hold the members side by side
