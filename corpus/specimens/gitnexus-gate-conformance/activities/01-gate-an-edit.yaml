id: gate-an-edit
version: 1.0.0
name: Gate An Edit
description: Refer to the run that measures a symbol's blast radius and stops where the rating is high.
variables:
  reads:
    - target
  writes:
    - name: impact_report
      type: object
      description: What depends on the symbol, at depth 1/2/3, with the execution flows reached and a risk level.
    - name: edit_approved
      type: boolean
      description: Whether the measured blast radius was accepted at the gate.
      defaultValue: true
required: true
steps:
  - kind: routine
    id: guard-the-edit
    routine: gitnexus::pre-edit-impact-gate
    outputs:
      impact_report: impact_report
      edit_approved: edit_approved
exits:
  - id: gated
    isDefault: true
outcome:
  - A checkpoint declared inside a library's run was presented from this activity, so a gate reaches a user through a body no activity file holds
  - The rating decided whether the gate was presented at all, so a low-rated symbol passes without asking
