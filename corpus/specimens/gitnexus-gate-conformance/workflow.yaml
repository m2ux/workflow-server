$schema: ../../../schemas/workflow.schema.json
id: gitnexus-gate-conformance
version: 1.0.0
title: GitNexus Gate Conformance Workflow
description: >-
  Refer to the two gitnexus runs that stop for a decision. A technique is session-blind and may hold
  no checkpoint, so a gated run is the one shape only a routine carries — and the gate arrives here
  inside a body the loader spliced rather than written into this activity. What the walk evidences is
  that a checkpoint materialised from a library's run is presented, answered and recorded like any
  other.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - checkpoint
techniques:
  activity:
    - variable-binding
variables:
  - name: target
    type: string
    description: The symbol an edit is about to change.
    defaultValue: ""
  - name: symbol_name
    type: string
    description: The symbol a rename moves from.
    defaultValue: ""
  - name: new_name
    type: string
    description: The name a rename moves to.
    defaultValue: ""
  - name: file_path
    type: string
    description: The file holding the symbol, which separates one of that name from the others.
    defaultValue: ""
initialActivity: gate-an-edit
graph:
  gate-an-edit:
    gated: gate-a-rename
  gate-a-rename:
    gated: report-conformance
  report-conformance:
    reported: __terminal__
