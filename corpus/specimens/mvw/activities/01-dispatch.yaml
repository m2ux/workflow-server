id: dispatch
version: 1.0.0
name: Dispatch
description: Dispatch once through the record-dispatch run.
required: true
variables:
  writes:
    - name: dispatch_recorded
      type: boolean
      description: True once the dispatch has executed.
steps:
  - kind: routine
    id: recording
    routine: record-dispatch
exits:
  - id: dispatched
    isDefault: true
outcome:
  - The dispatch has executed once and `{dispatch_recorded}` is true
