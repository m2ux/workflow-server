id: take-case
version: 1.0.1
name: Take Case
description: Bind the next fixture case.
variables:
  reads:
    - case_index
  writes:
    - name: case_index
      type: number
      description: How many cases have been taken.
      defaultValue: 0
    - name: contract_complete
      type: boolean
      description: Whether the case under walk writes every Contract field.
      defaultValue: true
required: true
steps:
  - kind: action
    id: take-missing-field-case
    when: case_index == 1
    actions:
      - action: set
        target: contract_complete
        value: false
      - action: set
        target: case_index
        value: 2
  - kind: action
    id: take-complete-case
    when: case_index == 0
    actions:
      - action: set
        target: contract_complete
        value: true
      - action: set
        target: case_index
        value: 1
exits:
  - id: taken
    isDefault: true
outcome:
  - Whether the next case's Contract includes every field
