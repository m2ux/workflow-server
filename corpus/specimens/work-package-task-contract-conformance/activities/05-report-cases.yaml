id: report-cases
version: 1.0.0
name: Report Cases
description: Write the case report for the task-contract walk.
variables:
  reads:
    - case_outcomes
    - planning_folder_path
  writes:
    - name: task_contract_case_report
      type: object
      description: What each case's Contract check landed.
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - The case report states what each Contract check landed
