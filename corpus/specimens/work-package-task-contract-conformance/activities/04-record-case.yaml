id: record-case
version: 1.0.0
name: Record Case
description: Record what the write and Contract check landed for the case just walked.
variables:
  reads:
    - case_index
    - case_outcomes
    - contract_check_held
    - contract_check_missing
    - contract_complete
    - plan_path
  writes:
    - name: case_outcomes
      type: array
      description: What each case's write and check landed.
      defaultValue: []
required: true
steps:
  - kind: technique
    id: record
    technique: record-case
exits:
  - id: more-cases
    when: case_index < 2
  - id: all-cases
    isDefault: true
outcome:
  - One outcome per case walked
