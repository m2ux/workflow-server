id: report-cases
version: 1.2.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - host_repo_path
    - negative_index_stats
    - negative_tree_path
    - positive_index_stats
    - negative_repo_name
    - positive_repo_name
required: true
steps:
  - kind: technique
    id: report
    technique:
      name: report-cases
      inputs:
        positive_tree_path: host_repo_path
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell the graph named at the first resolve from the one the build wrote
