id: report-cases
version: 1.0.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - negative_index_stats
    - negative_tree_path
    - positive_index_stats
    - positive_tree_path
    - repo_name
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell the graph named at the first resolve from the one the build wrote
