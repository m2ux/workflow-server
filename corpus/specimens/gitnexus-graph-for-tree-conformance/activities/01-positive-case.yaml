id: positive-case
version: 1.2.0
name: Positive Case
description: Refer to the graph resolve over a tree a graph covers.
variables:
  reads:
    - host_repo_path
  writes:
    - name: positive_repo_name
      type: string
      description: The graph the resolve named over a tree a graph already covers.
    - name: positive_index_stats
      type: object
      description: The symbol, relationship and process counts a build reports for the graph it wrote.
required: true
steps:
  - kind: routine
    id: name-host-graph
    routine: gitnexus::covering-graph
    with:
      tree_path: "{host_repo_path}"
    outputs:
      repo_name: positive_repo_name
  - kind: routine
    id: name-covered-tree
    routine: gitnexus::graph-for-tree
    with:
      tree_path: "{host_repo_path}"
    outputs:
      repo_name: positive_repo_name
      index_stats: positive_index_stats
exits:
  - id: named
    isDefault: true
outcome:
  - The case named the graph covering the host repository, or said no indexed graph covers it
  - The first resolve named the graph covering the tree, so the build stayed unreached and the run landed the name alone
