id: gate-exit
version: 1.0.0
name: Gate Exit
description: The numeric gates and the checkpoint whose answer can end the activity ahead of its last step.
required: true
variables:
  reads:
    - flag_on
    - unit_count
  writes:
    - name: probe_recorded
      type: boolean
      description: True once the probe has executed.
steps:
  - kind: technique
    id: numeric-flag
    technique: hygiene-probe
    when: flag_on > 0
  - kind: technique
    id: numeric-count
    technique: hygiene-probe
    when: unit_count > 2
  - kind: checkpoint
    id: stop-here
    message: "The activity can end here, ahead of after-gate."
    options:
      - id: halt
        label: "Halt"
        description: End the activity here, ahead of the step after the gate.
        effect:
          exit: halted
      - id: go-on
        label: "Go on"
        description: Continue, so the step after the gate runs.
        effect:
          exit: finished
  - kind: action
    id: after-gate
    actions:
      - action: log
        message: "after-gate ran"
exits:
  - id: halted
    immediate: true
  - id: finished
    isDefault: true
outcome:
  - The gated probes ran as their gates answered, and the checkpoint chose how the activity ended
