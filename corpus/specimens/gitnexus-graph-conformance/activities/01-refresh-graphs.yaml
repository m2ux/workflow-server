id: refresh-graphs
version: 1.0.0
name: Refresh Graphs
description: Refer to the two runs that bring a graph, and a group of them, current.
variables:
  reads:
    - group_name
    - repo_path
  writes:
    - name: stats
      type: object
      description: File, symbol and process counts the graph holds.
    - name: index_stale
      type: boolean
      description: Whether the graph is behind the tree it was built from.
      defaultValue: false
    - name: group_freshness_report
      type: object
      description: Per member, how far its graph is behind its code and whether it has one at all.
    - name: contract_registry_stats
      type: object
      description: What the rebuilt registry holds — the contracts extracted per member, and how many cross-link.
required: true
steps:
  - kind: routine
    id: refresh-index
    routine: gitnexus::index-refresh
    outputs:
      stats: stats
      index_stale: index_stale
  - kind: routine
    id: refresh-group
    routine: gitnexus::group-refresh
    outputs:
      group_freshness_report: group_freshness_report
      contract_registry_stats: contract_registry_stats
exits:
  - id: refreshed
    isDefault: true
outcome:
  - A run gating its middle step on its own first step's answer materialised, so the rebuild happened only where the read reported the graph behind
  - A run iterating the members a report named materialised, so the rebuild reached each one the report held
