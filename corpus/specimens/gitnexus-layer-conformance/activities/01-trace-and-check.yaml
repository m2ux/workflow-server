id: trace-and-check
version: 1.0.0
name: Trace and Check
description: Bind the two operations that answer from the call graph alone — a path between two symbols, and the import cycles the graph holds.
variables:
  reads:
    - from_symbol
    - to_symbol
  writes:
    - name: trace_report
      type: object
      description: The shortest path from one symbol to the other, or where the search stopped short of one.
    - name: cycle_report
      type: object
      description: The import cycles the graph holds, counted at the grain a fix acts on.
required: true
steps:
  - kind: technique
    id: trace-path
    technique:
      name: gitnexus::trace
      inputs:
        from_symbol: from_symbol
        to_symbol: to_symbol
      outputs:
        trace_report: trace_report
  - kind: technique
    id: check-cycles
    technique:
      name: gitnexus::check
      outputs:
        cycle_report: cycle_report
exits:
  - id: traced
    isDefault: true
outcome:
  - A library operation bound as this activity's own step landed its declared answer under the name the step binds
  - The path answer carries a status naming which of found, broken, ambiguous and unresolved it is, so a missing path is a located break rather than a blank
