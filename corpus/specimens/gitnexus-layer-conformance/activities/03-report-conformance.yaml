id: report-conformance
version: 1.0.0
name: Report Conformance
description: State what each bound operation landed, and which answers came from a layer the graph held.
variables:
  reads:
    - cycle_report
    - dependence_report
    - taint_report
    - trace_report
required: true
steps:
  - kind: technique
    id: report
    technique: report-layer-conformance
exits:
  - id: reported
    isDefault: true
outcome:
  - Every operation this walk bound is named with what it landed, and each layer-reading answer is marked as a measurement or as the note an absent layer leaves
