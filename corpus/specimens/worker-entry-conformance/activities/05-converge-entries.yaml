id: converge-entries
version: 1.0.0
name: Converge Entries
description: Read every recorded entry whole and write the one report the run leaves behind.
required: true
variables:
  reads:
    - cold_entry
    - batch_entry
    - left_entry
    - right_entry
    - planning_folder_path
  writes:
    - name: report_path
      type: string
      description: Absolute path of the report this run wrote, as the guide shapes it.
steps:
  - kind: technique
    id: write-the-report
    technique: report-entries
exits:
  - id: converged
    isDefault: true
outcome:
  - Every entry the run took is accounted for in one document ({report_path})
  - Whether the two branches held distinct identities is readable from the report rather than inferred
