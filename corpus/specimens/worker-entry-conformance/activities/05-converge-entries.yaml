id: converge-entries
version: 1.3.0
name: Converge Entries
description: Read every recorded entry whole and write the one report the run leaves behind.
required: true
variables:
  reads:
    - batch_entry
    - cold_entry
    - note_left_outputs
    - note_right_outputs
    - planning_folder_path
    - session_index
  writes:
    - name: report_path
      type: string
      description: Absolute path of the report this run wrote, as the guide shapes it.
steps:
  - kind: technique
    id: write-the-report
    technique: report-entries
exits:
  - id: converged
    isDefault: true
outcome:
  - Every entry the run took is accounted for in one document ({report_path})
  - Whether the two branches held distinct identities is readable from the report rather than inferred
  - An activity completed twice or never, a trace short of its advances, and a technique applied without being served are each counted rather than inferred from the walk succeeding
