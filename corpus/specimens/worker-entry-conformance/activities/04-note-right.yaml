id: note-right
version: 1.0.0
name: Note Right
description: Record the entry the other branch of the fan arrived on.
required: true
variables:
  writes:
    - name: right_entry
      type: object
      description: The entry this branch arrived on, the identity it was minted, and the instant it was recorded.
steps:
  - kind: routine
    id: recording
    routine: record-one-entry
    with:
      entry_kind: fan-branch
    outputs:
      entry_record: right_entry
exits:
  - id: noted
    isDefault: true
outcome:
  - This branch's own entry and identity are recorded ({right_entry})
