id: positive-case
version: 1.1.0
name: Positive Case
description: Refer to the scope discipline check over a comparison against a fixed commit, held against an empty intended scope.
variables:
  reads:
    - base_ref
    - positive_diff_scope
    - positive_requirements_scope
  writes:
    - name: positive_scope_findings
      type: array
      description: Affected flows falling outside the intended scope, each with the changed symbol that reaches it.
required: true
steps:
  - kind: routine
    id: check-fixed-comparison
    routine: gitnexus::scope-discipline-check
    with:
      diff_scope: "{positive_diff_scope}"
      requirements_scope: "{positive_requirements_scope}"
    outputs:
      scope_findings: positive_scope_findings
exits:
  - id: checked
    isDefault: true
outcome:
  - The run took the flows the comparison against `{base_ref}` reaches, held each against an empty intended scope and landed every one as a finding with the changed symbol that reaches it
