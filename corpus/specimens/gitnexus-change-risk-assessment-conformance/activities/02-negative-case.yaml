id: negative-case
version: 1.1.0
name: Negative Case
description: Refer to the change risk assessment over a symbol no graph holds, with the diff taken from the same comparison the positive case takes.
variables:
  reads:
    - base_ref
    - negative_diff_scope
    - negative_target
  writes:
    - name: negative_change_risk_verdict
      type: object
      description: One rating for the change, the counts it rests on, and the flows a reviewer exercises to cover it.
required: true
steps:
  - kind: routine
    id: assess-absent-symbol
    routine: gitnexus::change-risk-assessment
    with:
      target: "{negative_target}"
      diff_scope: "{negative_diff_scope}"
    outputs:
      change_risk_verdict: negative_change_risk_verdict
exits:
  - id: assessed
    isDefault: true
outcome:
  - The same run under a symbol the graph does not hold resolved nothing in its impact half, so the verdict rests on the rating of the comparison against `{base_ref}` alone and says its caller set is hand-derived — the fallback the run promises rather than a failure
