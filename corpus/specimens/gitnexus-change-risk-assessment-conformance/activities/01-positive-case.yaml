id: positive-case
version: 1.0.0
name: Positive Case
description: Refer to the change risk assessment over a symbol the graph holds.
variables:
  reads:
    - positive_diff_scope
    - positive_target
  writes:
    - name: positive_change_risk_verdict
      type: object
      description: One rating for the change, the counts it rests on, and the flows a reviewer exercises to cover it.
required: true
steps:
  - kind: routine
    id: assess-held-symbol
    routine: gitnexus::change-risk-assessment
    with:
      target: "{positive_target}"
      diff_scope: "{positive_diff_scope}"
    outputs:
      change_risk_verdict: positive_change_risk_verdict
exits:
  - id: assessed
    isDefault: true
outcome:
  - The run measured what reaches a held symbol, read the flow inventory, measured what the diff moved, and settled the one rating the three measurements weigh to
