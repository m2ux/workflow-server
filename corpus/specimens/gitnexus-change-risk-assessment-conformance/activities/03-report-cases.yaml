id: report-cases
version: 1.0.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - negative_change_risk_verdict
    - positive_change_risk_verdict
    - repo_name
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell a verdict weighed from three measurements from one resting on the diff alone
