id: take-case
version: 1.0.1
name: Take Case
description: Bind the next fixture case.
variables:
  reads:
    - case_index
  writes:
    - name: case_index
      type: number
      description: How many cases have been taken.
      defaultValue: 0
    - name: pipeline_mode
      type: string
      description: The prism mode the structural branch takes.
      values:
        - single
        - full-prism
required: true
steps:
  - kind: action
    id: take-full-prism-case
    when: case_index == 1
    actions:
      - action: set
        target: pipeline_mode
        value: full-prism
      - action: set
        target: case_index
        value: 2
  - kind: action
    id: take-inline-case
    when: case_index == 0
    actions:
      - action: set
        target: pipeline_mode
        value: single
      - action: set
        target: case_index
        value: 1
exits:
  - id: taken
    isDefault: true
outcome:
  - Whether the next case takes the inline structural pass or full prism
