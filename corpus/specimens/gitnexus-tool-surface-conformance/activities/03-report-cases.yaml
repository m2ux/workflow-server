id: report-cases
version: 1.2.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - host_repo_path
    - negative_tree_path
    - negative_tool_inventory
    - positive_tool_inventory
    - repo_name
required: true
steps:
  - kind: technique
    id: report
    technique:
      name: report-cases
      inputs:
        positive_tree_path: host_repo_path
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with the tree each bound and the empty inventory both landed, so a reader can tell a shape the walk does not record from a tree that declares no tool
