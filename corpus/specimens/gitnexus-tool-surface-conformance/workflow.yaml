$schema: ../../../schemas/workflow.schema.json
id: gitnexus-tool-surface-conformance
version: 1.2.0
title: GitNexus Tool Surface Conformance Workflow
description: >-
  Hold the gitnexus tool-surface run to two cases. The positive case names the host repository,
  a tree registering MCP tools by calling a method, a shape outside the two the walk records as a
  tool node, so the run names the graph covering it and lands an empty inventory. The negative case
  names the markdown tree the index holds under the docs graph, which carries no tool declarations,
  so the run names that graph and lands an empty
  inventory too — the fallback it promises for a tree whose registrations the walk did not
  recognise, which the run's own note reads as such rather than as a tree defining none.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - cases
techniques:
  activity:
    - variable-binding
variables:
  - name: host_repo_path
    type: string
    description: Absolute path to the host repository the session belongs to.
  - name: docs_graph_name
    type: string
    description: Registry name of the indexed graph built from a markdown tree with no tool declarations.
    defaultValue: midnight-docs
initialActivity: positive-case
graph:
  positive-case:
    mapped: negative-case
  negative-case:
    mapped: report-cases
  report-cases:
    reported: __terminal__
