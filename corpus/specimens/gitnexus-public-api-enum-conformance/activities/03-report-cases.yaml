id: report-cases
version: 1.0.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - repo_name
    - positive_diff_scope
    - positive_public_api_symbols
    - negative_diff_scope
    - negative_public_api_symbols
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell the enumerated surface from the empty fallback
