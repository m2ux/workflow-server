id: positive-case
version: 1.0.0
name: Positive Case
description: Refer to the public API enumeration over the whole diff.
variables:
  reads:
    - positive_diff_scope
  writes:
    - name: positive_public_api_symbols
      type: array
      description: The exported symbols present in the diff, each with the file and kind the graph records.
required: true
steps:
  - kind: routine
    id: enumerate-whole-diff
    routine: gitnexus::public-api-enum
    with:
      diff_scope: "{positive_diff_scope}"
    outputs:
      public_api_symbols: positive_public_api_symbols
exits:
  - id: enumerated
    isDefault: true
outcome:
  - The run's visibility filter was composed over the symbols the whole diff changed and landed the exported ones among them
