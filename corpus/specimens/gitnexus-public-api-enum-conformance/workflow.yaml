$schema: ../../../schemas/workflow.schema.json
id: gitnexus-public-api-enum-conformance
version: 1.0.0
title: GitNexus Public API Enumeration Conformance Workflow
description: >-
  Hold the gitnexus public-api-enum run to two cases. The positive case takes the changed symbols
  from the whole diff, so the visibility filter is composed over a populated set and the run lands
  the exported symbols among them. The negative case takes them from the index, where nothing is
  staged, so the change set is empty, the filter names no symbol, and the run lands an empty set —
  the fallback it promises for a change with no symbols, distinct from changed symbols none of which
  is exported.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - cases
techniques:
  activity:
    - variable-binding
variables:
  - name: repo_name
    type: string
    description: Name of the indexed graph every operation in the run addresses.
    defaultValue: workflow-server
  - name: positive_diff_scope
    type: string
    description: The whole diff, so the positive case's filter is composed over a populated changed-symbol set.
    defaultValue: all
  - name: negative_diff_scope
    type: string
    description: The index alone, where nothing is staged, so the negative case's changed-symbol set is empty.
    defaultValue: staged
initialActivity: positive-case
graph:
  positive-case:
    enumerated: negative-case
  negative-case:
    enumerated: report-cases
  report-cases:
    reported: __terminal__
