id: report-cases
version: 1.0.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - negative_referencing_files
    - negative_target_files
    - negative_tree_path
    - positive_referencing_files
    - positive_target_files
    - positive_tree_path
    - repo_name
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell the enumerated referencers from the empty fallback
