id: positive-case
version: 1.1.0
name: Positive Case
description: Refer to the reference surface over a file the index records.
variables:
  reads:
    - docs_graph_name
    - positive_target_files
  writes:
    - name: docs_tree_path
      type: string
      description: Filesystem path of the documentation tree whose links both cases read, as the index records it for the docs graph.
    - name: positive_referencing_files
      type: array
      description: Per target file, the paths of the files holding a link that resolves to it.
    - name: repo_name
      type: string
      description: The graph each read addressed, which a report naming these referencers names too.
required: true
steps:
  - kind: routine
    id: locate-docs-tree
    routine: gitnexus::tree-for-graph
    with:
      graph_name: "{docs_graph_name}"
    outputs:
      tree_path: docs_tree_path
  - kind: routine
    id: surface-held-file
    routine: gitnexus::doc-reference-surface
    with:
      tree_path: "{docs_tree_path}"
      target_files: "{positive_target_files}"
    outputs:
      referencing_files: positive_referencing_files
      repo_name: repo_name
exits:
  - id: surfaced
    isDefault: true
outcome:
  - The case named the documentation tree from the index by its graph's registry name, or said the index holds no graph by that name
  - The run named the graph covering the tree and landed, for a file the index records, the files whose links resolve to it
