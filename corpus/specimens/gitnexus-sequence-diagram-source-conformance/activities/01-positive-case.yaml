id: positive-case
version: 1.0.0
name: Positive Case
description: Refer to the sequence diagram source over the whole diff.
variables:
  reads:
    - positive_diff_scope
  writes:
    - name: positive_diagram_source
      type: array
      description: The ordered step trace of each execution flow the change runs through, which the sequence diagram is drawn from.
required: true
steps:
  - kind: routine
    id: trace-whole-diff
    routine: gitnexus::sequence-diagram-source
    with:
      diff_scope: "{positive_diff_scope}"
    outputs:
      diagram_source: positive_diagram_source
exits:
  - id: traced
    isDefault: true
outcome:
  - The run reached the flows the whole diff runs through and read the ordered step trace of each, landing the structure a sequence diagram is drawn from
