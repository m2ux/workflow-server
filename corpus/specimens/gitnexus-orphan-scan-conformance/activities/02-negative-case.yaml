id: negative-case
version: 1.0.0
name: Negative Case
description: Refer to the orphan scan over a file no graph holds.
variables:
  reads:
    - negative_changed_files
  writes:
    - name: negative_orphan_candidates
      type: array
      description: The rows the narrowing kept for a file no graph holds — empty by construction.
required: true
steps:
  - kind: routine
    id: scan-absent-file
    routine: gitnexus::orphan-scan
    with:
      changed_files: "{negative_changed_files}"
    outputs:
      orphan_candidates: negative_orphan_candidates
exits:
  - id: scanned
    isDefault: true
outcome:
  - The same run under a file the graph does not hold landed an empty set, the fallback the narrowing promises rather than a failure
