id: reach-by-name
version: 1.0.0
name: Reach By Name
description: Bind an operation of the shared library by the library's directory name.
variables:
  reads:
    - component_path
  writes:
    - name: name_form_home
      type: string
      description: The library the bare-name reference was delivered from, as the delivery reported it.
    - name: name_form_count
      type: number
      description: What the operation counted under the bare-name spelling.
required: true
steps:
  - kind: technique
    id: measure-under-the-bare-name
    technique:
      name: shared-probe::measure-entries
      inputs:
        probe_target: "."
      outputs:
        probe_home: name_form_home
        entry_count: name_form_count
exits:
  - id: reached
    isDefault: true
outcome:
  - The directory name of a library holding no definition delivered its operation, so a shared library is addressable without being a product
