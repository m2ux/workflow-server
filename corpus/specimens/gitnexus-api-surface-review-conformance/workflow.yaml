$schema: ../../../schemas/workflow.schema.json
id: gitnexus-api-surface-review-conformance
version: 1.0.0
title: GitNexus API Surface Review Conformance Workflow
description: >-
  Hold the gitnexus api-surface-review run to two cases. The positive case names a tree whose graph
  serves API routes, so the run names that graph, maps the routes it serves and holds each route's
  response shape against the keys its consumers read. The negative case names a markdown tree whose
  graph holds no route, so the graph resolves and both reads land empty — the fallback the run
  promises for a tree that serves no API, distinct from a tree whose routes were mapped and found
  consistent.
author: m2ux
tags:
  - gitnexus
  - conformance
  - routine
  - cases
techniques:
  activity:
    - variable-binding
variables:
  - name: repo_name
    type: string
    description: Name of the indexed graph every operation in the run addresses.
    defaultValue: workflow-server
  - name: positive_tree_path
    type: string
    description: A tree whose graph serves API routes, whose surface the positive case maps.
    defaultValue: /home/mike1/projects/dev/workflow-server
  - name: negative_tree_path
    type: string
    description: A markdown tree whose graph holds no route, so the negative case's reads land empty.
    defaultValue: /home/mike1/projects/dev/midnight-agent-eng/midnight-docs
initialActivity: positive-case
graph:
  positive-case:
    reviewed: negative-case
  negative-case:
    reviewed: report-cases
  report-cases:
    reported: __terminal__
