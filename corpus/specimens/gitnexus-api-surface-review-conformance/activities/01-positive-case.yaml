id: positive-case
version: 1.1.0
name: Positive Case
description: Refer to the API surface review over a tree whose graph serves routes nothing fetches.
variables:
  reads:
    - positive_tree_path
  writes:
    - name: positive_route_inventory
      type: object
      description: Each route with the file handling it, the middleware chain wrapping that handler, and the components and hooks that fetch it.
    - name: positive_shape_report
      type: object
      description: Per route, the top-level keys its response carries, the keys each consumer reads, and whether the two agree — empty, the check covering only routes with a consumer and no route in this tree having one.
    - name: repo_name
      type: string
      description: The graph both reads addressed, which a report naming either of them names too.
required: true
steps:
  - kind: routine
    id: review-served-tree
    routine: gitnexus::api-surface-review
    with:
      tree_path: "{positive_tree_path}"
    outputs:
      route_inventory: positive_route_inventory
      shape_report: positive_shape_report
      repo_name: repo_name
exits:
  - id: reviewed
    isDefault: true
outcome:
  - The run named the graph covering a tree that serves routes, mapped those routes, and landed an empty shape report, the check covering only routes with a consumer and no route in this tree having one
