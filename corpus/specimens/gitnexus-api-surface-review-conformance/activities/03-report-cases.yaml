id: report-cases
version: 1.0.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - negative_route_inventory
    - negative_shape_report
    - positive_route_inventory
    - positive_shape_report
    - repo_name
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell a mapped surface from the empty inventory a routeless tree lands
