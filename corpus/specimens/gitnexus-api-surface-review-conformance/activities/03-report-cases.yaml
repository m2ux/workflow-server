id: report-cases
version: 1.3.0
name: Report Cases
description: State what the run landed under each binding.
variables:
  reads:
    - host_repo_path
    - negative_tree_path
    - negative_route_inventory
    - negative_shape_report
    - positive_route_inventory
    - positive_shape_report
    - negative_repo_name
    - positive_repo_name
required: true
steps:
  - kind: technique
    id: report
    technique:
      name: report-cases
      inputs:
        positive_tree_path: host_repo_path
exits:
  - id: reported
    isDefault: true
outcome:
  - Both bindings of the run are named with what each landed, so a reader can tell a mapped route inventory from the empty one a routeless tree lands, with the shape report empty under both
