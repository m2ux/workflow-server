id: report-cases
version: 1.0.0
name: Report Cases
description: Write the case report for the contract-join walk.
variables:
  reads:
    - case_outcomes
    - planning_folder_path
  writes:
    - name: contract_join_case_report
      type: object
      description: What each join case landed.
required: true
steps:
  - kind: technique
    id: report
    technique: report-cases
exits:
  - id: reported
    isDefault: true
outcome:
  - The case report is written
