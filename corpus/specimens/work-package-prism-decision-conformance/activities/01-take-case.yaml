id: take-case
version: 1.0.0
name: Take Case
description: Bind the next fixture case — an implementation run, then a review run, over one complex change.
variables:
  reads:
    - case_index
  writes:
    - name: case_index
      type: number
      description: How many cases have been taken.
      defaultValue: 0
    - name: problem_complexity
      type: string
      description: The complexity every case carries.
      values:
        - simple
        - moderate
        - complex
    - name: is_review_mode
      type: boolean
      description: Whether the case under walk is a review run.
      defaultValue: false
required: true
steps:
  - kind: action
    id: take-review-case
    when: case_index == 1
    actions:
      - action: set
        target: problem_complexity
        value: complex
      - action: set
        target: is_review_mode
        value: true
      - action: set
        target: case_index
        value: 2
  - kind: action
    id: take-implementation-case
    when: case_index == 0
    actions:
      - action: set
        target: problem_complexity
        value: complex
      - action: set
        target: is_review_mode
        value: false
      - action: set
        target: case_index
        value: 1
exits:
  - id: taken
    isDefault: true
outcome:
  - The next case's complexity and review flag
