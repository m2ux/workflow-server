id: positive-case
version: 1.1.0
name: Positive Case
description: Refer to the heading lookup under a pattern whole headings in the tree match.
variables:
  reads:
    - docs_graph_name
    - positive_heading_pattern
  writes:
    - name: docs_tree_path
      type: string
      description: Filesystem path of the documentation tree whose headings both cases read, as the index records it for the docs graph.
    - name: positive_heading_matches
      type: array
      description: Each matching heading with the file it sits in.
    - name: repo_name
      type: string
      description: The graph the search addressed, which a report naming these matches names too.
required: true
steps:
  - kind: routine
    id: locate-docs-tree
    routine: gitnexus::tree-for-graph
    with:
      graph_name: "{docs_graph_name}"
    outputs:
      tree_path: docs_tree_path
  - kind: routine
    id: find-matching-headings
    routine: gitnexus::doc-heading-lookup
    with:
      tree_path: "{docs_tree_path}"
      heading_pattern: "{positive_heading_pattern}"
    outputs:
      heading_matches: positive_heading_matches
      repo_name: repo_name
exits:
  - id: matched
    isDefault: true
outcome:
  - The case named the documentation tree from the index by its graph's registry name, or said the index holds no graph by that name
  - The run named the graph covering the tree and landed the headings the pattern matches, each with the file it sits in
