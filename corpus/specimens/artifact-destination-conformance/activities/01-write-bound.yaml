id: write-bound
version: 1.0.0
name: Write Bound
description: Write an artifact to an explicitly bound destination directory.
variables:
  reads:
    - artifact_destination
required: true
steps:
  - kind: technique
    id: write-bound-artifact
    technique:
      name: record-bound-artifact
      inputs:
        artifact_destination: "{artifact_destination}"
exits:
  - id: bound_written
    isDefault: true
outcome:
  - The product deliverable is written to the bound destination directory
