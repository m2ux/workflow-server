id: deliver-audit
version: 2.1.0
name: Deliver Audit Results
description: Present the final audit deliverables to the user.
variables:
  reads:
    - all_analysis_artifact_paths
    - audit_description
    - audit_output_path
    - audit_report_path
    - completed_analyses
    - target_path
steps:
  - kind: technique
    id: present-results
    technique: deliver-audit
    actions:
      - action: message
        message: |-
          {audit_metrics}

          {deliverable_index}
outcome:
  - The user can gauge the audit's outcome at a glance from severity metrics and go straight to any deliverable they want to act on
