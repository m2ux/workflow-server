id: report-failure
version: 1.5.1
name: Report Failure
description: Compile a failure report of the unresolved critical issues, the correction history, and the manual resolution each issue needs.
variables:
  reads:
    - source_paths
    - target_doc_path
    - validation_report_path
  writes:
    - name: failure_report_path
      type: string
      description: Absolute path to the written failure report
      defaultValue: ""
required: true
steps:
  - kind: technique
    id: report-failure
    technique: report-failure
    actions:
      - action: message
        message: "Refinement stops with unresolved critical issues. The issues, the correction history, and the manual resolution each one needs are on record ([failure report]({failure_report_path}))."
outcome:
  - The critical issues that blocked refinement and the manual resolution each one needs are on record
