id: report-failure
version: 1.6.0
name: Report Failure
description: Compile a failure report of the issues refinement leaves unresolved, the correction history, and the manual resolution each issue needs.
variables:
  reads:
    - planning_folder_path
    - source_paths
    - spec_basename
    - target_doc_path
    - validation_report_path
  writes:
    - name: failure_report_path
      type: string
      description: Absolute path to the written failure report
      defaultValue: ""
required: true
steps:
  - kind: technique
    id: report-failure
    technique: report-failure
    actions:
      - action: message
        message: "Refinement stops with unresolved issues. The issues, the correction history, and the manual resolution each one needs are on record ([failure report]({failure_report_path}))."
outcome:
  - The issues that blocked refinement and the manual resolution each one needs are on record
