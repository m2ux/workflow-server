id: intake-and-analyze
version: 1.6.0
name: Intake and Analyze
description: Produce a confirmed requirements analysis from classified, readable source documents against the target specification.
variables:
  reads:
    - planning_folder_path
    - user_request
  writes:
    - name: source_paths
      type: array
      description: Filesystem paths of the local source documents being processed, each a meeting transcript or an unstructured document
    - name: target_doc_path
      type: string
      description: Filesystem path to the canonical requirements specification being augmented or created
    - name: analysis_confirmed
      type: boolean
      description: True when the requirements analysis is approved
      defaultValue: false
    - name: source_readable
      type: boolean
      description: True when every source document exists and carries content
      defaultValue: false
    - name: intake_record_path
      type: string
      description: Absolute path to the written intake record
      defaultValue: ""
    - name: requirements_analysis_path
      type: string
      description: Absolute path to the written requirements analysis report
      defaultValue: ""
    - name: classified_sources
      type: array
      description: Source documents paired with their classifications, each { path, type } where type is meeting or document
      defaultValue: []
    - name: spec_basename
      type: string
      description: Basename of the target specification
      defaultValue: ""
    - name: target_doc_exists
      type: boolean
      description: True when the target specification already exists and is being augmented; false when it is created from scratch
      defaultValue: false
    - name: intake_correction
      type: string
      description: Text the user typed to correct the sources, a source's classification, or the target specification
    - name: analysis_feedback
      type: string
      description: Text the user typed naming what a requirements analysis misread or missed
    - name: update_pass_kind
      type: string
      description: Which apply this pass performs
      values:
        - initial
        - correction
        - revision
      defaultValue: initial
required: true
steps:
  - kind: technique
    id: resolve-inputs
    technique: resolve-inputs
  - kind: checkpoint
    id: target-doc-named
    condition:
      type: simple
      variable: target_doc_path
      operator: notExists
    message: "The request names no target specification."
    options:
      - id: named
        label: Name the specification
        description: The reply is the specification's path. An existing file is augmented; a new path is created.
        effect:
          recordReply: target_doc_path
  - kind: technique
    id: intake-sources
    technique: intake-sources
    actions:
      - action: message
        message: "The source set and the target specification are captured, each source with its own classification ([intake record]({intake_record_path}))."
        condition:
          type: simple
          variable: source_readable
          operator: ==
          value: true
  - kind: action
    id: source-unreadable-diagnostic
    when: source_readable == false
    actions:
      - action: message
        message: "A source document named for this run is missing or empty, or the request names none; the intake record names which ([intake record]({intake_record_path}))."
  - kind: checkpoint
    id: sources-confirmed
    when: source_readable == true
    message: "The source set and the target specification {target_doc_path} (target exists: {target_doc_exists}) are captured, each source with its own classification ([intake record]({intake_record_path}))."
    options:
      - id: confirmed
        label: Yes, proceed
        description: The source set, the classification each source carries, and the mode are correct.
      - id: revise
        label: Correct the sources
        description: The reply names what to change — a source path, a source's classification, the target specification, or a document the set omits.
        effect:
          recordReply: intake_correction
          exit: revise
  - kind: technique
    id: analyze-source
    technique: analyze-source
    when: source_readable == true
    actions:
      - action: message
        message: "The source documents are parsed into new, updated, and deprecated requirements with a source-coverage matrix ([analysis report]({requirements_analysis_path}))."
  - kind: checkpoint
    id: analysis-confirmed
    when: source_readable == true
    message: "The requirements analysis derived from the source set is on record ([analysis report]({requirements_analysis_path}))."
    options:
      - id: confirmed
        label: Yes, apply this analysis
        description: Analysis is accurate and reflects every source faithfully.
        effect:
          setVariable:
            analysis_confirmed: true
            update_pass_kind: initial
      - id: revise
        label: Revise the analysis
        description: The reply names what the analysis misreads, misses, or leaves unread.
        effect:
          recordReply: analysis_feedback
          exit: revise
exits:
  - id: source-unreadable
    when: source_readable == false
  - id: analysis-confirmed
    when: analysis_confirmed == true
    isDefault: true
  - id: revise
    immediate: true
outcome:
  - The run names its source documents and a target specification, taken from the request or supplied by the user
  - Each source carries its classification, and whether the specification is being augmented or created is recorded
  - A source with nothing to read is settled at the boundary
  - A correction or a revision request the user gives reaches the next pass as recorded text
  - Every requirement change the sources imply is pinned to a stable identifier the specification can be updated against
  - The analysis faithfully reflects every source
