$schema: ../../schemas/workflow.schema.json
id: requirements-refinement
version: 2.0.0
title: Requirements Refinement Workflow
description: Refine a canonical requirements specification from a set of source documents — meeting transcripts and unstructured documents — preserving the specification protocol verbatim and staging the finalized specification and a change summary in the planning folder.
author: m2ux
tags:
  - requirements
  - specification
  - source-document
  - document-automation
  - validation
  - iterative-refinement
techniques:
  activity:
    - variable-binding
variables:
  - name: host_repo_path
    type: string
    description: Absolute path of the checkout the run was opened from, seeded when the session opens.
  - name: planning_folder_path
    type: string
    description: Absolute path to this run's planning folder, seeded when the session opens.
  - name: user_request
    type: string
    description: The user's free-form request that opened this run.
  - name: source_paths
    type: array
    description: Filesystem paths of the local source documents being processed, each a meeting transcript or an unstructured document. A single-document run carries one entry.
    required: true
  - name: target_doc_path
    type: string
    description: Filesystem path to the canonical requirements specification being augmented or created
    required: true
initialActivity: intake
graph:
  intake:
    sources-confirmed: analyze-sources
    revise: intake
    source-unreadable: __terminal__
  analyze-sources:
    analysis-confirmed: update-specification
    revise: analyze-sources
  update-specification:
    done: validate-specification
  validate-specification:
    validation-passed: finalize-specification
    correctable: update-specification
    uncorrectable: report-failure
  finalize-specification:
    accepted: __terminal__
    revision-requested: update-specification
