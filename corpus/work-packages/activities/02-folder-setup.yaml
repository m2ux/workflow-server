id: folder-setup
version: 1.7.0
name: Planning Folder Setup
description: Fill the session's planning folder with initial documentation skeletons, and settle which analysis the next activity performs
variables:
  reads:
    - initiative_name
    - planning_folder_path
  writes:
    - name: analysis_type
      type: string
      description: Whether this roadmap continues previous work or opens a new initiative.
      values:
        - completion
        - context
steps:
  - kind: technique
    id: setup-planning-folder
    technique: setup-planning-folder
  - kind: checkpoint
    id: analysis-type-selection
    message: The analysis {initiative_name} receives depends on whether it continues previous work or opens a new initiative.
    options:
      - id: continuing
        label: Continuing previous work
        description: Perform completion analysis of existing progress
        effect:
          setVariable:
            analysis_type: completion
      - id: new-initiative
        label: New initiative
        description: Perform context analysis for a fresh start
        effect:
          setVariable:
            analysis_type: context
  - kind: checkpoint
    id: folder-created
    message: The planning folder and its entry-point scaffolds stand at [planning folder]({planning_folder_path}).
    options:
      - id: proceed
        label: Proceed with analysis
        description: The planning folder stands, and analysis starts.
        effect:
          exit: done
      - id: adjust
        label: Adjust structure
        description: The folder structure is wrong and is adjusted.
        effect:
          exit: adjust
exits:
  - id: done
    isDefault: true
  - id: adjust
outcome:
  - There is a single known home for all planning artifacts, with entry-point and overview scaffolds ready for later activities to fill in
  - The analysis activity holds the {analysis_type} it branches on before it is dispatched
