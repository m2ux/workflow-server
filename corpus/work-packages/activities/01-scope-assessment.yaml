id: scope-assessment
version: 1.3.0
name: Scope Assessment
description: Confirm multi-work-package initiative and identify work packages to be planned
variables:
  reads:
    - planning_folder_path
    - user_request
  writes:
    - name: initiative_name
      type: string
      description: Name of the overall multi-package initiative
    - name: work_packages
      type: array
      description: List of identified work packages with names and brief descriptions
steps:
  - kind: technique
    id: assess-scope
    technique: assess-initiative-scope
  - kind: checkpoint
    id: scope-confirmed
    message: |-
      The initiative decomposes into {package_count} independently deliverable work packages:

      {work_packages}
    options:
      - id: proceed
        label: Proceed with planning
        effect:
          exit: done
      - id: refine
        label: Refine scope
        effect:
          exit: refine
exits:
  - id: done
    isDefault: true
  - id: refine
outcome:
  - The workflow has an agreed inventory of distinct work packages to plan, so planning can proceed package-by-package
  - User and workflow share the same boundary for what this initiative covers, preventing scope drift downstream
