id: prioritization
version: 1.3.0
name: Prioritization
description: Prioritize work packages based on dependencies, value, risk, and effort
variables:
  reads:
    - dependency_map
    - package_plans
    - planning_folder_path
  writes:
    - name: priority_order
      type: array
      description: Ordered list of work packages by execution priority
steps:
  - kind: technique
    id: prioritize
    technique: prioritize-packages
  - kind: checkpoint
    id: priority-confirmed
    message: |-
      The proposed execution order, with the dependency graph and per-package rationale behind it:

      {priority_order}
    options:
      - id: accept
        label: Accept priority order
        effect:
          exit: done
      - id: adjust
        label: Adjust priorities
        effect:
          exit: adjust
      - id: revisit
        label: Revisit package plans
        effect:
          exit: revisit
exits:
  - id: done
    isDefault: true
  - id: adjust
  - id: revisit
outcome:
  - There is a user-approved execution order that respects dependencies, value, and risk, so implementation knows which package to start next
