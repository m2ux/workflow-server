id: package-planning
version: 1.3.0
name: Work Package Planning
description: Define scope, dependencies, effort, and success criteria for each work package
variables:
  reads:
    - planning_folder_path
    - work_packages
  writes:
    - name: current_package
      type: object
      description: Currently active work package being planned or implemented
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: present-planning-overview
    technique: plan-work-package-scope::present-overview
  - kind: loop
    id: package-loop
    name: Package Planning Loop
    loopType: forEach
    variable: current_package
    over: work_packages
    steps:
      - kind: technique
        id: plan-package
        technique: plan-work-package-scope::plan-package
  - kind: checkpoint
    id: plans-created
    message: Every work package now carries scope, dependencies, effort, and success criteria.
    options:
      - id: proceed
        label: Proceed to prioritization
        effect:
          exit: done
      - id: revise
        label: Revise plans
        effect:
          exit: revise
exits:
  - id: done
    isDefault: true
  - id: revise
outcome:
  - Every work package now has enough scope, effort, and success-criteria detail to be prioritized and executed independently
  - Inter-package dependencies are known, so prioritization can order packages without creating blocked work
