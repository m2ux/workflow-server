id: report-conformance
version: 1.1.0
name: Report Conformance
description: Where the probes converge — read every container whole and report what the run did.
variables:
  reads:
    - component_path
    - merge_report
    - note_targets
    - planning_folder_path
    - probe_directory_outputs
    - probe_targets
    - run_started_at
    - survey_files_outputs
    - survey_history_outputs
    - survey_plan
    - survey_tree_outputs
required: true
steps:
  - kind: technique
    id: gather-the-probes
    technique:
      name: orchestration-patterns::gather-results
      inputs:
        dispatched_results: probe_directory_outputs
        expected_ids: probe_targets
  - kind: technique
    id: write-the-report
    technique: report-conformance
exits:
  - id: reported
    isDefault: true
outcome:
  - A reader can tell from one document whether each branch ran in a context of its own and whether the batch overlapped, without reading a log
  - Every fan form is reported the same way, so they are comparable and none is described in terms the others cannot be
  - The forms the run exercised are named against the grammar they come from, so a reader learning the grammar can see which part each stage stands for
