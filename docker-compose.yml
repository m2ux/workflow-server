# Host worktrees + source roots are bound RW; the server derives planning under
# source/<owner>/<repo>/.engineering and feature worktrees under worktrees/.
# Agents create worktrees on the host before the server writes artifacts.
#
# Paths are overridable via environment variables or a local `.env` file
# (see `.env.example`). Defaults match scripts/install.sh layout.
#
# Host-side MCP vars (WORKFLOW_WORKSPACE, WORKFLOW_DIR, …) are separate from
# CONTAINER_* paths so a shared `.env` can drive both stdio MCP and compose.
#
# UID/GID: run the container as the same user that owns host worktrees
# (user: "${UID}:${GID}") so writes into the RW binds succeed.
services:
  workflow-server:
    build: .
    # Match start.sh: same UID/GID as host binds (worktrees/source/state).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      WORKTREE_ROOT: ${CONTAINER_WORKTREE_ROOT:-/var/lib/workflow-server/worktrees}
      WORKFLOW_WORKSPACE: ${CONTAINER_WORKTREE_ROOT:-/var/lib/workflow-server/worktrees}
      WORKFLOW_SERVER_ENGINEERING_DIR: ${CONTAINER_ENGINEERING_ROOT:-${CONTAINER_SOURCE_ROOT:-/var/lib/workflow-server/source}}
      WORKFLOW_SERVER_INSTALL_DIR: ${CONTAINER_INSTALL_DIR:-/var/lib/workflow-server}
      # Optional: override default planning slug (multi-root uses artifacts/planning per repo)
      # PLANNING_SLUG: artifacts/planning
      WORKFLOW_DIR: ${CONTAINER_WORKFLOW_DIR:-/app/workflows}
      SCHEMAS_DIR: ${CONTAINER_SCHEMAS_DIR:-/app/schemas}
      # HMAC key dir — do not rely on HOME (Docker --user without passwd → HOME=/)
      WORKFLOW_SERVER_KEY_DIR: ${CONTAINER_STATE_DIR:-/var/lib/workflow-server/state}
      HOME: ${CONTAINER_STATE_DIR:-/var/lib/workflow-server/state}
      TRANSPORT: ${TRANSPORT:-http}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      # Repo is selected at start_session (not process start). Optional process pin:
      # WORKFLOW_SERVER_REPO: m2ux/my-project
    volumes:
      - type: bind
        source: ${HOST_WORKFLOWS_DIR:-./workflows}
        target: ${CONTAINER_WORKFLOW_DIR:-/app/workflows}
        read_only: true
      - type: bind
        source: ${HOST_SCHEMAS_DIR:-./schemas}
        target: ${CONTAINER_SCHEMAS_DIR:-/app/schemas}
        read_only: true
      # Feature worktrees root (default $INSTALL/worktrees)
      - type: bind
        source: ${HOST_WORKTREE_ROOT:-${HOME}/.local/share/workflow-server/worktrees}
        target: ${CONTAINER_WORKTREE_ROOT:-/var/lib/workflow-server/worktrees}
        read_only: false
      # Source multi-root: app clones + .engineering (default $INSTALL/source)
      - type: bind
        source: ${HOST_SOURCE_ROOT:-${HOST_ENGINEERING_ROOT:-${HOME}/.local/share/workflow-server/source}}
        target: ${CONTAINER_SOURCE_ROOT:-${CONTAINER_ENGINEERING_ROOT:-/var/lib/workflow-server/source}}
        read_only: false
      # Durable server state (HMAC secret)
      - type: bind
        source: ${HOST_STATE_DIR:-${HOME}/.local/share/workflow-server/state}
        target: ${CONTAINER_STATE_DIR:-/var/lib/workflow-server/state}
        read_only: false
