id: work-packages
version: 3.2.0
title: Work Packages Workflow
description: Plan and coordinate multiple related work packages. Use when you have multiple related features, a roadmap spanning several weeks/months, or features with shared context. Execution triggers the work-package workflow for each package.
author: m2ux
tags:
  - planning
  - roadmap
  - multi-package
  - coordination
  - prioritization
rules:
  workflow:
    - ref: agents-md-prerequisite
    - Agents must NOT proceed past checkpoints without user confirmation
    - Ask, don't assume - Clarify scope and priorities before planning
    - Explicit approval - Get clear 'yes' or 'proceed' before creating documents
fragments:
  rules:
    agents-md-prerequisite: "PREREQUISITE: Agents MUST read and follow AGENTS.md before starting any work"
techniques:
  activity:
    - variable-binding
variables:
  - name: analysis_type
    type: string
    description: "Type of analysis performed: 'completion' (continuing previous work) or 'context' (new initiative)"
  - name: user_request
    type: string
    description: The user's free-form description of the initiative that opened this session.
  - name: completed_packages
    type: array
    description: List of completed work packages
  - name: planning_folder_path
    type: string
    description: Path to the planning folder for this initiative
  - name: package_plans
    type: array
    description: List of created plan document paths
  - name: dependency_map
    type: object
    description: Map of inter-package dependencies identified during package planning
  - name: parent_workflow
    type: string
    description: Reference back to work-packages context when triggering work-package workflow
initialActivity: scope-assessment
