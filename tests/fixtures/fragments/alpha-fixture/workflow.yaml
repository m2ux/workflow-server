id: alpha-fixture
version: 1.0.0
title: Fragments guard fixture — declaring workflow
rules:
  workflow:
    - Confirm scope with the user before mutating any tracked file in the corpus
fragments:
  checkpoints:
    unused-fragment-gate:
      message: This fragment is declared here and referenced nowhere in the fixture corpus.
      options:
        - id: acknowledge
          label: Acknowledge
          description: Nothing references this gate
    confirm-gate:
      condition:
        type: simple
        variable: scope_confirmed
        operator: "!="
        value: true
      message: Confirm the resolved scope before the mutation pass begins.
      options:
        - id: proceed
          label: Scope confirmed
          description: Proceed with the mutation pass
          effect:
            setVariable:
              scope_confirmed: true
        - id: revise
          label: Revise scope
          description: Return to scoping
variables:
  - name: scope_confirmed
    type: boolean
    description: Whether the mutation scope has been confirmed
    defaultValue: false
initialActivity: alpha-activity
