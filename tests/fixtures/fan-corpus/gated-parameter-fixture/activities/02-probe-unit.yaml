id: probe-unit
version: 1.0.0
name: Probe Unit
description: The fanned activity, gating its bound step on the element this instance was handed.
variables:
  reads:
    - probe_target
steps:
  - kind: technique
    id: survey
    technique: probe::survey
    when: probe_target
exits:
  - id: probed
    isDefault: true
