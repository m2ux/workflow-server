id: combine-probes
version: 1.0.0
name: Combine Probes
description: Reads a container member and omits the slot index, so the reference addresses nothing.
variables:
  reads:
    - probe_unit_outputs
steps:
  - kind: action
    id: read-without-the-index
    actions:
      - action: log
        message: read {probe_unit_outputs.probe_findings}
exits:
  - id: settled
    isDefault: true
