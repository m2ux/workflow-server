id: probe-unit
version: 1.0.0
name: Probe Unit
description: The fanned activity, declaring an artifact name templated on the fan parameter, so each instance file is its own.
variables:
  reads:
    - probe_target
  writes:
    - name: probe_findings
      type: object
      description: What the probe found for its unit.
steps:
  - kind: technique
    id: survey
    technique: probe::survey
exits:
  - id: probed
    isDefault: true
