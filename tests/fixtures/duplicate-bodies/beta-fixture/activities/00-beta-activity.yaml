id: beta-activity
version: 1.0.0
name: Beta Activity
steps:
  - kind: checkpoint
    id: beta-confirm
    message: Is the scope settled?
    options:
      - id: yes-settled
        label: Settled
        description: The scope is agreed and the run proceeds
      - id: no-more-work
        label: Not yet
        description: The scope needs more work before the run proceeds
exits:
  - id: done
    isDefault: true
