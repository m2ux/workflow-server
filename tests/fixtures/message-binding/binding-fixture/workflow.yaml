id: binding-fixture
version: 1.0.0
title: Message Binding Fixture
description: Activities covering the bound and unbound cases a user-facing message can reach.
author: m2ux
variables:
  - name: session_input
    type: string
    description: A session fact, seeded before any activity runs
    required: true
initialActivity: produce-then-render
graph:
  produce-then-render:
    done: gate-then-render
    revise: produce-then-render
  gate-then-render:
    done: read-prior-state
  read-prior-state:
    done: loop-carried
  loop-carried:
    done: shared-before
  shared-before:
    done: shared-after
  shared-after:
    done: loop-undefaulted
  loop-undefaulted:
    done: repeated-id
  repeated-id:
    done: nested-loops
  nested-loops:
    done: __terminal__
