id: choose-probes
version: 1.1.0
name: Choose Probes
description: The first fan's meeting point — gather every survey it opened and pick the directories to probe.
variables:
  reads:
    - component_path
    - probe_budget
    - survey_files_outputs
    - survey_history_outputs
    - survey_plan
    - survey_tree_outputs
  writes:
    - name: probe_targets
      type: array
      description: One entry per probe, each carrying its designator and the directory that probe covers. The graph fans this activity's exit over it, so its length is how many probes run at once.
required: true
steps:
  - kind: technique
    id: gather-the-surveys
    technique:
      name: orchestration-patterns::gather-results
      inputs:
        dispatched_results: survey_files_outputs
        expected_ids: survey_files_outputs
  - kind: technique
    id: choose-the-probes
    technique: choose-probes
exits:
  - id: chosen
    isDefault: true
outcome:
  - Every survey is in one place, each in the slot its own branch landed it in, so none could have overwritten another
  - The two activities named in that destination and the instances fanned alongside them are read the same way, so the mixture is one fan rather than two arrivals to reconcile
  - The directories worth probing are chosen from what every survey saw together, which is the reason they ran before this one rather than beside it
