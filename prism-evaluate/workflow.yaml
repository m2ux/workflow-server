id: prism-evaluate
version: 2.1.0
title: Evaluation Workflow
description: Orchestrate multi-dimensional evaluations by mapping user-defined evaluation dimensions to prism analytical lenses.
author: m2ux
tags:
  - evaluation
  - analysis
  - prism
  - multi-dimensional
  - proposals
  - documents
rules:
  workflow:
    - ref: prism-audit::orchestration-model
  activity:
    - ref: prism::worker-permissions
    - ref: prism::artifact-verification
techniques:
  activity:
    - variable-binding
variables:
  - name: evaluation_description
    type: string
    description: What to evaluate, the evaluation's goals, and its focus areas or concerns
    required: true
  - name: target_path
    type: string
    description: Path to the document, proposal, codebase, or artifact set to evaluate
    required: true
  - name: evaluation_output_path
    type: string
    description: Directory the evaluation artifacts are written to
    required: true
  - name: evaluation_target_type
    type: string
    description: "The target's kind: document | document-set | codebase | mixed"
  - name: current_finding
    type: object
    description: The finding under consideration
  - name: finding_disposition
    type: string
    description: "Disposition taken on the current finding: accept | modify | skip | discuss"
initialActivity: scope-definition
