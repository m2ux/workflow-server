id: resolution-dialogue
version: 2.3.0
name: Resolution Dialogue
description: Propose mitigations for each evaluation finding one-by-one.
variables:
  reads:
    - current_finding
    - evaluation_description
    - evaluation_output_path
    - evaluation_target_type
    - finding_disposition
    - target_path
  writes:
    - name: accepted_count
      type: number
      description: How many findings carry an accepted or modified disposition
      defaultValue: 0
    - name: current_finding
      type: object
      description: The finding under consideration
    - name: evaluation_findings
      type: array
      description: The report's findings, each carrying an ID, severity, claim, critique, and mitigation tier
    - name: finding_disposition
      type: string
      description: What the dialogue decided about the finding under discussion.
      values:
        - accept
        - modify
        - skip
        - discuss
    - name: mitigation_plan_path
      type: string
      description: Path to the `MITIGATION-PLAN.md` artifact
    - name: mitigations_apply_requested
      type: boolean
      description: Whether the user asked for the accepted mitigations to be applied to the target
      defaultValue: false
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: load-and-classify
    technique: resolve-findings::load-and-classify
  - kind: loop
    id: finding-iteration
    name: Finding Iteration
    loopType: forEach
    variable: current_finding
    over: evaluation_findings
    maxIterations: 100
    steps:
      - kind: loop
        id: proposal-refinement
        name: Proposal Refinement
        loopType: doWhile
        maxIterations: 5
        condition:
          type: simple
          variable: finding_disposition
          operator: ==
          value: discuss
        steps:
          - kind: technique
            id: propose-mitigation
            technique: resolve-findings::propose-mitigation-by-tier
          - kind: checkpoint
            id: finding-decision
            message: "Finding {current_finding.id} ({current_finding.severity}, tier {current_finding.tier}), with a proposed mitigation for it."
            options:
              - id: accept
                label: Accept
                description: Take the proposed mitigation as written
                effect:
                  setVariable:
                    finding_disposition: accept
              - id: modify
                label: Accept with modifications
                description: Take the mitigation's intent with adjusted wording or approach
                effect:
                  setVariable:
                    finding_disposition: modify
              - id: skip
                label: Skip
                description: Leave this finding unmitigated
                effect:
                  setVariable:
                    finding_disposition: skip
              - id: discuss
                label: Discuss
                description: Supply context and see a revised proposal
                effect:
                  setVariable:
                    finding_disposition: discuss
      - kind: technique
        id: record-decision
        technique: resolve-findings::record-finding-decision
        actions:
          - action: set
            target: accepted_mitigations
            value: "{finding_decision}"
            description: Append the finding's recorded disposition.
  - kind: technique
    id: compile-plan
    technique: resolve-findings::compile-plan
  - kind: checkpoint
    id: confirm-apply
    message: "{accepted_count} accepted mitigations, ordered by tier and severity in [the mitigation plan]({mitigation_plan_path})."
    options:
      - id: apply
        label: Apply the accepted mitigations to the target
        description: The target document takes every accepted mitigation
        effect:
          setVariable:
            mitigations_apply_requested: true
      - id: plan-only
        label: Keep the plan and leave the target unmodified
        description: The mitigation plan stands as the deliverable
        effect:
          setVariable:
            mitigations_apply_requested: false
exits:
  - id: mitigations-requested
    when: mitigations_apply_requested == true
  - id: resolved
    isDefault: true
outcome:
  - Every finding has a mitigation the user has explicitly decided on, preserving the nuance that batch review would lose
  - The accepted mitigations are captured as a priority-ordered, change-specified plan precise enough to apply to the target
  - The target is modified only where the user approved the plan for application
