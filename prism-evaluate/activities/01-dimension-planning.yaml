id: dimension-planning
version: 1.4.0
name: Plan Dimension Analysis
description: Map each evaluation dimension to prism pipeline modes and lenses.
variables:
  reads:
    - evaluation_description
    - evaluation_output_path
    - evaluation_target_type
    - target_path
  writes:
    - name: dimension_plan
      type: array
      description: Per-dimension prism configuration, each { dimension, pipeline_mode, lenses, analysis_focus, output_subdir }
    - name: dimensions_confirmed
      type: boolean
      description: Whether the user confirmed the dimension-to-lens mapping
      defaultValue: false
    - name: evaluation_plan_path
      type: string
      description: Path to the `evaluation-plan.md` artifact
    - name: execution_groups
      type: array
      description: Dimensions grouped for triggering, each { pipeline_mode, lenses, dimensions, analysis_focus, output_subdir }
steps:
  - kind: technique
    id: survey-target
    technique: plan-evaluation::survey-target
  - kind: technique
    id: map-dimensions
    technique: plan-evaluation::map-dimensions-to-lenses
  - kind: technique
    id: group-dimensions
    technique: plan-evaluation::group-for-execution
  - kind: technique
    id: write-plan
    technique: plan-evaluation::write-evaluation-plan
  - kind: checkpoint
    id: confirm-plan
    message: The dimension-to-lens mapping and the execution grouping it runs under, in [the evaluation plan]({evaluation_plan_path}).
    options:
      - id: accept
        label: Run the analyses on this plan
        description: Each execution group is analysed as the plan maps it
        effect:
          setVariable:
            dimensions_confirmed: true
      - id: adjust
        label: Adjust the plan
        description: Revise the lens mapping, pipeline modes, or execution grouping first
        effect:
          transitionTo: dimension-planning
    blocking: true
outcome:
  - Each dimension is matched to the prism pipeline modes and lenses that will surface target-specific findings, grouped into runnable batches the analysis stage can execute directly
transitions:
  - to: execute-analysis
    condition:
      type: simple
      variable: dimensions_confirmed
      operator: ==
      value: true
    isDefault: true
