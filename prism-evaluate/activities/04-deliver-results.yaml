id: deliver-results
version: 2.1.0
name: Deliver Evaluation Results
description: Present the final evaluation results to the user.
variables:
  reads:
    - all_artifact_paths
    - completed_analyses
    - dimension_plan
    - evaluation_description
    - evaluation_output_path
    - evaluation_plan_path
    - evaluation_report_path
    - evaluation_target_type
    - target_path
  writes:
    - name: resolution_requested
      type: boolean
      description: Whether the user opted into the resolution dialogue
      defaultValue: false
steps:
  - kind: technique
    id: compile-delivery-metrics
    technique: compose-evaluation-report::compile-delivery-metrics
    actions:
      - action: message
        message: |-
          {evaluation_report.core_finding}

          {evaluation_metrics}
  - kind: checkpoint
    id: resolution-offer
    message: The findings are set out in [the evaluation report]({evaluation_report_path}).
    options:
      - id: proceed
        label: Work through the findings
        description: Each finding gets a proposed mitigation and a decision, compiled into a plan
        effect:
          setVariable:
            resolution_requested: true
      - id: stop
        label: Stop with the evaluation
        description: The evaluation report is the final deliverable
        effect:
          setVariable:
            resolution_requested: false
    blocking: true
outcome:
  - The user can see what the evaluation found and where every deliverable lives, and can decide whether to move into resolving the findings or stop here
exits:
  - id: resolution-requested
    when: resolution_requested == true
  - id: delivered
    isDefault: true
