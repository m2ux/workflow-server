id: deliver-results
version: 2.0.0
name: Deliver Evaluation Results
description: Present the final evaluation results to the user.
steps:
  - kind: technique
    id: compile-delivery-metrics
    technique: compose-evaluation-report::compile-delivery-metrics
    actions:
      - action: message
        message: |-
          {evaluation_report.core_finding}

          {evaluation_metrics}

          The full evaluation is in [the evaluation report]({evaluation_report_path}).
  - kind: checkpoint
    id: resolution-offer
    message: The evaluation is complete, and its findings can be worked through one at a time into a mitigation plan.
    options:
      - id: proceed
        label: Work through the findings
        description: Each finding gets a proposed mitigation and a decision, compiled into a plan
        effect:
          setVariable:
            resolution_requested: true
      - id: stop
        label: Stop with the evaluation
        description: The evaluation report is the final deliverable
        effect:
          setVariable:
            resolution_requested: false
    blocking: true
outcome:
  - The user can see what the evaluation found and where every deliverable lives, and can decide whether to move into resolving the findings or stop here
transitions:
  - to: resolution-dialogue
    condition:
      type: simple
      variable: resolution_requested
      operator: ==
      value: true
  - to: __terminal__
    isDefault: true
