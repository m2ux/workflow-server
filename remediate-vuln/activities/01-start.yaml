id: start
version: 2.2.0
name: Start Security Vulnerability Remediation
description: Initialize a high-sensitivity security fix.
variables:
  reads:
    - branch_name
    - host_repo_path
    - planning_folder_path
    - private_fork_url
    - sec_vuln_url
    - target_path
  writes:
    - name: branch_name
      type: string
      description: Security feature branch name (e.g. vuln/remediate-{short_id}).
    - name: component_name
      type: string
      description: Basename of the component under remediation.
      defaultValue: ""
    - name: component_git_dir
      type: string
      description: Absolute path of the component's git working tree, whose security remote names the private fork.
    - name: component_path
      type: string
      description: Path of the component under remediation, relative to the host repository.
      defaultValue: .
    - name: private_fork_url
      type: string
      description: URL of the private fork backing the security remote.
    - name: project_type
      type: string
      description: Detected project type (e.g. rust-substrate|other).
    - name: sec_vuln_url
      type: string
      description: URL of the restricted vulnerability advisory.
    - name: short_id
      type: string
      description: Short advisory slug used in the security branch name.
    - name: stealth_mode
      type: boolean
      description: No-disclosure gate for shared activities; always true here.
      defaultValue: true
required: true
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: ENTERING SECURITY VULNERABILITY MODE - ISOLATION ACTIVE
  - kind: action
    id: set-security-mode
    actions:
      - action: set
        target: stealth_mode
        value: true
  - kind: technique
    id: collect-security-inputs
    technique: security-setup::collect-security-inputs
  - kind: checkpoint
    id: sec-vuln-url-input
    condition:
      type: simple
      variable: sec_vuln_url
      operator: notExists
    message: "Please provide the private security advisory URL:"
    options:
      - id: provided
        label: URL Provided
        description: Proceed with this URL
  - kind: action
    id: resolve-target
    actions:
      - action: validate
        target: target_path exists
        message: Target directory not found at the supplied target_path
  - kind: technique
    id: resolve-repo-root
    technique:
      name: work-package::repo-root-resolution
      inputs:
        host_repo_path: target_path
  - kind: technique
    id: detect-project-type
    technique: work-package::project-type-detection
  - kind: action
    id: verify-signing-precondition
    actions:
      - action: validate
        target: signing.configured == true
        message: Commit signing is not configured for this repository (user.signingkey, commit.gpgsign, or a working signing backend is missing). Configure git signing in your environment via your preferred scope (system, global, or local) before re-running.
  - kind: checkpoint
    id: private-fork-url-input
    condition:
      type: simple
      variable: private_fork_url
      operator: notExists
    message: "Please provide the private fork URL for the security vulnerability fix:"
    options:
      - id: provided
        label: URL Provided
        description: Proceed with this URL
  - kind: technique
    id: configure-sec-vuln-remote
    technique: security-setup::configure-security-remote
    actions:
      - action: validate
        target: security_remote_configured != false
        message: "The 'security' remote is not registered against the private fork inside {target_path}. Add it with git remote add security {private_fork_url} and re-run."
  - kind: checkpoint
    id: confirm-security-remote
    message: "Isolation check — `git remote -v` reports where the `security` remote points, and this run requires a private repository there."
    options:
      - id: confirmed
        label: Yes, security remote is private
        description: Confirmed security remote is correctly configured for isolation
      - id: wrong-remote
        label: No, fix remote
        description: The remote points somewhere other than the private fork
        effect:
          exit: abort
  - kind: checkpoint
    id: short-id-input
    condition:
      type: simple
      variable: short_id
      operator: notExists
    message: "Please provide a short advisory slug for the security branch name (e.g. cve-2026-1234):"
    options:
      - id: provided
        label: Short ID Provided
        description: Proceed with this slug
  - kind: technique
    id: initialize-security-branch
    technique: security-setup::initialize-security-branch
  - kind: checkpoint
    id: verify-isolation
    message: "The `security` remote and local branch are configured against {sec_vuln_url}, and this run creates no public PR or issue."
    options:
      - id: authorized
        label: Yes, proceed
        description: Confirmed private remote and isolation
      - id: cancel
        label: No, abort
        description: The remote or the branch is not the isolated pair this run requires
        effect:
          exit: abort
  - kind: technique
    id: initialize-planning-folder
    technique: security-setup::initialize-planning-folder
  - kind: technique
    id: present-security-overview
    technique: security-setup::present-security-overview
    actions:
      - action: message
        message: |-
          **Security Overview** — what this vulnerability puts at risk, in plain language

          {security_overview}
  - kind: technique
    id: finalize-setup
    technique: security-setup::verify-origin-untracked
    actions:
      - action: validate
        target: origin_untracked != false
        message: "The current branch in {target_path} still tracks an upstream on origin, so a push could reach the public remote. Run git branch --unset-upstream in {target_path} and re-run."
  - kind: technique
    id: verify-artifact-conformance
    technique: verify-artifact-conforms
  - kind: action
    id: announce-completion
    actions:
      - action: log
        message: Security initialization complete. Public disclosure paths disabled.
exits:
  - id: done
    isDefault: true
  - id: abort
    immediate: true
outcome:
  - "The workflow is locked into isolation: every public disclosure path is disabled for the rest of the fix"
  - All git operations have a private-only destination — the fix cannot be pushed to a public repository
  - The fix develops on a dedicated advisory branch off the private fork, never touching a public branch
  - Planning happens entirely off any public surface — no PR or Issue link is ever recorded
