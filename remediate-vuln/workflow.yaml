$schema: ../../schemas/workflow.schema.json
id: remediate-vuln
version: 3.0.0
title: Security Vulnerability Remediation Workflow
description: Remediate security vulnerabilities without public disclosure.
author: m2ux
tags:
  - security
  - implementation
  - vulnerability
  - remediation
  - private
rules:
  activity:
    - "STRICT ISOLATION: The agent MUST NOT use any public GitHub tools (e.g. gh pr create, gh issue create) during this workflow."
    - "PRIVATE REMOTE ONLY: All git operations must target the 'security' remote, never 'origin'."
    - "PRIVATE RESEARCH ONLY: Outbound research and web queries MUST NOT contain advisory-identifying strings (CVE identifiers, advisory URLs, vulnerable symbol or project names). Research generically, or against local sources only."
techniques:
  activity:
    - variable-binding
variables:
  # This workflow opens on its own `start` rather than work-package's `start-work-package`, so the
  # review-mode values that opener produces have no producer here. It never reviews an existing PR,
  # so they are constants, owned by the file that runs the borrowed activity reading them.
  - name: prior_feedback_triage
    type: object
    description: Triage of a reviewed PR's prior feedback, always empty in this workflow.
    defaultValue: {}
  - name: rating_cap
    type: string
    description: Ceiling a review's Overall Rating may not exceed, always empty in this workflow.
    defaultValue: ""
  - name: target_path
    type: string
    description: Private checkout for edits, builds, and pushes to the security remote.
  - name: host_repo_path
    type: string
    description: Investigation root; equals target_path in this workflow.
  - name: component_path
    type: string
    description: Path of the component under remediation, relative to the host repository.
    defaultValue: .
  - name: component_git_dir
    type: string
    description: Absolute path of the component's git working tree, whose security remote names the private fork.
  - name: target_repo
    type: string
    description: Private fork as owner/repo.
  - name: default_branch
    type: string
    description: The repository's default branch, which the security branch syncs from and merges into.
  - name: issue_platform
    type: string
    description: The issue tracker the advisory lives in while it stays restricted.
    values:
      - github
      - jira
  - name: issue_number
    type: string
    description: GitHub or Jira issue number, empty while the advisory is restricted.
    defaultValue: ""
  - name: issue_url
    type: string
    description: URL of the tracker issue for this remediation, empty while the advisory is restricted.
    defaultValue: ""
  - name: issue_title
    type: string
    description: Tracker issue/ticket title.
  - name: issue_record
    type: object
    description: The tracked issue as its platform returned it.
  - name: pr_number
    type: string
    description: Pull request number, empty while disclosure stays private.
    defaultValue: ""
  - name: pr_url
    type: string
    description: URL of the pull request for this remediation, empty while disclosure stays private.
    defaultValue: ""
  - name: assumption_outcome
    type: string
    description: The outcome the deciding gate gave the assumption under discussion, empty before any gate has decided one.
    defaultValue: ""
  - name: safety_floor_cleared
    type: boolean
    description: Whether the applied simplifications hold the ponytail safety floor.
    defaultValue: false
  - name: planning_folder_path
    type: string
    description: Path to this work package planning folder.
  - name: provenance_log_path
    type: string
    description: Absolute path to provenance-log.md under the planning folder.
    defaultValue: ""
  - name: branch_name
    type: string
    description: Security feature branch name (e.g. vuln/remediate-{short_id}).
  - name: sec_vuln_url
    type: string
    description: URL of the restricted vulnerability advisory.
  - name: private_fork_url
    type: string
    description: URL of the private fork backing the security remote.
  - name: is_review_mode
    type: boolean
    description: Whether the run reviews an existing pull request, always false in this workflow.
    defaultValue: false
  - name: skip_optional_activities
    type: boolean
    description: Whether to skip optional discovery activities (elicitation and research).
    defaultValue: false
  - name: question_domains
    type: array
    description: Question domains for requirements elicitation.
  - name: needs_plan_revision
    type: boolean
    description: Whether feedback requires returning to plan-prepare.
    defaultValue: false
  - name: needs_further_discussion
    type: boolean
    description: Whether further stakeholder discussion is needed.
    defaultValue: false
  - name: implementation_plan
    type: object
    description: "Implementation plan ({ task_count, tasks: [{ id, description, status }] })."
  - name: gitnexus_indexed
    type: boolean
    description: Whether host_repo_path has a usable GitNexus index (kept false here).
    defaultValue: false
  - name: block_path
    type: string
    description: File path of the current review or implementation code block.
    defaultValue: ""
  - name: block_line_range
    type: string
    description: Line range of the current code block (e.g. 120-145).
    defaultValue: ""
  - name: flagged_block_indices
    type: array
    description: Change-block indices flagged during manual diff review.
  - name: skip_architecture_summary
    type: boolean
    description: Whether to skip architecture summary creation.
    defaultValue: false
  - name: push_remote
    type: string
    description: "Git remote for every push (always 'security' here)."
    defaultValue: security
  - name: squash_merge_supported
    type: boolean
    description: Whether the host supports squash merge, always false in this workflow.
    defaultValue: false
initialActivity: start
graph:
  start:
    done: design-philosophy
    abort: __terminal__
  design-philosophy:
    done: codebase-comprehension
  requirements-elicitation:
    research-needed: research
    no-research-needed: implementation-analysis
    elicitation-incomplete: requirements-elicitation
  research:
    done: implementation-analysis
  implementation-analysis:
    done: plan-prepare
  plan-prepare:
    done: assumptions-review
    revise: plan-prepare
  assumptions-review:
    needs-comprehension: codebase-comprehension
    needs-plan-revision: plan-prepare
    needs-further-discussion: assumptions-review
    review-mode: lean-coding-audit
    assumptions-approved: implement
  implement:
    done: lean-coding-audit
  lean-coding-audit:
    done: post-impl-review
  post-impl-review:
    done: validate
    has-blocker: implement
  validate:
    done: strategic-review
  strategic-review:
    review-mode: submit-for-review
    review-passed: submit-for-review
    review-failed: plan-prepare
  submit-for-review:
    review-mode: complete
    review-approved: complete
    review-requires-changes: plan-prepare
    provide-input: submit-for-review
    abort: complete
  codebase-comprehension:
    needs-elicitation: requirements-elicitation
    research-needed: research
    skip-optional-activities: plan-prepare
    comprehension-complete: implementation-analysis
activities:
  - 01-start.yaml
  - work-package/02-design-philosophy.yaml
  - work-package/03-requirements-elicitation.yaml
  - work-package/04-research.yaml
  - work-package/05-implementation-analysis.yaml
  - work-package/06-plan-prepare.yaml
  - work-package/07-assumptions-review.yaml
  - work-package/08-implement.yaml
  - work-package/09-lean-coding-audit.yaml
  - work-package/10-post-impl-review.yaml
  - work-package/11-validate.yaml
  - work-package/12-strategic-review.yaml
  - work-package/13-submit-for-review.yaml
  - work-package/14-complete.yaml
  - work-package/15-codebase-comprehension.yaml
