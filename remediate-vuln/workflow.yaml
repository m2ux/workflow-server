$schema: ../../schemas/workflow.schema.json
id: remediate-vuln
version: 2.0.0
title: Security Vulnerability Remediation Workflow
description: Remediate security vulnerabilities without public disclosure.
author: m2ux
tags:
  - security
  - implementation
  - vulnerability
  - remediation
  - private
rules:
  workflow:
    - "Agents MUST NOT skip or auto-resolve blocking checkpoints (blocking: true) — these require explicit user selection."
    - ref: work-package::interaction-discipline
    - Explicit approval - Get clear 'yes' or 'proceed' before major actions
    - "ORCHESTRATION MODEL: This workflow uses an orchestrator/worker pattern. The agent receiving the user request acts AS the orchestrator inline (technique: meta-orchestrator from meta/techniques) — it MUST NOT be spawned as a sub-agent. The orchestrator loads the workflow, manages transitions, tracks state, and presents checkpoints to the user. A worker sub-agent (technique: activity-worker from meta/techniques) executes activity steps and produces artifacts. When the worker reaches a blocking checkpoint, it yields a checkpoint_pending result. The orchestrator presents the checkpoint to the user, then resumes the worker with the response. CONSTRAINT: Only ONE level of sub-agent indirection (the worker)."
  activity:
    - "STRICT ISOLATION: The agent MUST NOT use any public GitHub tools (e.g. gh pr create, gh issue create) during this workflow."
    - "PRIVATE REMOTE ONLY: All git operations must target the 'security' remote, never 'origin'."
    - "PRIVATE RESEARCH ONLY: Outbound research and web queries MUST NOT contain advisory-identifying strings (CVE identifiers, advisory URLs, vulnerable symbol or project names). Research generically, or against local sources only."
techniques:
  activity:
    - variable-binding
variables:
  - name: target_path
    type: string
    description: Private checkout for edits, builds, and pushes to the security remote.
  - name: repo_root
    type: string
    description: Investigation root; equals target_path in this workflow.
  - name: component_name
    type: string
    description: Basename of the component under remediation.
    defaultValue: ""
  - name: planning_folder_path
    type: string
    description: Path to this work package planning folder.
  - name: provenance_log_path
    type: string
    description: Absolute path to provenance-log.md under the planning folder.
    defaultValue: ""
  - name: branch_name
    type: string
    description: Security feature branch name (e.g. vuln/remediate-{short_id}).
  - name: project_type
    type: string
    description: Detected project type (e.g. rust-substrate|other).
  - name: stealth_mode
    type: boolean
    description: No-disclosure gate for shared activities; always true here.
    defaultValue: true
  - name: sec_vuln_url
    type: string
    description: URL of the restricted vulnerability advisory.
  - name: private_fork_url
    type: string
    description: URL of the private fork backing the security remote.
  - name: short_id
    type: string
    description: Short advisory slug used in the security branch name.
  - name: is_review_mode
    type: boolean
    description: Always false; review-mode shared steps gate out.
    defaultValue: false
  - name: needs_elicitation
    type: boolean
    description: Whether requirements elicitation is needed.
    defaultValue: false
  - name: needs_research
    type: boolean
    description: Whether the research phase is needed.
    defaultValue: false
  - name: skip_optional_activities
    type: boolean
    description: Whether to skip optional discovery (elicitation and research).
    defaultValue: false
  - name: needs_comprehension
    type: boolean
    description: Whether codebase comprehension is needed.
    defaultValue: true
  - name: problem_complexity
    type: string
    description: Problem complexity (simple|moderate|complex).
  - name: problem_type
    type: string
    description: Problem classification (e.g. defect|inventive-improvement).
  - name: path_gating_complexity
    type: string
    description: Path-gating mirror of problem_complexity.
    defaultValue: ""
  - name: elicitation_complete
    type: boolean
    description: Whether requirements elicitation is finished.
    defaultValue: false
  - name: question_domains
    type: array
    description: Question domains for requirements elicitation.
  - name: current_domain
    type: string
    description: Current question domain in the elicitation loop.
  - name: research_candidates
    type: array
    description: Open research gaps ({ id, statement, status, rationale, handoff }).
  - name: has_reconcilable_research
    type: boolean
    description: Whether research-reconcilable gaps remain open.
    defaultValue: false
  - name: context_scope
    type: string
    description: AI provenance scope (repo-only|web-retrieval|mixed).
    defaultValue: repo-only
  - name: has_open_questions
    type: boolean
    description: Whether unresolved open questions remain after comprehension.
    defaultValue: false
  - name: comprehension_artifact
    type: string
    description: Absolute path to the current comprehension artifact.
    defaultValue: ""
  - name: artifact_name
    type: string
    description: Basename of the comprehension artifact (no path).
    defaultValue: ""
  - name: task_assumptions
    type: array
    description: Assumptions collected during the current implement task.
  - name: has_resolvable_assumptions
    type: boolean
    description: Whether code-resolvable assumptions remain for analysis.
    defaultValue: false
  - name: has_open_assumptions
    type: boolean
    description: Whether unresolved assumptions still need user input.
    defaultValue: false
  - name: open_assumptions
    type: array
    description: Open assumptions for interview loop iteration.
  - name: current_assumption
    type: object
    description: Current assumption in the interview loop ({ id, statement }).
  - name: assumption_resolved_inline
    type: boolean
    description: Whether the current assumption was resolved inline at interview.
    defaultValue: false
  - name: assumption_deferred
    type: boolean
    description: Whether the current assumption was deferred at interview.
    defaultValue: false
  - name: has_deferred_assumptions
    type: boolean
    description: Whether any assumptions were deferred during review.
    defaultValue: false
  - name: needs_plan_revision
    type: boolean
    description: Whether feedback requires returning to plan-prepare.
    defaultValue: false
  - name: needs_further_discussion
    type: boolean
    description: Whether further stakeholder discussion is needed.
    defaultValue: false
  - name: has_stakeholder_input
    type: boolean
    description: Whether a stakeholder discussion transcript was provided.
    defaultValue: false
  - name: stakeholder_review_complete
    type: boolean
    description: Whether stakeholder review of assumptions is complete.
    defaultValue: false
  - name: post_jira_comment
    type: boolean
    description: Whether to post an assumptions comment to Jira (kept false).
    defaultValue: false
  - name: ticket_refactor_needed
    type: boolean
    description: Review-mode ticket-refactor flag; inert when is_review_mode is false.
    defaultValue: false
  - name: ticket_gaps_documented
    type: boolean
    description: Review-mode ticket-gaps flag; inert when is_review_mode is false.
    defaultValue: false
  - name: implementation_plan
    type: object
    description: "Implementation plan ({ task_count, tasks: [{ id, description, status }] })."
  - name: current_task
    type: object
    description: Current task in the implementation loop.
  - name: has_uncertain_symbols
    type: boolean
    description: True when implement self-review found symbols with unconfirmed provenance.
    defaultValue: false
  - name: uncertain_symbols
    type: string
    description: Multi-line list of symbols with unconfirmed provenance; empty if none.
    defaultValue: ""
  - name: validation_passed
    type: boolean
    description: Whether validation passed.
    defaultValue: false
  - name: validation_results
    type: object
    description: Validation envelope (check/clippy/test/fmt status and validation_passed).
  - name: review_passed
    type: boolean
    description: Whether strategic review passed.
    defaultValue: false
  - name: needs_code_fixes
    type: boolean
    description: Whether code review findings require fixes.
    defaultValue: false
  - name: needs_test_improvements
    type: boolean
    description: Whether the test suite needs improvements.
    defaultValue: false
  - name: gitnexus_indexed
    type: boolean
    description: Whether repo_root has a usable GitNexus index (kept false here).
    defaultValue: false
  - name: prism_artifact_paths
    type: array
    description: Paths to prism analysis artifacts from post-impl-review.
  - name: block_path
    type: string
    description: File path of the current review or implementation code block.
    defaultValue: ""
  - name: block_line_range
    type: string
    description: Line range of the current code block (e.g. 120-145).
    defaultValue: ""
  - name: change_block_index
    type: string
    description: Path to the change-block index mapping IDs to per-block artifacts.
    defaultValue: ""
  - name: flagged_block_indices
    type: array
    description: Change-block indices flagged during manual diff review.
  - name: current_block_index
    type: number
    description: Current block index in the manual diff review loop.
    defaultValue: 0
  - name: has_flagged_blocks
    type: boolean
    description: Whether any change blocks were flagged in manual diff review.
    defaultValue: false
  - name: has_critical_blocker
    type: boolean
    description: Whether any flagged block is a critical blocker.
    defaultValue: false
  - name: skip_architecture_summary
    type: boolean
    description: Whether to skip architecture summary creation.
    defaultValue: false
  - name: needs_strategic_fixes
    type: boolean
    description: Whether strategic review findings require fixes.
    defaultValue: false
  - name: strategic_fixes_selective
    type: boolean
    description: True when only selected strategic-review findings will be fixed.
    defaultValue: false
  - name: strategic_findings_deferred
    type: boolean
    description: True when strategic-review findings were deferred.
    defaultValue: false
  - name: strategic_findings_summary
    type: string
    description: Multi-line summary of strategic-review findings; empty if none.
    defaultValue: ""
  - name: needs_cleanup
    type: boolean
    description: Whether minor cleanup is needed from strategic review.
    defaultValue: false
  - name: unsigned_commits_in_pr
    type: boolean
    description: True when any commit in the branch range lacks a valid GPG signature.
    defaultValue: false
  - name: resign_unsigned_commits_requested
    type: boolean
    description: True when the user chose to re-sign unsigned commits.
    defaultValue: false
  - name: unsigned_commit_list_summary
    type: string
    description: Short summary of unsigned commits; empty when all are signed.
    defaultValue: ""
  - name: recommended_strategic_option
    type: string
    description: Recommended strategic-review action (fix-findings|acceptable).
  - name: audit_confirmed
    type: boolean
    description: True when lean-coding-audit findings were user-resolved.
    defaultValue: false
  - name: needs_simplification
    type: boolean
    description: Whether accepted simplifications remain to apply.
    defaultValue: false
  - name: has_debt_markers
    type: boolean
    description: Whether ponytail debt markers were found in the tree.
    defaultValue: false
  - name: worktree_created
    type: boolean
    description: Kept false; develops in the user-supplied private checkout.
    defaultValue: false
  - name: push_remote
    type: string
    description: "Git remote for every push (always 'security' here)."
    defaultValue: security
  - name: push_remote_url
    type: string
    description: Resolved URL of the security remote.
    defaultValue: ""
  - name: squash_merge_supported
    type: boolean
    description: Kept false; public merge-strategy guidance is stealth-gated out.
    defaultValue: false
  - name: review_requires_changes
    type: boolean
    description: Kept false; PR review cycle is stealth-gated out.
    defaultValue: false
initialActivity: start
activities:
  - 01-start.yaml
  - work-package/02-design-philosophy.yaml
  - work-package/03-requirements-elicitation.yaml
  - work-package/04-research.yaml
  - work-package/05-implementation-analysis.yaml
  - work-package/06-plan-prepare.yaml
  - work-package/07-assumptions-review.yaml
  - work-package/08-implement.yaml
  - work-package/09-lean-coding-audit.yaml
  - work-package/10-post-impl-review.yaml
  - work-package/11-validate.yaml
  - work-package/12-strategic-review.yaml
  - work-package/13-submit-for-review.yaml
  - work-package/14-complete.yaml
  - work-package/15-codebase-comprehension.yaml
