id: sub-crate-review
version: 1.12.0
name: "Sub-Agent: Crate Deep Review"
description: Structured crate review for Group A sub-agents.
variables:
  reads:
    - gitnexus_available
    - planning_folder_path
  writes:
    - name: storage_lifecycle
      type: object
      description: Storage lifecycle pairing table with optional invariant comparison.
    - name: verdict_matrix
      type: object
      description: Complete verdict matrix and coverage attestation.
    - name: verification_report
      type: string
      description: Scan completeness verification with gaps and re-scan recommendations
required: false
steps:
  - kind: technique
    id: build-function-registry
    technique: build-function-registry
  - kind: technique
    id: extract-invariants
    technique: extract-invariants
  - kind: technique
    id: apply-checklist
    technique:
      name: apply-checklist
      inputs:
        checklist_source: audit-template-reference#3-systematic-manual-review-strategies
  - kind: technique
    id: cross-function-comparison
    technique:
      name: scan-storage-lifecycle
      inputs:
        verify_invariants: true
  - kind: technique
    id: verify-completeness
    technique: verify-sub-agent-output
  - kind: technique
    id: format-output
    technique:
      name: execute-sub-agent
      inputs:
        step_products: "{verdict_matrix}, {invariant_table}, {storage_lifecycle}, {verification_report}"
outcome:
  - The whole crate has been read, so no source file is silently left unreviewed
  - Every §3 checklist item has an evidence-backed verdict the orchestrator can trust without re-deriving it
  - Required analysis tables are either present or have a justified N/A, removing the ambiguity of a silently-skipped table
  - Storage invariants are checked across functions, catching state bugs that per-function review alone misses
