id: adversarial-verification
version: 2.7.0
name: Adversarial Verification
description: Adversarially verify PASS items from the primary audit.
variables:
  reads:
    - dispatch_results
    - file_inventory
    - planning_folder_path
  writes:
    - name: decomposition_results
      type: array
      description: Decomposition table with per-instance verification results.
required: true
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Starting adversarial verification of PASS items
  - kind: technique
    id: decompose-pass-claims
    technique:
      name: decompose-safety-claims
      inputs:
        pass_items: dispatch_results
        source_files: file_inventory
  - kind: action
    id: finalize-activity
    actions:
      - action: log
        message: Adversarial verification complete — false PASSes identified
exits:
  - id: done
    isDefault: true
outcome:
  - Every high-stakes PASS verdict has survived independent property-level re-checking, so it rests on a property-level test rather than on a first positive signal
  - Findings that primary agents missed as false PASSes are recovered and promoted into the findings set
  - The report can integrate calibrated verdicts that distinguish confirmed-safe from insufficiently-verified items
