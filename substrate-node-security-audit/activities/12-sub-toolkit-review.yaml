id: sub-toolkit-review
version: 2.0.0
name: "Sub-Agent: Toolkit Per-Function Review"
description: Per-function toolkit review for Group D sub-agents.
variables:
  reads:
    - gitnexus_available
    - planning_folder_path
  writes:
    - name: verdict_matrix
      type: object
      description: Complete verdict matrix and coverage attestation.

steps:
  - kind: technique
    id: apply-toolkit-checklist
    technique:
      name: apply-checklist
      inputs:
        checklist_source: toolkit-checklist
  - kind: technique
    id: format-output
    technique:
      name: execute-sub-agent
      inputs:
        step_products: "{verdict_matrix}"
exits:
  - id: reviewed
    isDefault: true
outcome:
  - Every toolkit function is reviewed against all 8 checklist items, so a benign-looking helper is read as closely as an obviously risky one
  - State, arithmetic, and I/O bugs are surfaced per function rather than only on representative samples
  - Coverage is attested at 100%, giving the orchestrator confidence that no function was selectively skipped
