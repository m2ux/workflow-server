steps:
  - kind: routine
    id: converge-assumptions
    routine: converge-concerns
    with:
      analyse_technique: review-assumptions::reconcile
      challenge_perspectives: '["stakeholder-gap", "rejected-paths", "evidence-strength"]'
      concern_kind: assumptions
      assumptions_log: "{assumptions_log}"
      target_path: "{target_path}"
    # The three flag-name inputs become output bindings. The same three names, in the same three
    # places, read by the reader that can act on them: the contract derivation now sees three
    # writes where it previously saw a technique taking three strings.
    outputs:
      convergence_flag: has_resolvable_assumptions
      residue_flag: has_open_assumptions
      residue_collection: open_assumptions

