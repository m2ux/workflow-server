id: dispatch-client-workflow
version: 5.7.0
name: Dispatch Client Workflow
description: Drive the client workflow's activity loop, each worker carrying a bounded run of activities.
required: true
steps:
  - kind: action
    id: verify-preconditions
    actions:
      - action: validate
        target: client_session_index
        message: Cannot dispatch without a client session_index; initialize-session must run first
  - kind: action
    id: prime-resumed-activity
    when: client_resumed_activity
    actions:
      - action: set
        target: current_activity
        value: "{client_resumed_activity}"
  - kind: action
    id: prime-initial-activity
    when: "!client_resumed_activity"
    actions:
      - action: set
        target: current_activity
        value: "{client_initial_activity}"
  - kind: loop
    id: client-activity-loop
    name: Client Activity Loop
    loopType: while
    condition:
      type: simple
      variable: current_activity
      operator: "!="
      value: null
    maxIterations: 200
    steps:
      - kind: technique
        id: continue-batched-worker
        when: worker_agent_id && worker_result.result_type == "activity_complete" && worker_result.batch_may_continue && worker_result.next_activity_id
        technique:
          name: workflow-engine::continue-batch
          inputs:
            activity_id: current_activity
            session_index: client_session_index
            worker_agent_id: worker_agent_id
            step_manifest: "{worker_result.steps_completed}"
            state: variables
      - kind: technique
        id: dispatch-activity
        when: "!worker_agent_id"
        technique:
          name: workflow-engine::dispatch-activity
          inputs:
            activity_id: current_activity
            session_index: client_session_index
            agent_technique: workflow-engine::activity-worker
            state: variables
      - kind: technique
        id: present-yielded-checkpoint
        when: worker_result.result_type == "checkpoint_pending"
        technique:
          name: workflow-engine::present-checkpoint-to-user
          inputs:
            session_index: client_session_index
      - kind: technique
        id: respond-yielded-checkpoint
        when: worker_result.result_type == "checkpoint_pending"
        technique:
          name: workflow-engine::respond-checkpoint
          inputs:
            session_index: client_session_index
            checkpoint_resolution: user_selection
      - kind: technique
        id: resume-yielded-worker
        when: worker_result.result_type == "checkpoint_pending"
        technique:
          name: workflow-engine::resume-worker
          inputs:
            session_index: client_session_index
            activity_id: current_activity
            worker_agent_id: worker_agent_id
            effects: effects
            state: variables
      - kind: technique
        id: commit-activity-artifacts
        when: worker_result.result_type == "activity_complete"
        technique:
          name: workflow-engine::commit-and-persist
          inputs:
            activity_id: current_activity
      - kind: action
        id: advance-activity
        when: worker_result.result_type == "activity_complete"
        actions:
          - action: set
            target: current_activity
            value: "{worker_result.next_activity_id}"
      - kind: action
        id: release-spent-worker
        when: worker_result.result_type == "activity_complete" && (!worker_result.batch_may_continue || !worker_result.next_activity_id)
        actions:
          - action: set
            target: worker_agent_id
            value: null
transitions:
  - to: end-workflow
    condition:
      type: simple
      variable: current_activity
      operator: ==
      value: null
outcome:
  - The client workflow has executed end to end with its artifacts committed and state persisted at every activity boundary
  - Each worker carried a bounded run of activities in one context, so the harness baseline was paid once a run rather than once an activity
  - The user retained control over every decision point — checkpoints surfaced to them and their selections steered the workflow
  - The client workflow has no further activities to run, so the meta can proceed to close it out
