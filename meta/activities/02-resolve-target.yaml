id: resolve-target
version: 4.7.0
name: Resolve Target
description: Detect the target repository structure (regular directory vs. submodule monorepo), resolve component_path, and confirm the session's host binding agrees with the derivation — headlessly, prompting only when a monorepo has more than one target-component submodule.
variables:
  reads:
    - component_path
    - host_repo_path
    - is_resuming
    - mentioned_repo
    - planning_folder_path
    - target_repo
  writes:
    - name: candidate_component
      type: object
      description: The submodule currently offered at the component-selection gate.
    - name: component_path
      type: string
      description: Path of the component being worked on, relative to the host repository — '.' for a regular repo, the submodule path for a monorepo.
      defaultValue: .
    - name: component_selection_needed
      type: boolean
      description: Whether more than one target-component submodule remains, so the user still has a component to pick.
      defaultValue: false
    - name: is_monorepo
      type: boolean
      description: Whether the target repository is a submodule monorepo (set by resolve-target)
      defaultValue: false
    - name: recommended_component_path
      type: string
      description: Path of the best-supported candidate submodule, from the context the request carries.
    - name: submodules
      type: array
      description: Target-component submodules of the host repository, each { path, name, url }.
      defaultValue: []
required: true
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Resolving target repository structure
  - kind: technique
    id: detect-monorepo
    technique: version-control::detect-repo-type
  - kind: technique
    id: list-submodules
    technique: version-control::list-submodules
    when: is_monorepo == true
  - kind: technique
    id: select-component
    technique: version-control::select-target-component
    when: is_monorepo == true
  - kind: loop
    id: component-selection
    name: Component Selection
    loopType: forEach
    variable: candidate_component
    over: submodules
    maxIterations: 25
    when: is_monorepo == true && component_selection_needed == true
    steps:
      - kind: checkpoint
        id: submodule-selection#{candidate_component.path}
        condition:
          type: simple
          variable: component_selection_needed
          operator: ==
          value: true
        message: "This monorepo holds more than one component submodule. Candidate: `{candidate_component.path}` — recommended `{recommended_component_path}`."
        blocking: true
        options:
          - id: submodule-chosen
            label: Work in this submodule
            description: The target component is the candidate named in the message
            effect:
              setVariable:
                component_path: "{candidate_component.path}"
                component_selection_needed: false
          - id: next-submodule
            label: Show the next submodule
            description: The target component is one of the submodules not yet offered
  - kind: action
    id: validate-component-selected
    when: is_monorepo == true
    actions:
      - action: validate
        target: component_selection_needed != true
        message: "No submodule was chosen at the selection gate, so `{component_path}` still names the host root. Re-enter resolve-target and choose one of the enumerated submodules."
  - kind: action
    id: validate-binding-agreement
    actions:
      - action: validate
        message: "`{host_repo_path}` MUST be the directory the server resolved for `{target_repo}`, and the one `{planning_folder_path}` sits under. On a disagreement, re-run host derivation from the intended checkout before continuing."
  - kind: action
    id: validate-resumed-binding
    when: is_resuming == true
    actions:
      - action: validate
        message: "The saved client session's repo root MUST name `{host_repo_path}`. On a disagreement, discard the saved binding and start a fresh session."
  - kind: action
    id: validate-git-tree
    actions:
      - action: validate
        message: "Confirm `{host_repo_path}/{component_path}` resolves to a directory containing a working git tree (`.git` file or directory present) before dispatching the client workflow"
exits:
  - id: done
    isDefault: true
outcome:
  - The orchestrator knows whether it is operating on a single repo or a submodule monorepo, and which submodule the user intends as the target — resolved without prompting except when a monorepo has multiple target components
  - Downstream git operations have a confirmed working git tree to act on, whether the repo root or a chosen submodule
  - A session bound to a directory that is not the derived host repository fails here, before any planning artifact exists
