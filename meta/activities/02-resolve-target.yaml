id: resolve-target
version: 4.4.0
name: Resolve Target
description: Detect the target repository structure (regular directory vs. submodule monorepo), resolve component_path, and confirm the session's host binding agrees with the derivation — headlessly, prompting only when a monorepo has more than one target-component submodule.
required: true
rules:
  - component_path is relative to host_repo_path, and their join MUST resolve to a directory containing a working git tree
  - Exclude infrastructure submodules per version-control::infrastructure-submodule-paths
steps:
  - kind: action
    id: announce-start
    actions:
      - action: log
        message: Resolving target repository structure
  - kind: technique
    id: detect-monorepo
    technique: version-control::detect-repo-type
  - kind: technique
    id: list-submodules
    technique: version-control::list-submodules
    when: is_monorepo == true
  - kind: technique
    id: select-component
    technique: version-control::select-target-component
    when: is_monorepo == true
  - kind: checkpoint
    id: submodule-selection
    condition:
      type: and
      conditions:
        - type: simple
          variable: is_monorepo
          operator: ==
          value: true
        - type: simple
          variable: component_selection_needed
          operator: ==
          value: true
    message: This monorepo has more than one component submodule. Select the target submodule; component_path is set to the chosen submodule path. Or cancel to re-list components.
    options:
      - id: submodule-chosen
        label: Submodule selected
        description: Proceed with the chosen submodule as component_path
        effect:
          setVariable:
            component_selection_needed: false
      - id: re-list
        label: Re-list components
        description: Cancel this selection and re-run component listing so a different submodule can be chosen
        effect:
          setVariable:
            component_selection_needed: true
          transitionTo: resolve-target
  - kind: action
    id: validate-binding-agreement
    actions:
      - action: validate
        message: Confirm the session's host binding agrees with the derivation before dispatching — `{host_repo_path}` MUST be the directory the server resolved for `{target_repo}`, the one `{planning_folder_path}` sits under, and on a resume the saved client `repo_root` MUST name that same directory. A disagreement means the binding is stale or the basename-only mapping resolved elsewhere; fail here, before any planning artifact is written, rather than at the first commit.
  - kind: action
    id: validate-git-tree
    actions:
      - action: validate
        message: Confirm `{host_repo_path}/{component_path}` resolves to a directory containing a working git tree (`.git` file or directory present) before dispatching the client workflow
transitions:
  - to: dispatch-client-workflow
    isDefault: true
outcome:
  - The orchestrator knows whether it is operating on a single repo or a submodule monorepo, and which submodule the user intends as the target — resolved without prompting except when a monorepo has multiple target components
  - Downstream git operations have a confirmed working git tree to act on, whether the repo root or a chosen submodule
  - A session bound to a directory that is not the derived host repository fails here, before any planning artifact exists
