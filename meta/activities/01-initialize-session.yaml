id: initialize-session
version: 6.5.0
name: Initialize Session
description: Bind the client planning slug for the run's mode, then dispatch the client workflow as a child of the meta session.
variables:
  reads:
    - component_path
    - host_repo_path
    - initiative_name
    - is_resuming
    - mentioned_repo
    - meta_session_index
    - planning_folder_path
    - saved_planning_slug
    - target_repo
    - target_workflow_id
  writes:
    - name: client_initial_activity
      type: string
      description: The client workflow's own first activity, returned by create-session — the id its first next_activity call names
    - name: client_planning_slug
      type: string
      description: Planning slug of the dispatched client workflow's planning folder — stable identifier the server uses to locate session.json
    - name: client_session_index
      type: string
      description: 6-character base32 session_index for the dispatched client workflow (returned by start_session when initialize-session creates or resumes the session)
    - name: planning_folder_path
      type: string
      description: Canonical absolute path to the client workflow's planning folder, as resolved by the server under its own workspace .engineering root.
required: true
steps:
  - kind: technique
    id: derive-planning-slug
    technique:
      name: version-control::initialize-folder
      outputs:
        planning_slug: client_planning_slug
    when: is_resuming == false
  - kind: action
    id: adopt-saved-planning-slug
    actions:
      - action: set
        target: client_planning_slug
        value: "{saved_planning_slug}"
        description: Carry the matched session's slug into the dispatch slug so the server targets the existing planning folder.
    when: is_resuming == true
  - kind: technique
    id: start-or-resume-session
    technique:
      name: workflow-engine::create-session
      inputs:
        parent_session_index: meta_session_index
        workflow_id: target_workflow_id
        planning_slug: client_planning_slug
        repo: target_repo
      outputs:
        session_index: client_session_index
        initial_activity: client_initial_activity
transitions:
  - to: resolve-target
    isDefault: true
outcome:
  - The work package has a stable, work-item-derived identity that the server reuses on every resume rather than a date-stamped fallback name
  - The client workflow is live as a child of the meta session — its orchestrator can be dispatched and its artifacts have a home
  - Every downstream activity has one authoritative, server-canonical absolute location to write and read work-package artifacts
  - A resumed session continues with all prior progress intact; a fresh session starts from a clean, schema-default state
