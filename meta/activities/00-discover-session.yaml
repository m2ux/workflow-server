id: discover-session
version: 7.6.0
name: Discover Session
description: Derive the host repository the session belongs to, identify the target workflow and, on stated resume intent, search for an existing client session to resume.
variables:
  reads:
    - component_path
    - host_repo_path
    - mentioned_repo
    - planning_folder_path
    - user_request
  writes:
    - name: component_hint
      type: string
      description: Basename of the component the session was opened inside.
    - name: has_saved_state
      type: boolean
      description: Whether discover-session matched a saved client session for the request
      defaultValue: false
    - name: host_binding_mismatch
      type: boolean
      description: Whether the derived host repository's basename disagrees with the repository segment of target_repo.
      defaultValue: false
    - name: host_repo_path
      type: string
      description: Absolute path to the host repository the session belongs to.
    - name: initiative_name
      type: string
      description: Kebab-case name for the work this session opens, from the words the request uses for it.
    - name: is_resuming
      type: boolean
      description: Whether the user chose to resume the matched saved session
      defaultValue: false
    - name: mentioned_repo
      type: string
      description: Repository named in the user's request, such as the owner/repo of a PR or issue URL.
    - name: resume_intent_requested
      type: boolean
      description: Whether the user's request states intent to resume or continue prior work
      defaultValue: false
    - name: saved_planning_slug
      type: string
      description: Planning slug of the matched saved client session.
    - name: target_repo
      type: string
      description: Target GitHub owner/repo for this run.
    - name: target_workflow_id
      type: string
      description: ID of the client workflow to dispatch (set by discover-session)
    - name: workflow_match_ambiguous
      type: boolean
      description: Whether the user request matched multiple workflows — gates the workflow-selection checkpoint in discover-session
      defaultValue: false
required: true
steps:
  - kind: technique
    id: resolve-host-repo
    technique: version-control::resolve-host-repo
  - kind: checkpoint
    id: host-binding-mismatch
    condition:
      type: simple
      variable: host_binding_mismatch
      operator: ==
      value: true
    message: The host repository on disk disagrees with the repository its origin remote names. The server maps a repository onto a filesystem root by basename alone, so it cannot represent this divergence — binding anyway resolves to a directory that is not the checkout you are in, which is how a session ends up with an empty non-git working directory.
    blocking: true
    options:
      - id: confirm-binding
        label: Proceed with the derived binding
        description: The divergence is understood and the checkout is reachable under the mapped basename.
        effect:
          setVariable:
            host_binding_mismatch: false
      - id: abort-binding
        label: Stop and fix the workspace
        description: Leave the client session unbound, so no planning folder is created against a directory that is not the checkout.
        effect:
          exit: abort-binding
  - kind: technique
    id: list-available-workflows
    technique: workflow-engine::list-workflows
  - kind: technique
    id: match-target
    technique:
      name: workflow-engine::match-target-workflow
      outputs:
        match_ambiguous: workflow_match_ambiguous
  - kind: checkpoint
    id: workflow-selection
    condition:
      type: simple
      variable: workflow_match_ambiguous
      operator: ==
      value: true
    message: Multiple workflows could match the request. Select the intended target workflow.
    options:
      - id: confirm-target
        label: Confirm matched workflow
        description: Proceed with the workflow surfaced above as target_workflow_id
        effect:
          setVariable:
            workflow_match_ambiguous: false
      - id: choose-different
        label: Choose a different workflow
        description: Re-prompt for the target workflow from the catalog
        effect:
          setVariable:
            workflow_match_ambiguous: false
  - kind: technique
    id: detect-resume-intent
    technique: workflow-engine::detect-resume-intent
  - kind: technique
    id: extract-context
    technique: workflow-engine::extract-identifying-context
  - kind: technique
    id: name-initiative
    technique: workflow-engine::derive-initiative-name
  - kind: technique
    id: scan-planning-folders
    technique: workflow-engine::scan-saved-sessions
    when: resume_intent_requested == true
  - kind: technique
    id: match-session
    technique: workflow-engine::match-saved-session
    when: resume_intent_requested == true
  - kind: action
    id: record-match
    condition:
      type: simple
      variable: matched_session
      operator: exists
    actions:
      - action: set
        target: has_saved_state
        value: true
      - action: set
        target: saved_planning_slug
        value: "{matched_session.planning_slug}"
  - kind: checkpoint
    id: resume-session
    condition:
      type: simple
      variable: has_saved_state
      operator: ==
      value: true
    message: A previous session matching this request was found.
    options:
      - id: resume
        label: Resume previous session
        description: Continue from the saved state with all prior progress preserved
        effect:
          setVariable:
            is_resuming: true
      - id: fresh
        label: Start fresh
        description: Ignore the saved session and begin a new client session
        effect:
          setVariable:
            is_resuming: false
            has_saved_state: false
  - kind: action
    id: record-no-match
    condition:
      type: simple
      variable: matched_session
      operator: notExists
    actions:
      - action: set
        target: has_saved_state
        value: false
exits:
  - id: done
    isDefault: true
  - id: abort-binding
    immediate: true
outcome:
  - Host repository derived from git, with a basename divergence the server's mapping cannot represent raised as an explicit decision
  - Target workflow identified (and confirmed by user if ambiguous)
  - The work carries one name taken from its own words, so the planning folder a fresh run creates is the folder a later resume looks for
  - A repository the request names is held as component context on every run, so the component under work is identifiable whether or not prior work is resumed
  - Saved session matched and resume decision captured whenever the request states resume intent
