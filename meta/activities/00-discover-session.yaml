id: discover-session
version: 7.4.0
name: Discover Session
description: Derive the host repository the session belongs to, identify the target workflow and, on stated resume intent, search for an existing client session to resume.
required: true
steps:
  - kind: technique
    id: resolve-host-repo
    technique: version-control::resolve-host-repo
  - kind: checkpoint
    id: host-binding-mismatch
    condition:
      type: simple
      variable: host_binding_mismatch
      operator: ==
      value: true
    message: The host repository on disk disagrees with the repository its origin remote names. The server maps a repository onto a filesystem root by basename alone, so it cannot represent this divergence — binding anyway resolves to a directory that is not the checkout you are in, which is how a session ends up with an empty non-git working directory.
    blocking: true
    options:
      - id: confirm-binding
        label: Proceed with the derived binding
        description: The divergence is understood and the checkout is reachable under the mapped basename.
        effect:
          setVariable:
            host_binding_mismatch: false
      - id: abort-binding
        label: Stop and fix the workspace
        description: Leave the client session unbound, so no planning folder is created against a directory that is not the checkout.
        effect:
          transitionTo: end-workflow
  - kind: technique
    id: list-available-workflows
    technique: workflow-engine::list-workflows
  - kind: technique
    id: match-target
    technique:
      name: workflow-engine::match-target-workflow
      outputs:
        match_ambiguous: workflow_match_ambiguous
  - kind: checkpoint
    id: workflow-selection
    condition:
      type: simple
      variable: workflow_match_ambiguous
      operator: ==
      value: true
    message: Multiple workflows could match the request. Select the intended target workflow.
    options:
      - id: confirm-target
        label: Confirm matched workflow
        description: Proceed with the workflow surfaced above as target_workflow_id
        effect:
          setVariable:
            workflow_match_ambiguous: false
      - id: choose-different
        label: Choose a different workflow
        description: Re-prompt for the target workflow from the catalog
        effect:
          setVariable:
            workflow_match_ambiguous: false
  - kind: technique
    id: detect-resume-intent
    technique: workflow-engine::detect-resume-intent
  - kind: technique
    id: extract-context
    technique: workflow-engine::extract-identifying-context
    when: resume_intent_requested == true
  - kind: technique
    id: scan-planning-folders
    technique: workflow-engine::scan-saved-sessions
    when: resume_intent_requested == true
  - kind: technique
    id: match-session
    technique: workflow-engine::match-saved-session
    when: resume_intent_requested == true
  - kind: action
    id: record-match
    condition:
      type: simple
      variable: matched_session
      operator: exists
    actions:
      - action: set
        target: has_saved_state
        value: true
      - action: set
        target: saved_planning_slug
        value: "{matched_session.planning_slug}"
  - kind: checkpoint
    id: resume-session
    condition:
      type: simple
      variable: has_saved_state
      operator: ==
      value: true
    message: A previous session matching this request was found.
    options:
      - id: resume
        label: Resume previous session
        description: Continue from the saved state with all prior progress preserved
        effect:
          setVariable:
            is_resuming: true
      - id: fresh
        label: Start fresh
        description: Ignore the saved session and begin a new client session
        effect:
          setVariable:
            is_resuming: false
            has_saved_state: false
  - kind: action
    id: record-no-match
    condition:
      type: simple
      variable: matched_session
      operator: notExists
    actions:
      - action: set
        target: has_saved_state
        value: false
transitions:
  - to: initialize-session
    isDefault: true
outcome:
  - Host repository derived from git, with a basename divergence the server's mapping cannot represent raised as an explicit decision
  - Target workflow identified (and confirmed by user if ambiguous)
  - Saved session matched and resume decision captured on stated resume intent; no search performed otherwise
