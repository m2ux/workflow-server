id: isolated-fan-out
version: 2.0.0
name: Isolated Fan Out
description: Orchestrator-workers fan-out with isolation_mode (context or worktree) and completeness verification — borrowable subagent-isolation pattern.
variables:
  reads:
    - effort_cap
    - isolation_mode
    - output_contract
    - planning_context
    - planning_folder_path
    - session_index
    - synthesis_criteria
    - work_goal
  writes:
    - name: work_units
      type: array
      description: Ordered work units the goal decomposed into, each { id, brief, tools_hint? }.
    - name: worker_briefs
      type: array
      description: Ordered dispatch-ready briefs, each { id, description, prompt }.
    - name: dispatched_results
      type: array
      description: Per-worker returns in brief order, each { id, result }.
    - name: gathered_results
      type: object
      description: Ordered keyed collection of worker returns with its dispatch manifest and completeness verdict.
    - name: combined_synthesis
      type: string
      description: The single result the gathered returns were combined into under the caller's criteria.
required: false
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: decompose
    technique: orchestration-patterns::decompose-work-units
  - kind: technique
    id: compose-briefs
    technique:
      name: orchestration-patterns::compose-worker-briefs
      inputs:
        isolation_mode: isolation_mode
  - kind: technique
    id: dispatch
    technique: orchestration-patterns::dispatch-workers
  - kind: technique
    id: gather
    technique:
      name: orchestration-patterns::gather-results
      inputs:
        expected_ids: work_units
  - kind: action
    id: require-complete
    actions:
      - action: validate
        target: gathered_results.completeness
        message: "Dispatch incompleteness — gathered_results.completeness must be complete before synthesis. Re-dispatch missing workers."
  - kind: technique
    id: synthesise
    technique: orchestration-patterns::synthesise-results
outcome:
  - Workers ran under the seeded isolation_mode
  - Gather manifest is complete before synthesis
  - Combined synthesis is in the bag
