id: orchestrator-workers
version: 1.0.0
name: Orchestrator Workers
description: Runtime-decompose a goal into work units, dispatch workers, gather ordered results, and synthesise — borrowable mid-phase orchestrator-workers pattern.
variables:
  reads:
    - dispatch_concurrency
    - effort_cap
    - output_contract
    - planning_context
    - planning_folder_path
    - session_index
    - synthesis_criteria
    - work_goal
  writes:
    - name: work_units
      type: array
      description: Ordered work units the goal decomposed into, each { id, brief, tools_hint? }.
    - name: worker_briefs
      type: array
      description: Ordered dispatch-ready briefs, each { id, description, prompt }.
    - name: dispatched_results
      type: array
      description: Per-worker returns in brief order, each { id, result }.
    - name: gathered_results
      type: object
      description: Ordered keyed collection of worker returns with its dispatch manifest and completeness verdict.
    - name: combined_synthesis
      type: string
      description: The single result the gathered returns were combined into under the caller's criteria.
required: false
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: decompose
    technique: orchestration-patterns::decompose-work-units
  - kind: technique
    id: compose-briefs
    technique: orchestration-patterns::compose-worker-briefs
  - kind: technique
    id: dispatch
    technique: orchestration-patterns::dispatch-workers
  - kind: technique
    id: gather
    technique:
      name: orchestration-patterns::gather-results
      inputs:
        expected_ids: work_units
  - kind: technique
    id: synthesise
    technique: orchestration-patterns::synthesise-results
outcome:
  - Goal decomposed into work units whose count and shape depend on the input
  - Workers executed from self-contained briefs only
  - Ordered gathered results and a single synthesis are in the bag
