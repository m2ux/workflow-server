id: lead-researcher
version: 2.0.0
name: Lead Researcher
description: Plan research questions, work through them, synthesise, and follow up while gaps remain — borrowable lead-researcher pattern.
variables:
  reads:
    - effort_cap
    - output_contract
    - planning_context
    - planning_folder_path
    - session_index
    - synthesis_criteria
    - work_goal
  writes:
    - name: work_units
      type: array
      description: Ordered research questions as work units, each { id, brief, tools_hint? }.
    - name: worker_briefs
      type: array
      description: Ordered dispatch-ready briefs, each { id, description, prompt }.
    - name: dispatched_results
      type: array
      description: Per-worker returns in brief order, each { id, result }.
    - name: gathered_results
      type: object
      description: Ordered keyed collection of worker returns with its dispatch manifest and completeness verdict.
    - name: combined_synthesis
      type: string
      description: The single result the gathered returns were combined into under the caller's criteria.
    - name: has_research_gaps
      type: boolean
      description: Whether material gaps remain against the goal after the current synthesis.
      defaultValue: false
required: false
techniques:
  - scatter-gather
steps:
  - kind: technique
    id: plan-questions
    technique: orchestration-patterns::plan-research-questions
  - kind: technique
    id: compose-briefs
    technique: orchestration-patterns::compose-worker-briefs
  - kind: technique
    id: dispatch
    technique: orchestration-patterns::dispatch-workers
  - kind: technique
    id: gather
    technique:
      name: orchestration-patterns::gather-results
      inputs:
        expected_ids: work_units
  - kind: technique
    id: synthesise
    technique: orchestration-patterns::synthesise-results
  - kind: technique
    id: assess-gaps
    technique: orchestration-patterns::assess-research-gaps
  - kind: loop
    id: gap-followup
    name: Research Gap Follow-up
    loopType: while
    maxIterations: 3
    continueWhile:
      type: simple
      variable: has_research_gaps
      operator: "=="
      value: true
    steps:
      - kind: technique
        id: compose-followup-briefs
        technique: orchestration-patterns::compose-worker-briefs
      - kind: technique
        id: dispatch-followup
        technique: orchestration-patterns::dispatch-workers
      - kind: technique
        id: gather-followup
        technique:
          name: orchestration-patterns::gather-results
          inputs:
            expected_ids: work_units
      - kind: technique
        id: synthesise-followup
        technique: orchestration-patterns::synthesise-results
      - kind: technique
        id: reassess-gaps
        technique: orchestration-patterns::assess-research-gaps
outcome:
  - Breadth-first research questions planned and fanned out
  - Synthesis updated after each round
  - Follow-up rounds stop when gaps are closed or the loop cap is hit
