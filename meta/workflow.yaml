$schema: ../../schemas/workflow.schema.json
id: meta
version: 5.12.0
title: Meta Workflow
description: Top-level lifecycle workflow that orchestrates client workflow sessions. Excluded from list_workflows — bootstrap navigates here directly.
author: m2ux
tags:
  - meta
  - bootstrap
  - lifecycle
  - dispatch
  - session
techniques:
  workflow:
    - workflow-engine::start-session
    - workflow-engine::handle-sub-workflow
    - workflow-engine::dispatch-activity
    - workflow-engine::workflow-orchestrator
    - agent-conduct::orchestrator
  activity:
    - variable-binding
    - workflow-engine::activity-worker
initialActivity: discover-session
rules:
  workflow:
    - "This workflow is the entrypoint for all workflow operations — bootstrap protocol enters here directly via start_session({ workflow_id: 'meta' })"
    - Techniques in this workflow are universal and resolve for any client workflow via the loader's universal-technique fallback
variables:
  - name: user_request
    type: string
    description: The user's free-form request that opened this session.
  - name: target_workflow_id
    type: string
    description: ID of the client workflow to dispatch (set by discover-session)
  - name: meta_session_index
    type: string
    description: 6-character base32 session_index of the meta session itself — read by initialize-session and passed as parent_session_index when create-session creates the client session
  - name: target_repo
    type: string
    description: Target GitHub owner/repo for this run, derived from the host repository's origin remote by version-control::resolve-host-repo. Workspace AGENTS.md/CLAUDE.md or the user supply it only as the fallback for a workspace that is not a git repo or has no origin remote
  - name: host_repo_path
    type: string
    description: Absolute path to the host repository the session belongs to — the outermost superproject that claims the workspace checkout as a submodule, or the workspace toplevel itself when nothing claims it. Set by version-control::resolve-host-repo
  - name: is_monorepo_host
    type: boolean
    description: Whether the resolved host repository contains the workspace checkout as a submodule, meaning the session was opened inside a component of a larger superproject. Set by version-control::resolve-host-repo
    defaultValue: false
  - name: component_hint
    type: string
    description: Basename of the innermost git toplevel when resolve-host-repo ascended to reach the host — the component the user is already working inside, read by select-target-component for pre-selection. Absent when no ascent happened
  - name: mentioned_repo
    type: string
    description: Repository named in the user's request, such as the owner/repo of a PR or issue URL. Set by workflow-engine::extract-identifying-context and read by select-target-component as component context only — it never binds the session, per version-control::host-is-derived-component-is-named
  - name: host_binding_mismatch
    type: boolean
    description: Whether the derived host repository's basename disagrees with the repository segment of target_repo. The server's multi-root mapping is basename-only and cannot represent the divergence, so this gates the host-binding-mismatch checkpoint in discover-session rather than binding silently
    defaultValue: false
  - name: target_workflow_outcomes
    type: string
    description: The client workflow's declared outcomes, read by verify-outcomes during end-workflow close-out
  - name: client_state
    type: string
    description: The dispatched client workflow's final variable state, read by verify-outcomes during end-workflow
  - name: client_trace
    type: string
    description: The dispatched client workflow's execution trace, read by generate-summary during end-workflow
  - name: workflow_match_ambiguous
    type: boolean
    description: Whether the user request matched multiple workflows — gates the workflow-selection checkpoint in discover-session
    defaultValue: false
  - name: resume_intent_requested
    type: boolean
    description: Whether the user's request states intent to resume or continue prior work
    defaultValue: false
  - name: has_saved_state
    type: boolean
    description: Whether discover-session matched a saved client session for the request
    defaultValue: false
  - name: saved_planning_slug
    type: string
    description: Planning slug of the matched saved client session.
  - name: is_resuming
    type: boolean
    description: Whether the user chose to resume the matched saved session
    defaultValue: false
  - name: planning_folder_path
    type: string
    description: Canonical absolute path to the client workflow's planning folder, as resolved by the server under its own workspace .engineering root. Returned by create-session/dispatch_child (and start_session on resume); the single location for planning artifacts, never composed by the agent or anchored to component_path/CWD
  - name: client_session_index
    type: string
    description: 6-character base32 session_index for the dispatched client workflow (returned by start_session when initialize-session creates or resumes the session)
  - name: client_planning_slug
    type: string
    description: Planning slug of the dispatched client workflow's planning folder — stable identifier the server uses to locate session.json
  - name: is_monorepo
    type: boolean
    description: Whether the target repository is a submodule monorepo (set by resolve-target)
    defaultValue: false
  - name: component_path
    type: string
    description: Path of the component being worked on, relative to the host repository — '.' for a regular repo, the submodule path for a monorepo. Distinct from the client workflow's own target_path, which is a feature worktree for edits
    defaultValue: .
  - name: component_selection_needed
    type: boolean
    description: Whether the monorepo has more than one target-component submodule (after excluding infrastructure submodules per version-control::infrastructure-submodule-paths), requiring the user to pick. Set by resolve-target's select-target-component step; gates the submodule-selection checkpoint so a single-component monorepo resolves headlessly.
    defaultValue: false
  - name: client_workflow_completed
    type: boolean
    description: Whether the dispatched client workflow has reached workflow_complete
    defaultValue: false
  - name: abort_completion
    type: boolean
    description: Whether the user chose to return to dispatch from end-workflow instead of closing
    defaultValue: false
