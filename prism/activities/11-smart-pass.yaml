id: smart-pass
version: 1.3.0
name: Smart Analysis Pass
description: Adaptively compose the analysis pipeline based on input characteristics.
variables:
  reads:
    - analysis_focus
    - target
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
    - name: smart_pipeline_steps
      type: array
      description: "For smart mode: steps the adaptive engine decided to execute"
steps:
  - kind: technique
    id: run-prereq
    technique:
      name: smart-analysis::prereq-scan
      inputs:
        target_content: "{target}"
  - kind: technique
    id: fill-knowledge
    required: false
    technique:
      name: smart-analysis::knowledge-fill
      inputs:
        target_content: "{target}"
  - kind: technique
    id: select-analysis-mode
    technique:
      name: smart-analysis::select-mode
      inputs:
        target_content: "{target}"
  - kind: technique
    id: run-analysis
    technique:
      name: smart-analysis::run-analysis
      inputs:
        target_content: "{target}"
  - kind: technique
    id: run-dispute
    required: false
    technique:
      name: smart-analysis::dispute-correction
      inputs:
        target_content: "{target}"
  - kind: action
    id: collect-paths
    actions:
      - action: set
        target: all_artifact_paths
        description: Accumulated artifact paths across the run.
transitions:
  - to: generate-report
    isDefault: true
