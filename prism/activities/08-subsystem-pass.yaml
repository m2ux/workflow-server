id: subsystem-pass
version: 1.3.0
name: Subsystem Analysis Pass
description: Per-region prism analysis with cross-subsystem synthesis.
variables:
  reads:
    - target
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
    - name: subsystem_assignments
      type: object
      description: "For subsystem mode: map of {subsystem_name: prism_name} from calibration"
    - name: subsystem_outputs
      type: array
      description: "For subsystem mode: per-subsystem analysis output objects"
steps:
  - kind: technique
    id: split-subsystems
    technique:
      name: subsystem-analysis::decompose
      inputs:
        target_content: "{target}"
  - kind: technique
    id: calibrate-assignments
    technique:
      name: subsystem-analysis::calibrate
      inputs:
        target_content: "{target}"
  - kind: technique
    id: execute-per-subsystem
    technique:
      name: subsystem-analysis::execute
      inputs:
        target_content: "{target}"
  - kind: technique
    id: synthesize-cross-subsystem
    technique:
      name: subsystem-analysis::synthesize
      inputs:
        target_content: "{target}"
  - kind: action
    id: collect-paths
    actions:
      - action: set
        target: all_artifact_paths
        description: Accumulated artifact paths across the run.
transitions:
  - to: generate-report
    isDefault: true
