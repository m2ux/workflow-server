id: reflect-pass
version: 1.3.0
name: Reflect Analysis Pass
description: L12 structural analysis with recursive meta-analysis and constraint synthesis.
variables:
  reads:
    - target
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
steps:
  - kind: technique
    id: run-reflect
    technique:
      name: reflect-analysis
      inputs:
        target_content: "{target}"
  - kind: action
    id: collect-paths
    actions:
      - action: set
        target: all_artifact_paths
        description: Accumulated artifact paths across the run.
transitions:
  - to: generate-report
    isDefault: true
