id: behavioral-synthesis-pass
version: 1.4.0
name: Behavioral Synthesis Pass
description: Run the behavioral synthesis lens against each behavioral unit's artifacts.
variables:
  reads:
    - analysis_units
    - behavioral_output_paths
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
    - name: current_unit
      type: object
      description: Current analysis unit during iteration loop
techniques:
  - scatter-gather
steps:
  - kind: loop
    id: behavioral-synthesis-unit-cycle
    name: Behavioral Synthesis Unit Cycle
    loopType: forEach
    variable: current_unit
    over: analysis_units
    maxIterations: 100
    steps:
      - kind: technique
        id: run-behavioral-synthesis
        technique:
          name: behavioral-pipeline::synthesis
          inputs:
            target_content: "{current_unit.target}"
            prior_artifact_paths: behavioral_output_paths
        actions:
          - action: set
            target: all_artifact_paths
            description: Accumulated artifact paths across units.
        when: current_unit.pipeline_mode == 'behavioral'
exits:
  - id: done
    isDefault: true
