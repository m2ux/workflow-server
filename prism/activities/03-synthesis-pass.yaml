id: synthesis-pass
version: 2.4.0
name: Synthesis Pass
description: Run the synthesis lens against each full-prism unit's structural and adversarial artifacts.
variables:
  reads:
    - all_artifact_paths
    - analysis_units
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
    - name: current_unit
      type: object
      description: Current analysis unit during iteration loop
techniques:
  - scatter-gather
steps:
  - kind: loop
    id: synthesis-unit-cycle
    name: Synthesis Unit Cycle
    loopType: forEach
    variable: current_unit
    over: analysis_units
    maxIterations: 100
    steps:
      - kind: technique
        id: run-synthesis
        technique:
          name: full-prism::synthesis
          inputs:
            target_content: "{current_unit.target}"
            prior_artifact_paths: all_artifact_paths
        actions:
          - action: set
            target: all_artifact_paths
            description: Accumulated artifact paths across units.
        when: current_unit.pipeline_mode == 'full-prism'
transitions:
  - to: generate-report
    isDefault: true
