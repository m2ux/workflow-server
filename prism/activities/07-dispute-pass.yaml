id: dispute-pass
version: 1.3.0
name: Dispute Analysis Pass
description: Run two orthogonal prisms and synthesize their disagreements.
variables:
  reads:
    - target
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
steps:
  - kind: technique
    id: run-dispute
    technique:
      name: dispute-analysis
      inputs:
        target_content: "{target}"
  - kind: action
    id: collect-paths
    actions:
      - action: set
        target: all_artifact_paths
        description: Accumulated artifact paths across the run.
exits:
  - id: done
    isDefault: true
