id: structural-pass
version: 2.4.0
name: Structural Analysis Pass
description: Run the assigned structural analysis for each analysis unit.
variables:
  reads:
    - analysis_units
    - lens_name
    - pipeline_mode
  writes:
    - name: all_artifact_paths
      type: array
      description: Accumulated list of all artifact paths across all units
    - name: behavioral_output_paths
      type: object
      description: Map of role label (ERRORS, COSTS, CHANGES, PROMISES) to file path for behavioral mode artifacts
    - name: current_unit
      type: object
      description: Current analysis unit during iteration loop
    - name: gitnexus_available
      type: boolean
      description: Whether GitNexus has indexed the target codebase — set during structural-pass check-gitnexus step
      defaultValue: false
    - name: unit_output_dir
      type: string
      description: Resolved output directory for the current analysis unit — computed in structural-pass resolve-unit-output step
techniques:
  - scatter-gather
steps:
  - kind: loop
    id: unit-cycle
    name: Analysis Unit Cycle
    loopType: forEach
    variable: current_unit
    over: analysis_units
    maxIterations: 100
    steps:
      - kind: action
        id: resolve-unit-output
        actions:
          - action: set
            target: unit_output_dir
            description: "{output_path}/{current_unit.unit_output_subdir} when a subdir is present, else {output_path}."
      - kind: technique
        id: check-gitnexus
        technique: gitnexus-operations::verify-index
        actions:
          - action: set
            target: gitnexus_available
            description: Whether the target codebase is indexed.
      - kind: technique
        id: run-structural
        technique:
          name: structural-analysis
          inputs:
            target_content: "{current_unit.target}"
        when: (current_unit.pipeline_mode == "single" && current_unit.lens_name == "l12") || current_unit.pipeline_mode == "full-prism"
      - kind: technique
        id: run-single-lens
        technique:
          name: single-lens-analysis
          inputs:
            lens_name: "{current_unit.lens_name}"
            target_content: "{current_unit.target}"
        when: current_unit.pipeline_mode == 'single' && current_unit.lens_name != 'l12'
      - kind: technique
        id: run-portfolio
        technique:
          name: portfolio-analysis
          inputs:
            target_content: "{current_unit.target}"
            selected_lenses: current_unit.lenses
        when: current_unit.pipeline_mode == 'portfolio'
      - kind: technique
        id: dispatch-behavioral-lenses
        technique:
          name: behavioral-pipeline::independent-lenses
          inputs:
            target_content: "{current_unit.target}"
        when: current_unit.pipeline_mode == 'behavioral'
      - kind: action
        id: collect-behavioral-paths
        actions:
          - action: set
            target: behavioral_output_paths
            description: Map of role label to behavioral artifact path.
      - kind: action
        id: report-unit-paths
        actions:
          - action: set
            target: all_artifact_paths
            description: Accumulated artifact paths across units.
transitions:
  - to: adversarial-pass
    condition:
      type: simple
      variable: pipeline_mode
      operator: ==
      value: full-prism
  - to: behavioral-synthesis-pass
    condition:
      type: simple
      variable: pipeline_mode
      operator: ==
      value: behavioral
  - to: generate-report
    isDefault: true
