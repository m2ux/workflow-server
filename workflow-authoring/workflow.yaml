$schema: ../../schemas/workflow.schema.json
id: workflow-authoring
version: 1.5.0
title: Workflow Authoring Workflow
description: Guide agents through creating, updating, or reviewing workflow definitions.
author: m2ux
tags:
  - workflow-creation
  - workflow-review
  - workflow-authoring
  - schema-validation
  - design-principles
  - elicitation
  - conventions
rules:
  activity:
    - >-
      A definition is authored against the schema its kind selects, and a construct the schema offers is used in preference to prose that describes it.
techniques:
  activity:
    - variable-binding
variables:
  - name: headless_mode
    type: boolean
    description: Whether the run resolves a soft mid-flow gate to its default without reaching a person. Read by the agent that resolves a gate, per meta workflow-engine::present-checkpoint-to-user.
    defaultValue: true
  - name: scope_manifest
    type: array
    description: List of files to create, modify or remove with full paths and actions.
  - name: current_file
    type: object
    description: The file currently being drafted.
  - name: verified_findings
    type: array
    description: Findings whose claims survived independent re-derivation.
initialActivity: intake-and-context
graph:
  intake-and-context:
    review-scope-declined: __terminal__
    review-scope-confirmed: quality-review
    authoring: scope-and-draft
  scope-and-draft:
    done: quality-review
    revise: scope-and-draft
  quality-review:
    done: validate-and-commit
  validate-and-commit:
    remediation-selected: quality-review
    committed: __terminal__
    fix-issues: intake-and-context
    return-to-draft: scope-and-draft
