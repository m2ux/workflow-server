$schema: ../../schemas/workflow.schema.json
id: workflow-authoring
version: 1.3.0
title: Workflow Authoring Workflow
description: Guide agents through creating, updating, or reviewing workflow definitions.
author: m2ux
tags:
  - workflow-creation
  - workflow-review
  - workflow-authoring
  - schema-validation
  - design-principles
  - elicitation
  - conventions
rules:
  activity:
    - >-
      A correction the user makes at a gate is recorded against the fact it corrects, and every later gate is answered from the corrected value — never from the value it superseded.
    - >-
      A checkpoint that declares neither `defaultOption` nor `autoAdvanceMs` requires a user response and must never be answered on the user's behalf. When `{headless_mode}` is true, a checkpoint declaring both resolves to its `defaultOption` without presentation.
techniques:
  activity:
    - variable-binding
variables:
  - name: scope_manifest
    type: array
    description: List of files to create, modify or remove with full paths and actions.
  - name: current_file
    type: object
    description: The file currently being drafted.
  - name: verified_findings
    type: array
    description: Findings whose claims survived independent re-derivation.
initialActivity: intake-and-context
graph:
  intake-and-context:
    review-scope-declined: __terminal__
    review-scope-confirmed: quality-review
    authoring: scope-and-draft
  scope-and-draft:
    done: quality-review
    revise: scope-and-draft
  quality-review:
    done: validate-and-commit
  validate-and-commit:
    remediation-selected: quality-review
    committed: __terminal__
    fix-issues: intake-and-context
    return-to-draft: scope-and-draft
