id: quality-review
version: 1.1.0
name: Quality Review
description: "Criteria walk with field-level coverage evidence per target, consumer-surface reach, and definition guards as a separate mechanical net."
required: true
steps:
  - kind: technique
    id: author-fixes
    technique:
      name: workflow-definition::yaml-authoring
      inputs:
        selected_findings: verified_findings
    when: remediation_round > 0
  - kind: technique
    id: record-fixes
    technique:
      name: workflow-definition::apply-audit-fixes
      inputs:
        selected_findings: verified_findings
    when: remediation_round > 0
  - kind: technique
    id: load-known-findings
    technique: workflow-definition::load-known-findings
  - kind: technique
    id: survey-reference-workflows
    technique:
      name: workflow-engine::list-workflows
      outputs:
        workflow_catalog: reference_workflows
  - kind: loop
    id: target-sweep-loop
    name: Target Sweep Loop
    loopType: forEach
    variable: target_workflow_id
    over: target_workflow_ids
    maxIterations: 20
    steps:
      - kind: technique
        id: rebind-target-baseline
        technique: workflow-definition::reload-workflow
      - kind: technique
        id: resolve-consumer-surface
        technique: workflow-definition::resolve-consumer-surface
      - kind: technique
        id: inventory-prose-fields
        technique: workflow-definition::inventory-prose-fields
      - kind: technique
        id: sweep-canon
        technique: workflow-definition::audit-canon
      - kind: technique
        id: validate-schema
        technique: workflow-definition::audit-schema-validation
        actions:
          - action: set
            target: register_sections
            message: "This target's register section appended to the sections already gathered: `{target_workflow_id}` with `{audit_findings}`, `{coverage_ledger}` (divergences and evidence), `{fail_count}`, and change-surface membership `{touched_files}`, `{changed_files}`, `{consumer_surface}` (whole-file paths and consumer entries for this target only). Appends; never replaces a prior target's section."
transitions:
  - to: validate-and-commit
    isDefault: true
outcome:
  - Every criteria home is walked once per target against the working tree, so a finding is attributed to this change rather than to the catalogue it came from
  - The change surface is whole touched files closed under I/O-contract referencers, so Detect is never limited to diff hunks and silent bind sites still join the walk
  - Each target's change-surface membership is packed into `{register_sections}` at sweep time, so the register rollup does not depend on the last loop iteration's bag
  - A violation reachable only through another workflow's reference into the target is reachable, because the consumer surface is part of what the walk covers
  - Every enumeration unit the walk could not apply is recorded with the reason, so absent coverage is visible rather than indistinguishable from a clean result
  - Walked units that reach the change surface carry field-level evidence on each whole file, so a narrative "walked" claim without Detect is a coverage gap
  - The definition guards run against the tree this run edits as a mechanical net separate from canon coverage
