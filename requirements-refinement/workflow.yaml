$schema: ../../schemas/workflow.schema.json
id: requirements-refinement
version: 1.5.0
title: Requirements Refinement Workflow
description: Refine a canonical requirements specification from a set of source documents — meeting transcripts and unstructured documents — preserving the specification protocol verbatim and staging the finalized specification and a change summary in the planning folder for human promotion. Operates on local files and performs no version-control operations.
author: m2ux
tags:
  - requirements
  - specification
  - source-document
  - document-automation
  - validation
  - iterative-refinement
rules:
  universal:
    - Newly added requirements are created with status pending; changing a requirement's status requires explicit user confirmation.
    - Confirm the requirements analysis with the user before applying any changes to the specification.
techniques:
  activity:
    - variable-binding
variables:
  - name: source_paths
    type: array
    description: Filesystem paths of the local source documents being processed, each a meeting transcript or an unstructured document. A single-document run carries one entry.
    required: true
  - name: target_doc_path
    type: string
    description: Filesystem path to the canonical requirements specification being augmented or created
    required: true
initialActivity: intake-and-analyze
graph:
  intake-and-analyze:
    analysis-confirmed: update-specification
    revise: intake-and-analyze
    source-unreadable: __terminal__
  update-specification:
    done: validate-specification
  validate-specification:
    validation-passed: finalize-specification
    correctable: update-specification
    uncorrectable: report-failure
  finalize-specification:
    accepted: __terminal__
    revision-requested: update-specification
