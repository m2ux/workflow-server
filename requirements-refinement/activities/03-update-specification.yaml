id: update-specification
version: 1.3.0
name: Update Specification
description: Apply the requirements analysis (initial pass) or the validation findings (correction pass) to produce the complete updated specification, preserving the specification protocol verbatim, and write it as a versioned working specification.
required: true
steps:
  - kind: technique
    id: update-specification
    technique: update-specification
    actions:
      - action: message
        message: "The working specification from pass {correction_iteration} carries every confirmed change with the protocol preserved ([updated specification]({working_specification_path}))."
transitions:
  - to: validate-specification
    isDefault: true
outcome:
  - The full specification now reflects every confirmed change with its protocol intact, ready for validation to judge against
