id: finalize-specification
version: 1.6.0
name: Finalize Specification
description: Assemble the validation-passed specification and a human-readable change summary as planning-folder artifacts, and confirm the user accepts them for promotion to the canonical location.
variables:
  reads:
    - source_path
    - spec_basename
    - target_doc_path
  writes:
    - name: change_summary_path
      type: string
      description: Absolute path to the written change summary
      defaultValue: ""
    - name: final_specification_path
      type: string
      description: Absolute path to the staged final specification
      defaultValue: ""
    - name: finalization_accepted
      type: boolean
      description: Whether the user endorsed the staged specification and change summary for promotion.
      defaultValue: false
required: true
steps:
  - kind: technique
    id: finalize-specification
    technique: finalize-specification
    actions:
      - action: message
        message: "The validation-passed specification and an account of every applied change are staged in the planning folder ([final specification]({final_specification_path}), [change summary]({change_summary_path}))."
  - kind: technique
    id: verify-artifact-conformance
    technique:
      name: verify-artifact-conforms
      inputs:
        guide_map: requirements-refinement/README#planning-artifact-to-guide-map
  - kind: checkpoint
    id: finalization-confirmed
    message: "The final specification {spec_basename} and the change summary are staged for promotion to the canonical location ([final specification]({final_specification_path}), [change summary]({change_summary_path}))."
    options:
      - id: accepted
        label: Accept — staged for promotion
        description: Final specification and change summary are accepted; the user will promote them to the canonical location.
        effect:
          setVariable:
            finalization_accepted: true
      - id: revise
        label: Revise before finalizing
        description: The final specification or change summary needs revision before acceptance.
        effect:
          setVariable:
            finalization_accepted: false
exits:
  - id: accepted
    when: finalization_accepted == true
  - id: revision-requested
    isDefault: true
outcome:
  - The user has a promotion-ready specification alongside a human-readable account of what changed, so they can review and promote in one step
  - The user has explicitly accepted the result for promotion, so the workflow can complete knowing the outcome is endorsed
