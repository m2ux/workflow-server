id: intake-and-analyze
version: 1.4.0
name: Intake and Analyze
description: Capture the source-document and target-specification paths, record whether every source document is readable, classify each source as a meeting transcript or an unstructured document, and determine whether the specification is being augmented or created; then parse the sources against the current specification and produce a structured requirements analysis report, confirming each boundary with the user before proceeding.
variables:
  reads:
    - source_paths
    - target_doc_path
  writes:
    - name: analysis_confirmed
      type: boolean
      description: True once the requirements analysis is approved for application to the specification
      defaultValue: false
    - name: source_readable
      type: boolean
      description: True when every source document exists and carries content
      defaultValue: false
    - name: intake_record_path
      type: string
      description: Absolute path to the written intake record
      defaultValue: ""
    - name: requirements_analysis_path
      type: string
      description: Absolute path to the written requirements analysis report
      defaultValue: ""
    - name: classified_sources
      type: array
      description: Source documents paired with their classifications, each { path, type } where type is meeting or document. Empty until intake classifies them.
      defaultValue: []
    - name: spec_basename
      type: string
      description: Basename of the target specification
      defaultValue: ""
    - name: target_doc_exists
      type: boolean
      description: True when the target specification already exists and is being augmented; false when it is created from scratch
      defaultValue: false
required: true
steps:
  - kind: technique
    id: intake-sources
    technique: intake-sources
    actions:
      - action: message
        message: "The source set and the target specification are captured, each source with its own classification ([intake record]({intake_record_path}))."
        condition:
          type: simple
          variable: source_readable
          operator: ==
          value: true
  - kind: action
    id: source-unreadable-diagnostic
    when: source_readable == false
    actions:
      - action: message
        message: "A source document named for this run is missing or empty; the intake record names which ([intake record]({intake_record_path}))."
  - kind: checkpoint
    id: sources-confirmed
    when: source_readable == true
    message: "The source set and the target specification {target_doc_path} (target exists: {target_doc_exists}) are captured, each source with its own classification ([intake record]({intake_record_path}))."
    options:
      - id: confirmed
        label: Yes, proceed
        description: The source set, the classification each source carries, and the mode are correct.
      - id: revise
        label: Correct the sources
        description: A source path, a source's classification, or the augment/create mode is wrong, or the set omits a document it should carry, and must be corrected before proceeding.
        effect:
          exit: revise
  - kind: technique
    id: analyze-source
    technique: analyze-source
    when: source_readable == true
    actions:
      - action: message
        message: "The source documents are parsed into new, updated, and deprecated requirements with a source-coverage matrix ([analysis report]({requirements_analysis_path}))."
  - kind: checkpoint
    id: analysis-confirmed
    when: source_readable == true
    message: "The requirements analysis derived from the source set is ready to apply to the specification ([analysis report]({requirements_analysis_path}))."
    options:
      - id: confirmed
        label: Yes, apply this analysis
        description: Analysis is accurate and reflects every source faithfully.
        effect:
          setVariable:
            analysis_confirmed: true
      - id: revise
        label: Revise the analysis
        description: Analysis misreads a source, misses changes, or leaves a source unread, and must be revised before proceeding.
        effect:
          exit: revise
exits:
  - id: source-unreadable
    when: source_readable == false
  - id: analysis-confirmed
    when: analysis_confirmed == true
    isDefault: true
  - id: revise
    immediate: true
outcome:
  - The workflow can trust where to read from and where to write to — both paths exist and are confirmed correct by the user
  - Downstream activities know how to read each source, which classification it carries, and whether they are augmenting an existing specification or creating a new one
  - A source with nothing to read is settled at the boundary, so no pass runs against an incomplete set
  - Every requirement change the sources imply is pinned to a stable identifier the specification can be updated against
  - The user has signed off that the analysis faithfully reflects every source, so the update can proceed without second-guessing scope
