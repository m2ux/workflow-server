id: report-failure
version: 1.4.0
name: Report Failure
description: Compile a failure report describing the unresolved critical issues, the correction history, and the manual resolution required when refinement cannot complete automatically; no specification is promoted.
variables:
  reads:
    - source_path
    - target_doc_path
  writes:
    - name: failure_report_path
      type: string
      description: Absolute path to the written failure report
      defaultValue: ""
required: true
steps:
  - kind: technique
    id: report-failure
    technique: report-failure
    actions:
      - action: message
        message: "The unresolved critical issues, the correction history, and the manual resolution each issue needs are on record ([failure report]({failure_report_path}))."
  - kind: checkpoint
    id: failure-acknowledged
    message: "Refinement stops with unresolved critical issues and stages no specification for promotion ([failure report]({failure_report_path}))."
    blocking: true
    options:
      - id: acknowledged
        label: Acknowledged
        description: The failure report has been reviewed; manual intervention will follow outside the workflow.
outcome:
  - The user knows exactly which critical issues blocked refinement and what manual resolution each one needs
  - No unvalidated specification reaches the canonical location — the prior state is preserved until a human intervenes
