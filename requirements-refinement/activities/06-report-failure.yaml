id: report-failure
version: 1.4.0
name: Report Failure
description: Compile a failure report describing the unresolved critical issues, the correction history, and the manual resolution required when refinement cannot complete automatically; no specification is promoted.
variables:
  reads:
    - source_path
    - target_doc_path
  writes:
    - name: failure_report_path
      type: string
      description: Absolute path to the written failure report
      defaultValue: ""
required: true
steps:
  - kind: technique
    id: report-failure
    technique: report-failure
    actions:
      - action: message
        message: "Refinement stops with unresolved critical issues and stages no specification for promotion. The issues, the correction history, and the manual resolution each one needs are on record ([failure report]({failure_report_path}))."
outcome:
  - The user knows exactly which critical issues blocked refinement and what manual resolution each one needs
  - No unvalidated specification reaches the canonical location — the prior state is preserved until a human intervenes
