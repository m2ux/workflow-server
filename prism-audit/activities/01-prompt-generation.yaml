id: prompt-generation
version: 1.2.0
name: Generate Audit Prompt
description: Compose a detailed audit prompt tailored to the codebase.
variables:
  reads:
    - audit_description
    - audit_output_path
    - target_path
  writes:
    - name: audit_prompt
      type: string
      description: Generated audit prompt text produced by the prompt-generation activity
    - name: audit_prompt_path
      type: string
      description: File path to the written audit-prompt.md artifact
    - name: audit_scopes
      type: array
      description: "Array of scope objects for triggering prism runs. Each scope: { target, output_subdir, pipeline_mode, analysis_focus }. Populated by prompt-generation based on codebase structure."
    - name: security_characteristics_count
      type: number
      description: Count of security-relevant patterns found in the target during reconnaissance. Gates the no-security-characteristics checkpoint (fires when 0).
      defaultValue: 0
steps:
  - kind: technique
    id: survey-structure
    technique: compose-audit-prompt::survey-structure
  - kind: technique
    id: identify-security-characteristics
    technique: compose-audit-prompt::identify-security-characteristics
  - kind: checkpoint
    id: no-security-characteristics
    message: No security-relevant patterns were found in {target_path}, which is the shape a purely presentational or data-only codebase takes.
    condition:
      type: simple
      variable: security_characteristics_count
      operator: ==
      value: 0
    options:
      - id: proceed
        label: Continue the audit
        description: The prompt is composed from the codebase's structure, with no security characteristics to ground its domains
      - id: abort
        label: Abort the audit
        description: The codebase carries no security surface for this audit to examine
        effect:
          transitionTo: deliver-audit
    blocking: true
  - kind: technique
    id: map-trust-boundaries
    technique: compose-audit-prompt::map-trust-boundaries
  - kind: technique
    id: map-audit-domains
    technique: compose-audit-prompt::map-audit-domains
  - kind: technique
    id: identify-cross-cutting-concerns
    technique: compose-audit-prompt::identify-cross-cutting-concerns
  - kind: technique
    id: compose-prompt
    technique: compose-audit-prompt::compose-prompt
    actions:
      - action: message
        message: "The audit prompt every analysis run for this audit reads: [audit-prompt.md]({audit_prompt_path})."
  - kind: technique
    id: build-audit-scopes
    technique: compose-audit-prompt::build-audit-scopes
outcome:
  - Prism runs against audit domains grounded in this codebase's actual architecture and risk exposure, rather than a generic security checklist
  - The analysis is partitioned into the discrete scopes each prism run will cover
transitions:
  - to: execute-analysis
    isDefault: true
