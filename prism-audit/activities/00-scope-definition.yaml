id: scope-definition
version: 1.5.0
name: Define Audit Scope
description: Collect the audit target, description, and output path.
variables:
  reads:
    - audit_description
    - audit_output_path
    - target_path
  writes:
    - name: audit_description
      type: string
      description: User's description of what to audit and any specific focus areas or concerns
      required: true
    - name: audit_output_path
      type: string
      description: Directory the audit artifacts are written to
      required: true
    - name: target_path
      type: string
      description: Path to the codebase or directory to audit
      required: true
steps:
  - kind: technique
    id: collect-inputs
    technique: collect-inputs
  - kind: technique
    id: validate-target
    technique: validate-target
  - kind: technique
    id: index-codebase
    technique:
      name: gitnexus-operations::analyze
      inputs:
        repo_path: target_path
  - kind: technique
    id: summarize-scope
    technique: summarize-scope
  - kind: checkpoint
    id: confirm-scope
    message: |-
      The audit scope and configuration, for confirmation before prompt generation:

      {scope_summary}
    options:
      - id: accept
        label: Proceed
        description: Begin analysing the codebase and generating the audit prompt
      - id: adjust
        label: Adjust scope
        description: Modify the target, description, or output path before proceeding
        effect:
          transitionTo: scope-definition
    blocking: true
  - kind: technique
    id: create-output-directory
    technique: create-output-folder
outcome:
  - Analysis can begin against a user-confirmed, validated target with a place to land its outputs
  - The target's call graph is indexed, so the prompt can be grounded in what actually calls what
transitions:
  - to: prompt-generation
    isDefault: true
